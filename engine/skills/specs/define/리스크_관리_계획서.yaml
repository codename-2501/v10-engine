name: "리스크 관리 계획서"
phase: DEFINE
type: document
model_preference: opus

# F4 섹션 분할 — 리스크 10개+ 규모면 식별·평가·대응을 단일 호출로 채우기 어려움.
sections:
  - name: "리스크 식별"
    outline: "리스크 등록부 테이블(리스크ID/분류/리스크명/상세/원인/영향영역). 최소 10개"
    target_tokens: 7000
  - name: "리스크 평가"
    outline: "리스크 매트릭스 테이블(리스크ID/영향도/확률/등급/근거) + 히트맵"
    target_tokens: 5000
  - name: "대응 전략"
    outline: "테이블(리스크ID/대응전략/구체안/담당/기한/예상비용)"
    target_tokens: 6000
  - name: "모니터링 계획"
    outline: "주기·지표·보고 체계 + 테이블(리스크ID/지표/임계값/주기/담당/보고대상)"
    target_tokens: 4000
  - name: "비상 계획"
    outline: "테이블(리스크ID/트리거/비상절차/의사결정권자/복구목표시간/커뮤니케이션)"
    target_tokens: 4000

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **리스크 식별** — 프로젝트 전 영역(기술/일정/인력/예산/외부환경)의 리스크를 체계적으로 식별. 리스크 등록부 테이블(리스크ID/분류/리스크명/상세설명/발생원인/영향영역) 작성. 최소 10개.
  2. **리스크 평가** — 각 리스크의 영향도(H/M/L)와 발생확률(H/M/L)을 평가한 리스크 매트릭스 테이블(리스크ID/리스크명/영향도/발생확률/리스크등급/평가근거) 작성. 리스크 히트맵(영향도×확률) 매트릭스 포함.
  3. **대응 전략** — 리스크별 대응 전략(회피/전가/완화/수용) 테이블(리스크ID/리스크명/대응전략/구체적대응방안/담당자/완료기한/예상비용) 작성.
  4. **모니터링 계획** — 리스크 모니터링 주기, 모니터링 지표, 보고 체계를 서술. 모니터링 항목 테이블(리스크ID/모니터링지표/임계값/모니터링주기/담당자/보고대상) 작성.
  5. **비상 계획** — 고위험 리스크 발생 시 비상 대응 절차를 서술. 비상 계획 테이블(리스크ID/트리거조건/비상대응절차/의사결정권자/복구목표시간/커뮤니케이션계획) 작성.

  ### 품질 기준
  - 리스크 ID 체계 일관성 (예: RSK-001)
  - 모든 리스크에 영향도와 발생확률 평가 완료
  - 대응 전략이 리스크 등급에 적합
  - 비상 계획에 트리거 조건과 복구 목표 시간 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 리스크 10개 이상
  □ 고위험 리스크 비상 계획 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "리스크 식별"
      - "리스크 평가"
      - "대응 전략"
      - "모니터링 계획"
      - "비상 계획"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "리스크 ID가 일관된 체계를 따르고 모든 리스크에 부여되어 있는지 검증"
    - "모든 리스크에 영향도와 발생확률이 평가되어 리스크 등급이 산정되었는지 검증"
    - "대응 전략이 리스크 등급에 적합하게 설정되어 있는지 검증"
    - "비상 계획에 트리거 조건과 복구 목표 시간이 명시되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
