name: "TO-BE 목표 시스템 정의서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **목표 시스템 구성도** — 목표 시스템의 전체 아키텍처를 텍스트 다이어그램 또는 구조화된 표로 표현. 구성 요소별 역할과 기술 스택 테이블(구성요소/역할/기술스택/선정사유/비고) 작성.
  2. **개선 기능** — AS-IS 대비 신규·개선 기능을 테이블(기능ID/분류/기능명/상세설명/개선유형/우선순위/관련AS-IS기능) 정리. 최소 10개.
  3. **기대효과** — 정량적·정성적 기대효과를 테이블(효과ID/분류/기대효과/측정지표/현재값/목표값)로 작성. 비즈니스 가치와 기술적 가치를 구분.
  4. **전환 전략** — 빅뱅/단계적/병행 전환 중 전략 선택 및 사유. 전환 단계별 계획 테이블(단계/기간/대상/활동/산출물/위험요소) 작성.
  5. **마이그레이션 계획** — 데이터 마이그레이션 범위, 대상 데이터 목록 테이블(데이터항목/소스/타겟/변환규칙/검증방법), 마이그레이션 절차, 롤백 계획 작성.

  ### 품질 기준
  - 목표 시스템 구성도에 기술 스택 선정 사유 포함
  - 개선 기능이 AS-IS 문제점과 명확히 연결
  - 기대효과에 정량적 목표값 필수 포함
  - 마이그레이션 계획에 롤백 시나리오 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 개선 기능 10개 이상
  □ 마이그레이션 롤백 계획 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "목표 시스템 구성도"
      - "개선 기능"
      - "기대효과"
      - "전환 전략"
      - "마이그레이션 계획"
    required_tables: 5
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "목표 시스템 구성도에 기술 스택 선정 사유가 포함되어 있는지 검증"
    - "개선 기능이 AS-IS 문제점과 명확히 연결(추적 가능)되는지 검증"
    - "기대효과에 정량적 목표값과 측정 지표가 명시되어 있는지 검증"
    - "마이그레이션 계획에 롤백 시나리오와 검증 방법이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
