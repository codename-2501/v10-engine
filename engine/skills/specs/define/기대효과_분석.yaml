name: "기대효과 분석"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **정량적 효과(ROI)** — 투자 대비 수익률(ROI) 산출. 비용 절감, 매출 증대, 생산성 향상 등을 테이블(효과ID/효과항목/현재비용/예상절감/산출근거/연간효과금액)로 정리. ROI 계산식과 근거 명시.
  2. **정성적 효과** — 고객 만족도, 브랜드 가치, 업무 효율성, 직원 만족도 등 정성적 효과를 테이블(효과ID/효과항목/현재상태/기대상태/측정방법/실현시기)로 정리.
  3. **비용 분석** — 초기 투자 비용, 운영 비용, 유지보수 비용을 연도별 테이블(비용항목/1차년도/2차년도/3차년도/합계/비고)로 상세 작성. TCO(총소유비용) 포함.
  4. **투자 회수 기간** — 투자 회수 기간(Payback Period) 산출. 연도별 누적 현금흐름 테이블(연도/투자비용/효과금액/순현금흐름/누적현금흐름) 작성. 손익분기점 명시.
  5. **리스크** — 기대효과 실현을 저해할 수 있는 리스크를 테이블(리스크ID/리스크항목/영향도/발생확률/영향받는효과/대응방안)로 정리. 최소 5개. 민감도 분석(최선/기본/최악 시나리오) 포함.

  ### 품질 기준
  - ROI 산출에 명확한 계산식과 근거 데이터 포함
  - 비용 분석에 TCO 관점의 3년 이상 비용 포함
  - 투자 회수 기간에 누적 현금흐름과 손익분기점 명시
  - 민감도 분석(최선/기본/최악 시나리오) 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ ROI 계산식 포함 확인
  □ 리스크 5개 이상
  □ 민감도 분석 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "정량적 효과(ROI)"
      - "정성적 효과"
      - "비용 분석"
      - "투자 회수 기간"
      - "리스크"
    required_tables: 5
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "ROI 산출에 명확한 계산식과 근거 데이터가 포함되어 있는지 검증"
    - "비용 분석에 TCO 관점의 3년 이상 비용이 포함되어 있는지 검증"
    - "투자 회수 기간에 누적 현금흐름 테이블과 손익분기점이 명시되어 있는지 검증"
    - "민감도 분석이 최선/기본/최악 시나리오를 포함하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
