name: "현황 진단 리포트"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **진단 범위** — 진단 대상(시스템/프로세스/조직), 진단 기간, 진단 방법론, 참여 인력, 제약 사항을 테이블(항목/내용)로 정리.
  2. **현황 분석** — 업무 프로세스, 시스템, 데이터, 인프라, 조직 역량 등 영역별 현황을 상세 분석. 영역별 성숙도 평가 테이블(영역/현황요약/성숙도레벨/근거/비고) 작성.
  3. **문제점** — 진단을 통해 도출된 문제점을 테이블(문제ID/영역/문제점/근본원인/영향도/긴급도/관련부서)로 정리. 최소 8개. 근본 원인 분석(Root Cause Analysis) 포함.
  4. **AI 적용 가능성** — 현행 업무/프로세스에 AI를 적용할 수 있는 영역을 평가한 테이블(적용ID/적용영역/현행방식/AI적용방안/기대효과/구현난이도/데이터준비도/우선순위) 작성. 최소 5개.
  5. **권장 사항** — 단기(3개월)/중기(6개월)/장기(12개월) 개선 권장 사항을 테이블(권장ID/시기/영역/권장사항/기대효과/필요자원/우선순위)로 정리.

  ### 품질 기준
  - 진단 범위에 대상과 방법론이 명확히 정의
  - 문제점에 근본 원인 분석 포함
  - AI 적용 가능성에 데이터 준비도 평가 포함
  - 권장 사항이 단기/중기/장기로 구분되어 실행 가능

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 문제점 8개 이상
  □ AI 적용 가능성 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "진단 범위"
      - "현황 분석"
      - "문제점"
      - "AI 적용 가능성"
      - "권장 사항"
    required_tables: 5
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "진단 범위에 대상, 기간, 방법론이 명확히 정의되어 있는지 검증"
    - "문제점에 근본 원인 분석이 포함되어 있는지 검증"
    - "AI 적용 가능성 평가에 데이터 준비도가 포함되어 있는지 검증"
    - "권장 사항이 단기/중기/장기로 구분되어 실행 가능한 수준인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
