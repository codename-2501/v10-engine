name: "파일럿 실행 계획서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **파일럿 범위** — 파일럿 대상 기능/프로세스, 범위 내(In-Scope)/범위 외(Out-of-Scope) 구분. 대상 기능 테이블(항목ID/기능명/상세설명/선정사유/제약사항) 작성.
  2. **파일럿 대상** — 파일럿 참여 대상(부서/사용자 그룹/지역 등)을 테이블(대상ID/대상그룹/인원수/역할/선정기준/참여기간)로 정리. 대상 선정 기준과 사유 서술.
  3. **파일럿 일정** — 파일럿 수행 일정 테이블(단계/기간/활동/담당/산출물/마일스톤) 작성. 준비-실행-평가-보고 단계 포함.
  4. **성공 기준** — 파일럿 성공/실패 판단 기준을 테이블(기준ID/성공기준/측정방법/목표값/최소충족조건/가중치)로 정의. 정량적 기준 포함. 최소 5개.
  5. **모니터링 방법** — 파일럿 기간 중 모니터링 항목, 수집 데이터, 모니터링 도구를 테이블(모니터링ID/항목/수집데이터/도구/주기/담당/임계값) 작성. 이슈 발생 시 대응 절차 서술.
  6. **확대 전략** — 파일럿 성공 시 전체 확대(Rollout) 전략. 확대 계획 테이블(단계/기간/대상범위/주요활동/필요자원/위험요소/성공기준) 작성. 단계적 확대 로드맵 포함.

  ### 품질 기준
  - 파일럿 범위가 전체 프로젝트 범위의 적절한 부분집합
  - 성공 기준에 정량적 목표값 필수 포함
  - 모니터링 방법에 임계값과 대응 절차 명시
  - 확대 전략에 단계적 로드맵과 각 단계별 성공 기준 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 6개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 성공 기준 5개 이상
  □ 확대 전략 로드맵 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":6,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "파일럿 범위"
      - "파일럿 대상"
      - "파일럿 일정"
      - "성공 기준"
      - "모니터링 방법"
      - "확대 전략"
    required_tables: 6
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "파일럿 범위가 전체 프로젝트 범위의 적절한 부분집합인지 검증"
    - "성공 기준에 정량적 목표값과 가중치가 포함되어 있는지 검증"
    - "모니터링 방법에 임계값과 이슈 대응 절차가 명시되어 있는지 검증"
    - "확대 전략에 단계적 로드맵과 각 단계별 성공 기준이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
