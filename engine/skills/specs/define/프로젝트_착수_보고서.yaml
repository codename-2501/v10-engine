name: "프로젝트 착수 보고서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 개요** — 프로젝트명, 배경, 목적, 기간, 예산 등 핵심 정보를 요약 테이블로 작성.
  2. **프로젝트 목표** — 비즈니스 목표와 기술 목표를 구분하여 목표별 성공 기준(정량적 지표 포함)을 테이블(목표ID/분류/목표/성공기준/측정방법)로 정리.
  3. **프로젝트 범위** — 범위 내(In-Scope)와 범위 외(Out-of-Scope)를 명확히 구분. 주요 산출물 목록을 테이블로 작성.
  4. **이해관계자** — 이해관계자 테이블(이름/역할/소속/책임/연락처/참여수준) 작성. 주요 의사결정권자를 명시.
  5. **일정 요약** — 전체 프로젝트 일정을 단계별로 요약한 마일스톤 테이블(단계/시작일/종료일/주요산출물/담당) 작성.
  6. **위험요소 개요** — 초기 식별된 주요 위험요소를 테이블(위험ID/위험요소/영향도/발생확률/대응방향)로 정리. 최소 5개.

  ### 품질 기준
  - 프로젝트 목표에 정량적 성공 기준 필수 포함
  - 범위 내/외 구분이 명확하고 모호한 항목 없음
  - 이해관계자 역할과 책임이 겹치지 않고 명확
  - 일정 마일스톤 간 논리적 순서 보장

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 위험요소 5개 이상
  □ 목표별 정량적 성공 기준 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 개요"
      - "프로젝트 목표"
      - "프로젝트 범위"
      - "이해관계자"
      - "일정 요약"
      - "위험요소 개요"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "프로젝트 목표에 정량적 성공 기준과 측정 방법이 명시되어 있는지 검증"
    - "범위 내/외 구분이 명확하고 모호한 항목이 없는지 검증"
    - "이해관계자 간 역할·책임 중복이 없는지 검증"
    - "일정 마일스톤이 논리적 순서를 따르는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
