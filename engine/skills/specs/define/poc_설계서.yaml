name: "PoC 설계서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **PoC 목적** — PoC 실시 배경, 검증 대상(기술/프로세스/비즈니스 가설), 핵심 질문(PoC를 통해 답하려는 질문), 예상 결과물을 서술.
  2. **PoC 범위** — 범위 내(In-Scope)와 범위 외(Out-of-Scope) 명확 구분. 대상 기능/시나리오 테이블(항목ID/대상/상세설명/선정사유/제약사항) 작성.
  3. **기술 스택** — PoC에 사용할 기술 스택 테이블(레이어/기술/버전/선정사유/라이선스/대안) 작성. 아키텍처 구성도 포함.
  4. **평가 기준** — PoC 결과를 평가할 기준 테이블(평가ID/평가항목/평가기준/측정방법/목표값/가중치) 작성. 정량적 기준 포함. 최소 5개.
  5. **PoC 일정** — PoC 수행 일정 테이블(단계/기간/활동/담당/산출물/마일스톤) 작성. 전체 PoC 기간과 단계별 세부 일정 포함.
  6. **성공 기준** — PoC 성공/실패 판단 기준을 테이블(기준ID/성공기준/판단방법/최소충족조건/의사결정사항)로 명확히 정의. Go/No-Go 의사결정 프로세스 서술.

  ### 품질 기준
  - PoC 목적에 검증할 가설이 명확히 정의
  - 평가 기준에 정량적 목표값과 가중치 포함
  - 성공 기준에 Go/No-Go 조건 명확
  - 일정에 마일스톤과 산출물 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 평가 기준 5개 이상
  □ Go/No-Go 의사결정 프로세스 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "PoC 목적"
      - "PoC 범위"
      - "기술 스택"
      - "평가 기준"
      - "PoC 일정"
      - "성공 기준"
    required_tables: 5
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "PoC 목적에 검증할 가설과 핵심 질문이 명확히 정의되어 있는지 검증"
    - "평가 기준에 정량적 목표값과 가중치가 포함되어 있는지 검증"
    - "성공 기준에 Go/No-Go 판단 조건이 명확히 정의되어 있는지 검증"
    - "기술 스택 선정 사유가 합리적이고 대안이 검토되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
