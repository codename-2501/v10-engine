name: "서비스 운영 정책서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **서비스 정책 개요** — 서비스 운영 목적, 적용 범위, 정책 관리 체계를 서술.
  2. **회원/인증 정책** — 회원 가입, 탈퇴, 인증 방식, 계정 잠금/복구 정책 상세 기술.
  3. **결제/환불 정책** — 결제 수단, 과금 체계, 환불 조건, 취소 정책을 테이블 포함 작성.
  4. **개인정보 처리 방침** — 수집 항목, 이용 목적, 보유 기간, 제3자 제공, 파기 절차를 테이블로 정리.
  5. **SLA 정의** — 서비스 수준 항목(가용성/응답시간/복구시간), 목표치, 보상 기준을 테이블로 작성.
  6. **보안 정책** — 접근 통제, 데이터 암호화, 감사 로그, 취약점 관리 정책 서술.

  ### 품질 기준
  - SLA 항목에 정량적 목표치(예: 99.9%) 필수
  - 개인정보 처리 방침이 관련 법규(개인정보보호법) 준거
  - 환불 정책에 구체적 조건과 절차 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ SLA 정량적 목표치 존재
  □ 개인정보 항목 구체적 나열

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "서비스 정책 개요"
      - "회원/인증 정책"
      - "결제/환불 정책"
      - "개인정보 처리 방침"
      - "SLA 정의"
      - "보안 정책"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "SLA 항목에 측정 가능한 정량적 목표치가 모두 명시되어 있는지 검증"
    - "개인정보 처리 방침이 법적 요건(수집항목/목적/보유기간/파기)을 충족하는지 검증"
    - "보안 정책이 접근 통제, 암호화, 감사 추적을 모두 다루는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
