name: "요구사항 정의서"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **기능 요구사항** — 요구사항 ID, 분류, 요구사항명, 상세 설명, 우선순위(P0/P1/P2), 관련 화면을 테이블로 작성. 최소 10개 이상.
  2. **비기능 요구사항** — 성능, 보안, 가용성, 확장성, 호환성 등 카테고리별 테이블(ID/카테고리/요구사항/목표치/측정방법) 작성.
  3. **제약 조건** — 기술적, 법적, 예산, 일정 제약을 구분하여 서술.
  4. **가정 사항** — 프로젝트 수행 시 전제하는 조건들을 번호 매겨 정리.
  5. **용어 정의** — 프로젝트 내 사용되는 주요 용어를 테이블(용어/정의/비고)로 정리.

  ### 품질 기준
  - 기능 요구사항 ID 체계 일관성 (예: FR-001)
  - 비기능 요구사항에 정량적 목표치 필수
  - 요구사항 간 상충·모순이 없어야 함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기능 요구사항 10개 이상
  □ 요구사항 간 모순 없음 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "기능 요구사항"
      - "비기능 요구사항"
      - "제약 조건"
      - "가정 사항"
      - "용어 정의"
    required_tables: 3
    min_chars: 3000
    min_section_body: 100
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "요구사항 간 상충 또는 모순이 없는지 교차 검증"
    - "모든 기능 요구사항에 고유 ID와 우선순위가 부여되어 있는지 검증"
    - "비기능 요구사항에 정량적 목표치와 측정 방법이 명시되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
