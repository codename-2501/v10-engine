name: "사용자 흐름도"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **사용자 유형 정의** — 시스템을 사용하는 사용자 유형(역할)을 테이블(사용자유형/역할설명/주요목표/접근권한/사용빈도)로 정리. 최소 3개 유형.
  2. **주요 경로(Happy Path)** — 사용자 유형별 핵심 업무 흐름을 테이블(경로ID/사용자유형/시작점/단계1→단계2→…→종료점/관련화면/소요시간)로 작성. 최소 5개 경로.
  3. **분기점 및 의사결정** — 흐름 내 분기 발생 지점을 테이블(분기ID/경로ID/분기지점/조건/분기A경로/분기B경로/기본경로)로 정리. 최소 5개 분기점.
  4. **예외 흐름** — 오류/이탈/권한부족 등 예외 상황별 흐름을 테이블(예외ID/경로ID/예외조건/시스템응답/사용자안내/복귀경로)로 작성. 최소 5개 예외.
  5. **화면 전환 매트릭스** — 화면 간 이동 관계를 테이블(출발화면/도착화면/전환조건/전환방식/사용자액션)로 작성.
  6. **흐름도 다이어그램 명세** — Mermaid 또는 텍스트 기반 흐름도로 주요 경로 최소 2개를 시각화. 시작/종료/분기/예외를 구분하여 표현.

  ### 품질 기준
  - 사용자 유형별 주요 경로 완전히 정의
  - 분기점에 조건과 기본 경로 명시
  - 예외 흐름에 복귀 경로 포함
  - 화면 전환 관계 누락 없음

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 사용자 유형 3개 이상
  □ 주요 경로 5개 이상
  □ 예외 흐름 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "사용자 유형 정의"
      - "주요 경로(Happy Path)"
      - "분기점 및 의사결정"
      - "예외 흐름"
      - "화면 전환 매트릭스"
      - "흐름도 다이어그램 명세"
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "사용자 유형별 주요 경로가 완전히 정의되어 있는지 검증"
    - "분기점에 조건과 기본 경로가 명시되어 있는지 검증"
    - "예외 흐름에 복귀 경로가 포함되어 있는지 검증"
    - "화면 전환 관계에 누락이 없는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
