name: "기능 백로그"
phase: DEFINE
type: document
model_preference: opus

# F4 섹션 분할 — 기능 15개+ 로 테이블이 장문이 되는 대형 문서.
sections:
  - name: "제품 개요"
    outline: "제품/서비스 목적, 대상 사용자, 핵심 가치"
    target_tokens: 2500
  - name: "백로그 분류 체계"
    outline: "Epic>Feature>Story 계층 + 라벨링 규칙 + 테이블(분류레벨/정의/예시/담당자)"
    target_tokens: 3000
  - name: "기능 목록"
    outline: "전체 기능을 테이블(기능ID/Epic/기능명/설명/사용자스토리/우선순위/SP/스프린트/담당/상태). 최소 15개"
    target_tokens: 10000
  - name: "우선순위 기준"
    outline: "MoSCoW/RICE 프레임워크 + 근거 테이블(기능ID/기준별점수/최종우선순위)"
    target_tokens: 4000
  - name: "스프린트 로드맵"
    outline: "테이블(스프린트/기간/배정기능/총SP/목표/마일스톤). 최소 4개 스프린트"
    target_tokens: 4000
  - name: "의존성 및 리스크"
    outline: "테이블(기능ID/선행기능/후행기능/의존유형/리스크/대응방안)"
    target_tokens: 4000

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **제품 개요** — 제품/서비스 목적, 대상 사용자, 핵심 가치를 간략히 서술.
  2. **백로그 분류 체계** — Epic > Feature > Story 계층 구조 정의, 분류 기준, 라벨링 규칙을 테이블(분류레벨/정의/예시/담당자)로 작성.
  3. **기능 목록** — 전체 기능을 테이블(기능ID/Epic/기능명/상세설명/사용자스토리/우선순위(P0/P1/P2)/스토리포인트/스프린트배정/담당자/상태)로 정리. 최소 15개. P0은 MVP 필수.
  4. **우선순위 기준** — MoSCoW 또는 RICE 등 우선순위 결정 프레임워크 명시. 각 기능의 우선순위 근거를 테이블(기능ID/기준항목별점수/최종우선순위)로 작성.
  5. **스프린트 로드맵** — 스프린트별 배정 기능을 테이블(스프린트/기간/배정기능/총SP/목표/마일스톤)로 작성. 최소 4개 스프린트.
  6. **의존성 및 리스크** — 기능 간 의존성을 테이블(기능ID/선행기능/후행기능/의존유형/리스크/대응방안)로 정리.

  ### 품질 기준
  - 모든 기능에 P0/P1/P2 우선순위 명시
  - 스토리포인트와 스프린트 배정 완료
  - 기능 간 의존성 식별 완료
  - MVP 범위(P0) 명확히 구분

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기능 15개 이상
  □ 스프린트 4개 이상
  □ P0/P1/P2 분류 완료

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "제품 개요"
      - "백로그 분류 체계"
      - "기능 목록"
      - "우선순위 기준"
      - "스프린트 로드맵"
      - "의존성 및 리스크"
    required_tables: 4
    min_chars: 3000
    min_section_body: 150
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 기능에 P0/P1/P2 우선순위가 명시되어 있는지 검증"
    - "스토리포인트와 스프린트 배정이 완료되었는지 검증"
    - "기능 간 의존성이 식별되고 리스크 대응방안이 포함되어 있는지 검증"
    - "MVP 범위(P0)가 명확히 구분되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
