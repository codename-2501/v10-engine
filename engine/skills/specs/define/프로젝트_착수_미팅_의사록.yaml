name: "프로젝트 착수 미팅 의사록"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **참석자** — 이름, 소속, 역할, 연락처를 테이블로 정리. 고객측/수행사측 구분 필수.
  2. **프로젝트 개요** — 프로젝트 배경, 목적, 범위, 기대 효과를 간결하게 서술.
  3. **논의 사항** — 미팅에서 다룬 주요 안건을 번호 매겨 정리. 각 안건별 발언 요약 포함.
  4. **결정 사항** — 합의된 내용을 테이블(#/결정내용/근거/담당)로 작성. 미결정 사항은 별도 명시.
  5. **액션 아이템** — 테이블(#/액션/담당자/기한/상태)로 작성. 모든 아이템에 구체적 기한 필수.
  6. **다음 단계** — 후속 미팅 일정, 다음 산출물, 주요 마일스톤 기술.

  ### 품질 기준
  - 참석자 테이블에 최소 3명 이상 기재
  - 결정 사항과 액션 아이템이 논의 사항과 논리적으로 연결
  - 모든 액션 아이템에 담당자와 기한 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 모든 액션 아이템에 담당자·기한 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "참석자"
      - "프로젝트 개요"
      - "논의 사항"
      - "결정 사항"
      - "액션 아이템"
      - "다음 단계"
    required_tables: 3
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "결정 사항이 논의 사항에서 도출된 내용과 일치하는지 검증"
    - "모든 액션 아이템에 담당자와 구체적 기한이 명시되어 있는지 검증"
    - "참석자 목록이 역할·소속과 함께 완전히 기재되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
