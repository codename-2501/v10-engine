name: "비즈니스 프로세스 흐름도"
phase: DEFINE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **비즈니스 프로세스 개요** — 핵심 비즈니스 프로세스 목록, 각 프로세스의 목적과 범위, 이해관계자를 서술.
  2. **주요 프로세스 흐름** — 각 핵심 프로세스를 텍스트 기반 흐름도(시작→단계→판단→종료)로 표현. 입력/출력 데이터, 담당 역할 명시. 테이블(프로세스명/트리거/입력/처리/출력/담당) 포함.
  3. **예외 처리 흐름** — 각 프로세스의 예외 상황과 대응 흐름을 서술. 에스컬레이션 경로 포함.
  4. **역할별 책임** — RACI 매트릭스 테이블(프로세스/역할별 R-A-C-I) 작성.

  ### 품질 기준
  - 프로세스 흐름에 시작점과 종료점이 명확
  - 판단(분기) 노드에 조건이 명시
  - RACI 매트릭스가 모든 주요 프로세스를 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 모든 프로세스에 시작/종료 명확
  □ RACI 매트릭스 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "비즈니스 프로세스 개요"
      - "주요 프로세스 흐름"
      - "예외 처리 흐름"
      - "역할별 책임"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 프로세스 흐름에 시작점과 종료점이 명확히 정의되어 있는지 검증"
    - "예외 처리 흐름이 주요 프로세스의 실패 시나리오를 충분히 커버하는지 검증"
    - "RACI 매트릭스가 모든 핵심 프로세스와 관련 역할을 누락 없이 포함하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
