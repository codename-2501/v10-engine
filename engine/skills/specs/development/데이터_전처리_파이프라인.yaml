name: "데이터 전처리 파이프라인"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **데이터 소스** — 입력 데이터 소스 목록, 포맷, 접근 방법, 데이터 볼륨을 테이블(소스명/포맷/접근방식/볼륨/갱신주기)로 정리.
  2. **정제 규칙** — 결측치 처리, 중복 제거, 데이터 타입 변환, 인코딩 처리 규칙을 테이블(규칙명/대상컬럼/처리방법/근거)로 정리.
  3. **변환 로직** — 정규화, 표준화, 범주형 인코딩, 날짜 변환 등 변환 로직 상세 서술. 변환 전후 데이터 예시 포함.
  4. **피처 엔지니어링** — 파생 변수 생성 로직, 피처 선택 기준, 차원 축소 방법 서술. 피처 목록을 테이블(피처명/생성로직/타입/설명)로 정리.
  5. **파이프라인 코드** — 전처리 파이프라인의 구현 코드 구조, 실행 순서, 설정 파라미터, 에러 핸들링, 재실행 전략 서술.

  ### 품질 기준
  - 정제 규칙이 모든 데이터 품질 이슈를 커버
  - 변환 로직에 변환 전후 예시 포함
  - 파이프라인 코드에 에러 핸들링 및 로깅 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 변환 전후 데이터 예시 존재
  □ 에러 핸들링 전략 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "데이터 소스"
      - "정제 규칙"
      - "변환 로직"
      - "피처 엔지니어링"
      - "파이프라인 코드"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "정제 규칙이 결측치, 중복, 타입 변환 등 주요 품질 이슈를 모두 커버하는지 검증"
    - "변환 로직에 변환 전후 데이터 예시가 포함되어 있는지 검증"
    - "파이프라인 코드에 에러 핸들링과 재실행 전략이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
