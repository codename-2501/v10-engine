name: "프론트엔드 컴포넌트 구현"
phase: DEVELOPMENT
type: code
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  화면 설계서와 디자인 시스템 정의서를 기반으로 프론트엔드 컴포넌트를 구현하세요.

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 구조** — 디렉토리 구조, 파일 네이밍 규칙, 모듈 구성
  2. **공통 컴포넌트** — Button, Input, Modal, Table 등 재사용 컴포넌트 (전체 코드)
  3. **페이지 컴포넌트** — 주요 화면별 페이지 컴포넌트 (전체 코드)
  4. **상태 관리** — 전역/로컬 상태 구조, 스토어 설정, 커스텀 훅
  5. **API 연동 레이어** — API 클라이언트, 요청/응답 타입, 에러 핸들링
  6. **라우팅 설정** — 페이지 라우트, 인증 가드, 레이아웃

  ### Vercel React Best Practices (MANDATORY — 전 코드에 적용)

  #### [CRITICAL] Waterfalls 제거
  - 독립적인 비동기 작업은 반드시 Promise.all()로 병렬 실행
  - await는 실제 값이 필요한 지점까지 지연 (async-defer-await)
  - Suspense를 활용한 스트리밍 렌더링
  - 순차 fetch 금지 — 병렬 데이터 페칭 필수

  #### [CRITICAL] 번들 크기 최적화
  - barrel file(index.ts re-export) 금지 — 직접 import
  - 무거운 컴포넌트는 dynamic import (next/dynamic, React.lazy)
  - 서드파티 스크립트는 hydration 이후 defer 로드
  - tree-shaking 가능한 named export만 사용

  #### [HIGH] 서버사이드 성능
  - React.cache()로 요청 단위 중복 제거
  - LRU 캐싱으로 크로스 요청 캐싱
  - 데이터 페칭 병렬화 (Promise.all + Suspense)
  - after()로 비차단 작업 처리

  #### [MEDIUM] 리렌더 최적화
  - React.memo로 불필요한 리렌더 방지
  - primitive 의존성 사용 (객체 참조 대신 값 비교)
  - useTransition/useDeferredValue로 비긴급 업데이트 분리
  - 상태는 functional setState 패턴 (prev => next)
  - lazy state initialization (useState(() => expensive()))

  #### [MEDIUM] 렌더링 성능
  - CSS class 배치 처리 (classList 활용)
  - content-visibility: auto로 오프스크린 최적화
  - 정적 JSX는 컴포넌트 외부로 호이스팅
  - SVG 최적화 (불필요한 속성 제거)

  #### [LOW-MEDIUM] JavaScript 성능
  - Map/Set으로 O(1) 조회
  - DOM 배치 업데이트
  - 정규식은 모듈 레벨에 호이스팅
  - 반복 순회 합치기 (combine iterations)

  #### Anthropic Frontend Design 원칙 (UI 품질)
  - 제네릭한 "AI가 만든 것 같은" UI 금지 — 독창적 디자인 지향
  - 기본 폰트(Inter, system-ui) 대신 프로젝트 맞춤 타이포그래피
  - 보라색 그라디언트, 예측 가능한 레이아웃, 쿠키커터 컴포넌트 금지
  - CSS 변수 기반 컬러 시스템 필수
  - 의도적인 모션/애니메이션 오케스트레이션
  - 비대칭 레이아웃, 오버랩, 텍스처 활용 권장

  ### 코드 품질 기준
  - TypeScript strict mode 필수
  - 모든 컴포넌트에 Props 타입 정의
  - 에러 바운더리 구현
  - 접근성(a11y) 준수 — aria 속성, 키보드 네비게이션
  - 반응형 디자인 — 모바일/태블릿/데스크톱

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 코드 블록 10개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ Vercel React Best Practices CRITICAL 규칙 전부 적용 확인
  □ TypeScript strict mode 적용
  □ 모든 컴포넌트에 Props 타입 정의됨

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"code_blocks":10,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 구조"
      - "공통 컴포넌트"
      - "페이지 컴포넌트"
      - "상태 관리"
      - "API 연동 레이어"
      - "라우팅 설정"
    has_code_blocks: true
    min_chars: 8000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 비동기 작업이 Promise.all로 병렬 처리되는지 검증 (Waterfall 금지)"
    - "barrel file import가 없는지 검증 (직접 import만 허용)"
    - "React.memo, useMemo, useCallback이 적절히 사용되는지 검증"
    - "TypeScript strict mode와 Props 타입이 모든 컴포넌트에 적용되는지 검증"
    - "웹 접근성(WCAG 2.1) 가이드라인 준수 여부 검증 — aria 속성, 키보드 네비게이션, 색상 대비"
    - "Vercel Web Interface Guidelines 디자인 규칙 준수 여부 검증"
    - "코드 리뷰 관점: Critical(즉시 수정) / Important(진행 전 수정) / Minor(기록) 기준으로 이슈 분류"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}

  추가 검증:
  - Vercel React Best Practices의 CRITICAL 규칙(Waterfalls, Bundle Size)이 준수되는지
  - 코드가 즉시 실행 가능한 완성 형태인지 (스텁/플레이스홀더 금지)
  판정: PASS 또는 FAIL + 구체적 사유
