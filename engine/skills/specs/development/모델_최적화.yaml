name: "모델 최적화"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **튜닝 전략** — 하이퍼파라미터 튜닝 방법론(Grid Search, Random Search, Bayesian Optimization 등), 선택 근거, 자동화 도구 서술.
  2. **탐색 공간** — 탐색 대상 하이퍼파라미터, 탐색 범위, 스텝, 분포를 테이블(파라미터/탐색범위/분포/스텝)로 정리.
  3. **실험 결과** — 주요 실험 결과를 테이블(실험ID/파라미터조합/메트릭값/학습시간)로 정리. 상위 5개 조합 상세 분석.
  4. **최적 파라미터** — 최종 선정된 최적 파라미터 조합, 선정 근거, 교차 검증 결과 서술.
  5. **성능 비교** — 베이스라인 대비 최적화 후 성능 개선을 테이블(메트릭/베이스라인/최적화후/개선율)로 정리. 통계적 유의성 검토 포함.

  ### 품질 기준
  - 탐색 공간이 합리적 근거 기반으로 설정
  - 실험 결과에 재현 가능한 수준의 상세 정보 포함
  - 성능 비교에 통계적 유의성 검토 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 베이스라인 대비 성능 개선율 명시
  □ 교차 검증 결과 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "튜닝 전략"
      - "탐색 공간"
      - "실험 결과"
      - "최적 파라미터"
      - "성능 비교"
    required_tables: 3
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "탐색 공간이 합리적 근거 기반으로 설정되어 있는지 검증"
    - "실험 결과가 재현 가능한 수준의 상세 정보를 포함하는지 검증"
    - "성능 비교에 통계적 유의성 검토가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
