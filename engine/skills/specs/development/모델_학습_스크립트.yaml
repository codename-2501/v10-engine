name: "모델 학습 스크립트"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **학습 환경** — 하드웨어(GPU/CPU/메모리), 소프트웨어(프레임워크, 라이브러리 버전), 의존성 관리, 재현성 보장 방법을 테이블(항목/사양/비고)로 정리.
  2. **하이퍼파라미터** — 학습률, 배치 크기, 에폭, 옵티마이저, 스케줄러 등 하이퍼파라미터를 테이블(파라미터/값/선택근거)로 정리. 탐색 범위 포함.
  3. **학습 코드** — 모델 학습 코드의 구조, 데이터 로딩, 학습 루프, 검증 루프, 조기 종료 로직 상세 서술. 주요 코드 블록 설명.
  4. **로깅** — 학습 과정 로깅 전략, 메트릭 추적(손실, 정확도 등), 실험 관리 도구(MLflow/W&B 등), 로그 포맷 서술.
  5. **체크포인트** — 모델 체크포인트 저장 전략, 저장 주기, 저장 경로, 최적 모델 선택 기준, 복원 방법 서술.

  ### 품질 기준
  - 학습 환경이 재현 가능한 수준으로 상세
  - 하이퍼파라미터에 선택 근거 포함
  - 로깅에 실험 관리 도구 연동 방안 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 재현성 보장 방법 명시
  □ 체크포인트 저장·복원 전략 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "학습 환경"
      - "하이퍼파라미터"
      - "학습 코드"
      - "로깅"
      - "체크포인트"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "학습 환경이 재현 가능한 수준으로 상세히 기술되어 있는지 검증"
    - "하이퍼파라미터에 선택 근거가 포함되어 있는지 검증"
    - "로깅 전략이 실험 관리 도구와 연동되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
