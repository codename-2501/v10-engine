name: "LLM 서비스 API 개발"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **API 설계** — RESTful/GraphQL API 엔드포인트, 요청/응답 스키마, 인증/인가, 버전 관리를 테이블(엔드포인트/메서드/설명/입력/출력)로 정리.
  2. **프롬프트 관리** — 프롬프트 버전 관리, 동적 템플릿 시스템, A/B 테스트 지원, 프롬프트 레지스트리 서술.
  3. **스트리밍** — SSE/WebSocket 스트리밍 구현, 청크 처리, 클라이언트 연동, 타임아웃, 재연결 전략 서술.
  4. **캐싱** — 시맨틱 캐싱 전략, 캐시 키 설계, TTL 정책, 캐시 히트율 목표, 무효화 전략을 테이블(캐시레이어/전략/TTL/적용대상)로 정리.
  5. **모니터링** — API 모니터링 메트릭(지연시간/처리량/에러율), 알림 규칙, 대시보드, 비용 추적, 로깅 서술.

  ### 품질 기준
  - API 설계에 요청/응답 스키마 상세 명세 포함
  - 스트리밍에 에러 핸들링 및 재연결 전략 포함
  - 모니터링에 비용 추적 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ API 스키마 명세 존재
  □ 모니터링 메트릭 및 알림 규칙 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "API 설계"
      - "프롬프트 관리"
      - "스트리밍"
      - "캐싱"
      - "모니터링"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "API 설계에 요청/응답 스키마 상세 명세가 포함되어 있는지 검증"
    - "스트리밍에 에러 핸들링 및 재연결 전략이 포함되어 있는지 검증"
    - "모니터링에 비용 추적이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
