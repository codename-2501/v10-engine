name: "챗봇 품질 평가 리포트"
phase: DEVELOPMENT
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **평가 방법론** — 평가 프레임워크, 평가 데이터셋 구성, 평가 환경, 평가 절차를 상세 서술.
  2. **정량 지표** — 인텐트 분류 정확도, 엔티티 추출 재현율, F1 스코어를 테이블(인텐트/정확도/재현율/F1/샘플수)로 정리. 전체 및 인텐트별 성능 분석.
  3. **정성 평가** — 대화 자연스러움, 응답 적절성, 사용자 만족도를 평가 기준별 테이블(평가항목/점수/평가근거)로 정리. 실제 대화 예시 포함.
  4. **오류 분석** — 주요 오류 유형, 발생 빈도, 원인 분석을 테이블로 정리. 혼동 행렬(Confusion Matrix) 요약 포함.
  5. **개선 방향** — 발견된 문제점에 대한 구체적 개선 방안, 우선순위, 예상 효과 서술.

  ### 품질 기준
  - 정량 지표에 통계적 유의성 언급
  - 오류 분석에 구체적 대화 예시 포함
  - 개선 방향이 발견된 문제점과 1:1 매핑

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ F1 스코어 등 핵심 지표 존재
  □ 개선 방향에 우선순위 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "평가 방법론"
      - "정량 지표"
      - "정성 평가"
      - "오류 분석"
      - "개선 방향"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "정량 지표가 인텐트별/전체 단위로 충분히 분석되어 있는지 검증"
    - "오류 분석이 구체적 대화 예시와 원인 분석을 포함하는지 검증"
    - "개선 방향이 발견된 문제점에 대해 실행 가능한 대책을 제시하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
