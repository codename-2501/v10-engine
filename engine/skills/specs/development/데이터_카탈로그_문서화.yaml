name: "데이터 카탈로그 문서화"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **카탈로그 구조** — 데이터 카탈로그 전체 구조, 분류 체계(도메인/레이어/주제영역), 네이밍 규칙, 카탈로그 도구(DataHub/Amundsen 등) 서술.
  2. **메타데이터** — 기술 메타데이터(스키마/타입/크기)와 비즈니스 메타데이터(정의/소유자/태그)를 테이블(데이터셋/컬럼/타입/설명/소유자/태그/갱신주기)로 정리.
  3. **데이터 계보** — 데이터 리니지(Lineage) 추적, 소스-변환-타깃 흐름, 영향 분석, 리니지 시각화 도구 서술.
  4. **접근 권한** — 데이터 접근 권한 정책, 역할 기반 접근 제어(RBAC), 민감 데이터 분류, 마스킹 규칙을 테이블(데이터셋/민감도/접근역할/마스킹규칙)로 정리.
  5. **검색** — 카탈로그 검색 기능, 검색 인덱스, 태그/라벨 체계, 인기도 기반 랭킹, 자연어 검색 지원 서술.

  ### 품질 기준
  - 메타데이터에 기술·비즈니스 메타데이터 모두 포함
  - 데이터 계보에 리니지 추적 방법 상세 서술
  - 접근 권한에 민감 데이터 분류 및 마스킹 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 데이터 리니지 추적 방법 존재
  □ 접근 권한 및 마스킹 규칙 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "카탈로그 구조"
      - "메타데이터"
      - "데이터 계보"
      - "접근 권한"
      - "검색"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "메타데이터에 기술·비즈니스 메타데이터가 모두 포함되어 있는지 검증"
    - "데이터 계보에 리니지 추적 방법이 상세히 서술되어 있는지 검증"
    - "접근 권한에 민감 데이터 분류 및 마스킹이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
