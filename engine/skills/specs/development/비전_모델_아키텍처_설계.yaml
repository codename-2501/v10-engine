name: "비전 모델 아키텍처 설계"
phase: DEVELOPMENT
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **모델 구조** — 전체 모델 아키텍처 개요, 입출력 사양, 파라미터 수, 계산 복잡도(FLOPs)를 테이블(레이어/타입/입력크기/출력크기/파라미터수)로 정리.
  2. **백본** — 백본 네트워크 선택(ResNet/EfficientNet/ViT 등), 선택 근거, 사전학습 가중치, 피처 추출 레벨 서술.
  3. **헤드** — 태스크 헤드(분류/감지/세그멘테이션) 구조, Neck(FPN/PANet 등), 앵커 설계, 출력 레이어 상세 서술.
  4. **손실 함수** — 손실 함수 선택(CE/Focal/Dice/IoU Loss 등), 선택 근거, 가중치 설정, 보조 손실 서술. 테이블(손실함수/적용대상/가중치/근거) 포함.
  5. **추론 파이프라인** — 추론 시 전처리, 후처리(NMS 등), 배치 추론, TensorRT/ONNX 최적화, 지연시간 목표 서술.

  ### 품질 기준
  - 모델 구조에 파라미터 수와 FLOPs 정보 포함
  - 백본 선택에 정량적 비교 근거 포함
  - 추론 파이프라인에 성능 최적화 전략 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 파라미터 수 및 FLOPs 명시
  □ 추론 지연시간 목표 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모델 구조"
      - "백본"
      - "헤드"
      - "손실 함수"
      - "추론 파이프라인"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모델 구조에 파라미터 수와 FLOPs 정보가 포함되어 있는지 검증"
    - "백본 선택에 정량적 비교 근거가 포함되어 있는지 검증"
    - "추론 파이프라인에 성능 최적화 전략이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
