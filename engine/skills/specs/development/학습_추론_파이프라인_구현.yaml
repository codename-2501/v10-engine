name: "학습·추론 파이프라인 구현"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **학습 루프** — 학습 파이프라인 구조, 데이터 로더, 학습/검증 루프, 조기 종료, 학습률 스케줄러, 분산 학습 설정 상세 서술.
  2. **추론 API** — 추론 서비스 API 설계, 엔드포인트, 요청/응답 스키마, 인증, 에러 처리를 테이블(엔드포인트/메서드/입력/출력/설명)로 정리.
  3. **배치 처리** — 배치 추론 파이프라인, 스케줄링, 병렬 처리, 큐 관리, 결과 저장 전략 서술.
  4. **성능 최적화** — 모델 경량화(양자화/프루닝/지식증류), GPU 메모리 최적화, 추론 속도 벤치마크를 테이블(최적화기법/적용전/적용후/개선율)로 정리.

  ### 품질 기준
  - 학습 루프에 분산 학습 및 재현성 보장 설정 포함
  - 추론 API에 요청/응답 스키마 명세 포함
  - 성능 최적화에 정량적 벤치마크 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 추론 API 스키마 명세 존재
  □ 성능 최적화 벤치마크 수치 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "학습 루프"
      - "추론 API"
      - "배치 처리"
      - "성능 최적화"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "학습 루프에 분산 학습 및 재현성 보장 설정이 포함되어 있는지 검증"
    - "추론 API에 요청/응답 스키마 명세가 포함되어 있는지 검증"
    - "성능 최적화에 정량적 벤치마크가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
