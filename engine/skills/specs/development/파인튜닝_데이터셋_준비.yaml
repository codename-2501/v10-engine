name: "파인튜닝 데이터셋 준비"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **데이터 수집** — 학습 데이터 소스, 수집 방법, 수집 규모, 라이선스, 개인정보 처리를 테이블(소스/수집방법/규모/포맷/라이선스)로 정리.
  2. **정제** — 노이즈 제거, 중복 제거, 품질 필터링, 유해 콘텐츠 필터링, 길이 필터링 규칙 서술.
  3. **포맷팅** — 학습 포맷(instruction/input/output, conversation 등), 토큰화 전략, 특수 토큰, 패딩/트렁케이션 규칙을 테이블(필드/설명/예시)로 정리.
  4. **품질 검증** — 데이터 품질 검증 기준, 샘플링 검수, 자동 검증 스크립트, 품질 메트릭을 테이블(검증항목/기준/결과/비고)로 정리.
  5. **분할** — train/validation/test 분할 비율, 분할 전략(랜덤/계층적), 데이터 누수 방지, 분할별 통계 서술.

  ### 품질 기준
  - 데이터 수집에 라이선스 및 개인정보 처리 포함
  - 포맷팅에 실제 데이터 예시 포함
  - 품질 검증에 자동화된 검증 방법 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 데이터 포맷 예시 존재
  □ 분할별 통계 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "데이터 수집"
      - "정제"
      - "포맷팅"
      - "품질 검증"
      - "분할"
    required_tables: 3
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "데이터 수집에 라이선스 및 개인정보 처리가 포함되어 있는지 검증"
    - "포맷팅에 실제 데이터 예시가 포함되어 있는지 검증"
    - "품질 검증에 자동화된 검증 방법이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
