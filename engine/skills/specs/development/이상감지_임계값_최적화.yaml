name: "이상감지 임계값 최적화"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **임계값 설정 방법** — 임계값 결정 방법론(통계적/ML 기반/도메인 전문가), 정적 vs 동적 임계값, 다변량 임계값 전략 서술.
  2. **ROC 분석** — ROC 커브 분석, AUC 수치, FPR-TPR 트레이드오프, 최적 운영점 도출 과정 서술. 테이블(임계값/TPR/FPR/AUC) 포함.
  3. **정밀도-재현율** — PR 커브 분석, F1 스코어 기반 최적 임계값, 비즈니스 비용 기반 최적화(오탐 비용 vs 미탐 비용)를 테이블(임계값/Precision/Recall/F1/비용)로 정리.
  4. **최적 임계값** — 최종 선정 임계값, 선정 근거, 운영 시나리오별 임계값 변동 전략, 자동 조정 메커니즘 서술.

  ### 품질 기준
  - ROC/PR 분석에 정량적 수치 포함
  - 비즈니스 비용 기반 최적화 고려
  - 운영 시 임계값 자동 조정 방안 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ AUC 수치 및 최적 운영점 명시
  □ 비용 기반 최적화 분석 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "임계값 설정 방법"
      - "ROC 분석"
      - "정밀도-재현율"
      - "최적 임계값"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "ROC/PR 분석에 정량적 수치가 포함되어 있는지 검증"
    - "비즈니스 비용 기반 최적화가 고려되어 있는지 검증"
    - "운영 시 임계값 자동 조정 방안이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
