name: "이미지 데이터 전처리 파이프라인"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **이미지 수집** — 이미지 데이터 소스, 수집 방법, 저장 형식, 데이터 볼륨, 라이선스를 테이블(소스/수집방법/포맷/해상도/수량)로 정리.
  2. **증강** — 데이터 증강 전략, 증강 기법(회전, 플립, 크롭, 색상 변환, Mixup 등), 증강 비율, 적용 조건을 테이블(기법/파라미터/적용확률/효과)로 정리.
  3. **라벨링** — 라벨링 도구, 라벨링 가이드라인, 품질 관리(IAA), 라벨 포맷(COCO/VOC/YOLO 등), 클래스 정의 서술.
  4. **전처리 코드** — 리사이즈, 정규화, 패딩, 배치 구성 등 전처리 파이프라인 코드 구조, 실행 순서, 설정 파라미터 서술.
  5. **품질 검증** — 이미지 품질 검증 기준(해상도, 블러, 노출), 라벨 정합성 검증, 데이터셋 분할(train/val/test) 전략, 클래스 불균형 대응 서술.

  ### 품질 기준
  - 증강 기법이 태스크 특성에 맞게 설계
  - 라벨링에 품질 관리(IAA) 기준 포함
  - 데이터셋 분할 전략이 데이터 누수 방지 고려

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 라벨링 가이드라인 및 IAA 기준 존재
  □ 데이터셋 분할 비율 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "이미지 수집"
      - "증강"
      - "라벨링"
      - "전처리 코드"
      - "품질 검증"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "증강 기법이 태스크 특성에 맞게 설계되어 있는지 검증"
    - "라벨링에 품질 관리(IAA) 기준이 포함되어 있는지 검증"
    - "데이터셋 분할 전략이 데이터 누수 방지를 고려하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
