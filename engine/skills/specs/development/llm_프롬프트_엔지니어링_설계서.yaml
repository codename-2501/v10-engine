name: "LLM 프롬프트 엔지니어링 설계서"
phase: DEVELOPMENT
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **프롬프트 설계 원칙** — 프롬프트 설계 철학, 역할 정의, 컨텍스트 관리, 출력 형식 제어, 일관성 보장 원칙 서술.
  2. **템플릿** — 주요 태스크별 프롬프트 템플릿, 시스템/유저/어시스턴트 메시지 구조, 변수 바인딩, 조건부 분기를 테이블(태스크/템플릿명/입력변수/출력형식)로 정리.
  3. **체인** — 프롬프트 체이닝 전략, 멀티스텝 추론 구조, 중간 결과 활용, 분기/병합 로직 서술. 체인 구조도 포함.
  4. **가드레일** — 입력 검증, 출력 필터링, 유해 콘텐츠 차단, 할루시네이션 방지, 길이 제한, 포맷 강제 규칙을 테이블(규칙/적용대상/방법/예시)로 정리.
  5. **평가** — 프롬프트 성능 평가 방법, A/B 테스트 설계, 평가 메트릭(정확도/일관성/관련성), 버전 관리 전략 서술.

  ### 품질 기준
  - 템플릿에 실제 사용 가능한 프롬프트 예시 포함
  - 가드레일이 안전성과 품질 모두 커버
  - 평가에 정량적 메트릭과 A/B 테스트 설계 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 프롬프트 템플릿 예시 존재
  □ 가드레일 규칙 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프롬프트 설계 원칙"
      - "템플릿"
      - "체인"
      - "가드레일"
      - "평가"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "템플릿에 실제 사용 가능한 프롬프트 예시가 포함되어 있는지 검증"
    - "가드레일이 안전성과 품질을 모두 커버하는지 검증"
    - "평가에 정량적 메트릭과 A/B 테스트 설계가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
