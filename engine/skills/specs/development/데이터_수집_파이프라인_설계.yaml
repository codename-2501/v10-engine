name: "데이터 수집 파이프라인 설계"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **소스 목록** — 데이터 소스 전체 목록, 소스 유형(DB/API/파일/스트림), 접근 정보, 데이터 형식을 테이블(소스명/유형/접근방식/포맷/갱신주기/볼륨)로 정리.
  2. **수집 방법** — 소스별 수집 방법(배치/실시간/CDC), 수집 도구(Airflow/Kafka/Spark 등), 데이터 추출 쿼리/API 호출 상세 서술.
  3. **스케줄** — 수집 스케줄, 의존성 관리, DAG 구조, 재시도 정책, SLA를 테이블(작업명/스케줄/의존성/SLA/재시도)로 정리.
  4. **모니터링** — 수집 상태 모니터링, 데이터 품질 모니터링, 메트릭(건수/지연/실패율), 대시보드, 알림 규칙 서술.
  5. **에러 처리** — 수집 실패 유형, 재시도 전략, 데드레터 큐, 수동 복구 절차, 에스컬레이션 규칙을 테이블(실패유형/대응방법/재시도횟수/에스컬레이션)로 정리.

  ### 품질 기준
  - 소스 목록이 모든 데이터 소스를 커버
  - 스케줄에 의존성 및 SLA 포함
  - 에러 처리에 복구 절차 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 수집 스케줄 및 SLA 명시
  □ 에러 처리 및 복구 절차 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "소스 목록"
      - "수집 방법"
      - "스케줄"
      - "모니터링"
      - "에러 처리"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "소스 목록이 모든 데이터 소스를 커버하는지 검증"
    - "스케줄에 의존성 및 SLA가 포함되어 있는지 검증"
    - "에러 처리에 복구 절차가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
