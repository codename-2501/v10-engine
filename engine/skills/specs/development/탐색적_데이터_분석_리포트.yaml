name: "탐색적 데이터 분석"
phase: DEVELOPMENT
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **데이터 개요** — 데이터셋 출처, 수집 기간, 규모(행/열), 스키마 정의를 테이블(컬럼명/타입/설명/결측률)로 정리. 데이터 버전 및 갱신 주기 포함.
  2. **통계 분석** — 기초 통계량(평균, 중앙값, 표준편차, 사분위수)을 수치형 변수별 테이블로 정리. 범주형 변수의 빈도 분포 포함.
  3. **분포·상관 분석** — 주요 변수의 분포 특성(정규성, 왜도, 첨도), 변수 간 상관계수 행렬, 다중공선성 검토 서술. 시각화 설명 포함.
  4. **이상치** — 이상치 탐지 방법(IQR, Z-score 등), 탐지 결과, 이상치 비율, 처리 방안을 테이블(변수/이상치수/비율/처리방안)로 정리.
  5. **피처 후보** — EDA 결과 기반 유망 피처 목록, 파생 변수 아이디어, 피처 중요도 예비 분석 서술.
  6. **결론** — EDA 핵심 발견사항 요약, 데이터 품질 이슈, 모델링 시 주의사항, 후속 작업 권고.

  ### 품질 기준
  - 기초 통계량이 모든 수치형 변수를 커버
  - 상관 분석에 다중공선성 검토 포함
  - 이상치 처리 방안이 구체적이고 근거 제시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기초 통계량 테이블 존재
  □ 이상치 탐지 결과 및 처리 방안 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "데이터 개요"
      - "통계 분석"
      - "분포·상관 분석"
      - "이상치"
      - "피처 후보"
      - "결론"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "기초 통계량이 모든 수치형 변수를 커버하는지 검증"
    - "상관 분석에 다중공선성 검토가 포함되어 있는지 검증"
    - "이상치 처리 방안이 구체적 근거와 함께 제시되는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
