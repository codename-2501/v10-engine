name: "배포 파이프라인 구축"
phase: INFRASTRUCTURE
type: code
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **CI/CD 파이프라인** — CI/CD 파이프라인 구성 코드(GitHub Actions/GitLab CI/Jenkins 등). 빌드→테스트→배포 단계별 정의. 코드 블록에 언어 명시.
  2. **빌드 스크립트** — Dockerfile, docker-compose, 빌드 스크립트 코드. 멀티스테이지 빌드, 캐시 최적화 포함.
  3. **배포 절차** — 환경별(dev/staging/prod) 배포 절차 코드. Blue-Green 또는 Canary 배포 전략 구현. 배포 승인 게이트 포함.
  4. **롤백 전략** — 자동/수동 롤백 절차 코드. 헬스 체크 기반 자동 롤백, DB 마이그레이션 롤백 포함.

  ### 품질 기준
  - 파이프라인에 테스트 게이트 포함
  - 배포 전략에 무중단 배포 구현
  - 롤백이 자동화되어 있고 검증 절차 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 코드 블록에 언어 명시
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 전체 코드 2000자 이상
  □ 롤백 전략 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":0,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "CI/CD 파이프라인"
      - "빌드 스크립트"
      - "배포 절차"
      - "롤백 전략"
    required_tables: 0
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "CI/CD 파이프라인이 빌드→테스트→배포의 완전한 자동화를 구현하는지 검증"
    - "배포 전략이 무중단 배포를 보장하며 환경별 차이를 반영하는지 검증"
    - "롤백 전략이 장애 발생 시 신속한 복구를 가능하게 하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
