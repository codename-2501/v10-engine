name: "인프라 구성도"
phase: INFRASTRUCTURE
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **인프라 아키텍처** — 전체 인프라 구성을 텍스트 기반 다이어그램으로 표현. 클라우드 리전, VPC, 서브넷, 가용영역 구분.
  2. **서버 구성** — 테이블(서버명/역할/인스턴스타입/vCPU/메모리/스토리지/OS/포트/수량)로 정리. 오토스케일링 설정 포함.
  3. **네트워크 구성** — VPC CIDR, 서브넷 설계(Public/Private), 라우팅 테이블, NAT 게이트웨이, 로드밸런서 구성을 테이블 포함 기술.
  4. **보안 그룹** — 보안 그룹/방화벽 규칙을 테이블(그룹명/인바운드규칙/아웃바운드규칙/적용대상)로 정리.

  ### 품질 기준
  - 인프라 다이어그램에 네트워크 경계 표현
  - 서버 구성에 고가용성(HA) 설계 반영
  - 보안 그룹에 최소 권한 원칙 적용

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 텍스트 기반 인프라 다이어그램 존재
  □ 보안 그룹 최소 권한 원칙 반영

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "인프라 아키텍처"
      - "서버 구성"
      - "네트워크 구성"
      - "보안 그룹"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "인프라 아키텍처가 고가용성과 장애 복구를 고려한 설계인지 검증"
    - "서버 구성이 예상 트래픽과 성능 요구사항에 적합한지 검증"
    - "보안 그룹이 최소 권한 원칙을 준수하며 불필요한 포트가 열려있지 않은지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
