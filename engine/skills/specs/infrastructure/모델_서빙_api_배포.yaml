name: "모델 서빙 API 배포"
phase: INFRASTRUCTURE
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **서빙 아키텍처** — 모델 서빙 전체 아키텍처(동기/비동기, 배치/실시간), 서빙 프레임워크 선택(TorchServe, TF Serving, Triton 등), 텍스트 기반 아키텍처 다이어그램 포함.
  2. **API 엔드포인트** — RESTful/gRPC API 설계, 엔드포인트 목록을 테이블(메서드/경로/설명/요청형식/응답형식/인증여부/Rate Limit)로 작성. 요청/응답 스키마 예시 포함.
  3. **스케일링** — 오토스케일링 정책, HPA/VPA 설정, 스케일 아웃/인 기준을 테이블(메트릭/임계값/스케일방향/최소인스턴스/최대인스턴스/쿨다운)로 정리.
  4. **모니터링** — 서빙 레이턴시, 처리량, 에러율 등 핵심 메트릭, 헬스체크 설정, 알림 규칙을 테이블(메트릭명/수집방법/임계값/알림조건/알림채널)로 작성.
  5. **A/B 테스트** — A/B 테스트 전략, 트래픽 분배 방식, 실험 설계, 통계적 유의성 기준을 테이블(실험명/모델A/모델B/트래픽비율/성공메트릭/유의수준/최소샘플)로 정리.

  ### 품질 기준
  - 서빙 아키텍처에 지연시간(latency) SLA 명시
  - API 설계에 버저닝 전략 포함
  - 스케일링 정책에 비용 최적화 고려
  - A/B 테스트에 통계적 유의성 기준 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ API 요청/응답 스키마 예시 존재
  □ 오토스케일링 임계값 수치 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "서빙 아키텍처"
      - "API 엔드포인트"
      - "스케일링"
      - "모니터링"
      - "A/B 테스트"
    required_tables: 4
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "서빙 아키텍처가 지연시간 SLA와 처리량 요구사항을 충족하는지 검증"
    - "API 설계가 RESTful 원칙을 준수하고 버저닝이 적용되었는지 검증"
    - "A/B 테스트 설계가 통계적으로 유효한 실험 결과를 도출할 수 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
