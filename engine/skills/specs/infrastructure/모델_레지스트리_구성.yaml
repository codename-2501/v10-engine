name: "모델 레지스트리 구성"
phase: INFRASTRUCTURE
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **레지스트리 선택** — 모델 레지스트리 도구 비교 분석(MLflow, Weights & Biases, SageMaker Registry 등). 선택 근거를 테이블(도구명/주요기능/장점/단점/라이선스/비용/선정결과)로 정리.
  2. **모델 버전 관리** — 모델 버전 넘버링 체계(Semantic Versioning 등), 브랜치 전략, 스테이지 관리(Staging/Production/Archived) 정의. 버전 전환 규칙을 테이블(스테이지/설명/전환조건/승인자/자동화여부)로 작성.
  3. **메타데이터** — 모델별 저장 메타데이터 스키마 정의. 학습 데이터셋, 하이퍼파라미터, 성능 메트릭, 의존성 정보를 테이블(메타데이터항목/데이터타입/필수여부/설명/예시값)로 작성.
  4. **접근 제어** — 역할 기반 접근 제어(RBAC) 정책, 모델 등록/조회/배포 권한 분리를 테이블(역할/모델등록/모델조회/모델배포/모델삭제/설정변경)로 정리.

  ### 품질 기준
  - 레지스트리 선택에 객관적 비교 분석 포함
  - 버전 관리 체계가 명확하고 일관성 있음
  - 메타데이터 스키마가 모델 재현성 보장에 충분
  - 접근 제어가 최소 권한 원칙 준수

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 레지스트리 도구 비교 분석 3개 이상
  □ RBAC 역할 3개 이상 정의

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "레지스트리 선택"
      - "모델 버전 관리"
      - "메타데이터"
      - "접근 제어"
    required_tables: 4
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "레지스트리 선택이 프로젝트 요구사항에 근거한 객관적 비교 분석인지 검증"
    - "모델 버전 관리 체계가 모델 생명주기를 완전히 추적 가능한지 검증"
    - "접근 제어가 보안 요구사항과 최소 권한 원칙을 충족하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
