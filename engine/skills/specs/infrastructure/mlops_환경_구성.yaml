name: "MLOps 환경 구성"
phase: INFRASTRUCTURE
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **컨테이너 설정** — Docker 이미지 구성, 베이스 이미지 선택 근거, 멀티스테이지 빌드 전략, GPU 지원 설정을 테이블(이미지명/베이스이미지/용도/크기/GPU지원여부)로 정리.
  2. **오케스트레이션** — Kubernetes/Docker Compose 등 오케스트레이션 도구 구성, 클러스터 아키텍처, 노드 구성, 네임스페이스 설계를 테이블(노드유형/수량/CPU/메모리/GPU/역할)로 작성.
  3. **GPU 관리** — GPU 리소스 할당 전략, NVIDIA 드라이버/CUDA 버전, GPU 스케줄링 정책, 멀티 GPU 설정을 테이블(GPU모델/VRAM/할당대상/드라이버버전/CUDA버전)로 정리.
  4. **스토리지** — 데이터/모델/로그별 스토리지 구성, PV/PVC 설계, 스토리지 클래스, 백업 연동을 테이블(스토리지명/유형/용량/마운트경로/접근모드/백업여부)로 작성.
  5. **네트워크** — MLOps 내부 네트워크 토폴로지, 서비스 디스커버리, Ingress 설정, TLS 구성, 방화벽 규칙을 테이블(서비스명/포트/프로토콜/접근범위/TLS여부)로 정리.

  ### 품질 기준
  - 컨테이너 이미지가 경량화 원칙 준수
  - GPU 리소스 할당이 학습/서빙 워크로드에 최적화
  - 스토리지 설계에 데이터 생명주기 고려
  - 네트워크 설정에 보안 원칙 반영

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ GPU 드라이버/CUDA 버전 명시
  □ 네트워크 보안 설정 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "컨테이너 설정"
      - "오케스트레이션"
      - "GPU 관리"
      - "스토리지"
      - "네트워크"
    required_tables: 5
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "컨테이너 설정이 재현 가능하고 경량화 원칙을 준수하는지 검증"
    - "GPU 관리가 학습/서빙 워크로드 요구사항에 최적화되었는지 검증"
    - "스토리지와 네트워크 구성이 보안 및 성능 요구사항을 충족하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
