name: "모델 모니터링 대시보드 구축"
phase: INFRASTRUCTURE
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **모니터링 메트릭** — 모델 성능 메트릭(정확도, F1, AUC 등), 시스템 메트릭(CPU, GPU, 메모리, 디스크), 비즈니스 메트릭(요청수, 응답시간, 전환율)을 테이블(메트릭명/유형/수집주기/수집방법/정상범위/단위)로 정리.
  2. **드리프트 감지** — 데이터 드리프트(입력 분포 변화)와 개념 드리프트(모델 성능 저하) 감지 방법, 통계 검정(KS-test, PSI 등), 감지 임계값을 테이블(드리프트유형/감지방법/통계검정/임계값/검사주기/조치방안)로 작성.
  3. **알림 규칙** — 알림 레벨(Info/Warning/Critical), 에스컬레이션 정책, 알림 채널(Slack, Email, PagerDuty 등)을 테이블(알림명/조건/레벨/채널/수신자/에스컬레이션)로 정리. 알림 피로(alert fatigue) 방지 전략 포함.
  4. **시각화** — 대시보드 레이아웃, 패널 구성, 차트 유형, 필터 기능을 테이블(패널명/차트유형/데이터소스/갱신주기/설명)로 작성. 대시보드 와이어프레임(텍스트 기반) 포함.

  ### 품질 기준
  - 모니터링 메트릭이 모델/시스템/비즈니스 3가지 관점 포괄
  - 드리프트 감지에 통계적 방법론 적용
  - 알림 규칙에 에스컬레이션 정책 명확
  - 대시보드 시각화에 실시간 갱신 주기 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 드리프트 감지 임계값 수치 명시
  □ 대시보드 와이어프레임 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모니터링 메트릭"
      - "드리프트 감지"
      - "알림 규칙"
      - "시각화"
    required_tables: 4
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모니터링 메트릭이 모델/시스템/비즈니스 관점을 균형 있게 포괄하는지 검증"
    - "드리프트 감지 방법이 통계적으로 유효하고 임계값이 적절한지 검증"
    - "알림 규칙이 알림 피로를 방지하면서 중요 이벤트를 놓치지 않는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
