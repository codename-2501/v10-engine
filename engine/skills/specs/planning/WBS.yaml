name: "WBS"
phase: PLANNING
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **WBS 구조** — 프로젝트를 단계→활동→작업 수준으로 분해. 최상위 단계(기획/설계/개발/테스트/인프라/납품)와 하위 작업을 계층적으로 표현.
  2. **일정 계획** — 테이블(WBS코드/작업명/담당/시작일/종료일/산출물/선행작업) 형식 작성. 전체 프로젝트 기간 커버.
  3. **마일스톤** — 주요 마일스톤(킥오프/설계완료/개발완료/테스트완료/납품) 테이블(마일스톤/예정일/완료기준/담당) 작성.
  4. **리스크 관리** — 리스크 목록(리스크/영향도/발생확률/대응전략/담당) 작성. 최소 5개.

  ### 품질 기준
  - WBS 코드 체계 일관성 (예: 1.1.1)
  - 일정에 선행 작업 의존성 명시
  - 마일스톤과 일정 계획의 정합성

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ WBS 코드 체계 일관성 확인
  □ 리스크 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "WBS 구조"
      - "일정 계획"
      - "마일스톤"
      - "리스크 관리"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "WBS 코드가 일관된 계층 체계를 따르는지 검증"
    - "일정 계획의 선행 작업 의존성이 논리적으로 타당한지 검증"
    - "마일스톤 일정이 세부 작업 일정과 정합하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
