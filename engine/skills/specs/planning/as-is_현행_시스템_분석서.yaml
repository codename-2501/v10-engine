name: "AS-IS 현행 시스템 분석서"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **현행 시스템 구성도** — 현재 시스템의 전체 아키텍처(서버, 네트워크, 외부 연동 등)를 텍스트 다이어그램 또는 구조화된 표로 표현. 구성 요소별 역할과 기술 스택 테이블(구성요소/역할/기술스택/버전/비고) 작성.
  2. **기능 목록** — 현행 시스템이 제공하는 전체 기능을 모듈별로 분류한 테이블(기능ID/모듈/기능명/상세설명/사용빈도/담당시스템) 작성. 최소 10개 이상.
  3. **데이터 흐름** — 주요 데이터의 생성-처리-저장-전달 흐름을 서술. 시스템 간 데이터 연동 현황 테이블(연동ID/소스시스템/타겟시스템/데이터항목/연동방식/주기) 작성.
  4. **문제점 및 개선사항** — 현행 시스템의 기능적·비기능적 문제점을 테이블(문제ID/분류/문제점/영향도/개선방향/우선순위)로 정리. 최소 5개.
  5. **운영 현황** — 현재 운영 인력, 운영 프로세스, SLA, 장애 이력, 유지보수 현황을 정리. 주요 운영 지표 테이블 포함.

  ### 품질 기준
  - 시스템 구성도에 모든 주요 구성 요소와 연동 관계 포함
  - 기능 목록이 모듈별로 체계적으로 분류
  - 데이터 흐름에 연동 방식(API/배치/실시간 등) 명시
  - 문제점에 영향도와 우선순위가 객관적 기준으로 평가

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기능 목록 10개 이상
  □ 문제점 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "현행 시스템 구성도"
      - "기능 목록"
      - "데이터 흐름"
      - "문제점 및 개선사항"
      - "운영 현황"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "시스템 구성도에 모든 주요 구성 요소와 연동 관계가 포함되어 있는지 검증"
    - "기능 목록이 모듈별로 체계적으로 분류되고 고유 ID가 부여되어 있는지 검증"
    - "데이터 흐름에서 연동 방식과 주기가 명확히 명시되어 있는지 검증"
    - "문제점의 영향도와 우선순위 평가가 객관적 기준에 따르는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
