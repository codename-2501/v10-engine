name: "유스케이스 시나리오"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **액터 정의** — 시스템과 상호작용하는 모든 액터(사용자/외부 시스템)를 정의. 각 액터의 역할과 목적 서술.
  2. **유스케이스 목록** — 테이블(UC ID/액터/유스케이스명/사전조건/기본흐름 요약/대안흐름 요약/사후조건) 작성. 최소 8개 유스케이스.
  3. **유스케이스 상세** — 각 유스케이스별 기본 흐름(단계별), 대안 흐름, 예외 흐름을 번호 매겨 상세 기술.
  4. **유스케이스 다이어그램** — 텍스트 기반 다이어그램으로 액터-유스케이스 관계 표현. include/extend 관계 명시.

  ### 품질 기준
  - 모든 유스케이스에 고유 UC ID 부여 (예: UC-001)
  - 기본 흐름은 최소 3단계 이상으로 기술
  - 각 유스케이스에 사전조건과 사후조건 모두 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 1개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 유스케이스 8개 이상
  □ 모든 유스케이스에 사전/사후 조건 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":1,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "액터 정의"
      - "유스케이스 목록"
      - "유스케이스 상세"
      - "유스케이스 다이어그램"
    required_tables: 1
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 액터가 최소 1개 이상의 유스케이스와 연결되어 있는지 검증"
    - "유스케이스 기본 흐름이 논리적으로 완전한 시나리오를 구성하는지 검증"
    - "대안 흐름과 예외 흐름이 기본 흐름의 분기를 적절히 다루는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
