name: "GAP 분석서"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **AS-IS vs TO-BE 비교** — 현행과 목표 시스템의 주요 영역별 비교 테이블(영역/AS-IS현황/TO-BE목표/GAP요약/개선필요도) 작성. 기능, 기술, 프로세스, 인프라 영역 포함.
  2. **기능 GAP** — 기능별 상세 GAP 분석 테이블(GAP-ID/기능영역/AS-IS기능/TO-BE기능/GAP유형/상세설명/영향범위) 작성. GAP 유형(신규/변경/제거)을 구분. 최소 8개.
  3. **기술 GAP** — 기술 스택, 아키텍처, 인프라 관점의 GAP 테이블(GAP-ID/기술영역/현행기술/목표기술/전환난이도/필요역량/비고) 작성.
  4. **프로세스 GAP** — 업무 프로세스 관점의 GAP 테이블(GAP-ID/프로세스명/AS-IS프로세스/TO-BE프로세스/변경사항/영향부서/교육필요여부) 작성.
  5. **우선순위** — 전체 GAP 항목의 우선순위를 비즈니스 가치와 구현 난이도 기준으로 평가한 테이블(GAP-ID/GAP요약/비즈니스가치/구현난이도/우선순위/근거) 작성.
  6. **이행 계획** — 우선순위에 따른 단계별 이행 계획 테이블(단계/기간/대상GAP/주요활동/필요자원/산출물/위험요소) 작성.

  ### 품질 기준
  - 모든 GAP 항목에 고유 ID 부여
  - 기능/기술/프로세스 GAP이 AS-IS/TO-BE 분석과 정합
  - 우선순위 평가에 객관적 기준 적용
  - 이행 계획이 우선순위와 일치

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 6개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기능 GAP 8개 이상
  □ 모든 GAP 항목에 고유 ID 부여 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":6,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "AS-IS vs TO-BE 비교"
      - "기능 GAP"
      - "기술 GAP"
      - "프로세스 GAP"
      - "우선순위"
      - "이행 계획"
    required_tables: 6
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 GAP 항목에 고유 ID가 부여되어 있고 추적 가능한지 검증"
    - "기능/기술/프로세스 GAP이 AS-IS와 TO-BE 분석 내용과 정합하는지 검증"
    - "우선순위 평가에 비즈니스 가치와 구현 난이도가 객관적 기준으로 적용되었는지 검증"
    - "이행 계획이 우선순위 결과와 일치하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
