name: "PRD"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **제품 비전** — 제품이 해결하는 문제, 비전 선언문, 핵심 가치 제안(Value Proposition), 시장 기회, 경쟁 차별화 포인트를 서술.
  2. **목표 사용자** — 사용자 페르소나를 최소 2개 정의. 페르소나별 테이블(항목/내용) 포함(이름/역할/목표/불편사항/기술숙련도/사용빈도). 사용자 세그먼트별 우선순위 명시.
  3. **핵심 기능** — 제품의 핵심 기능을 테이블(기능ID/기능명/상세설명/사용자가치/우선순위/대상페르소나/출시단계)로 정리. 최소 10개.
  4. **사용자 여정** — 주요 사용자 시나리오별 여정 맵(단계/사용자행동/터치포인트/감정/기회영역)을 테이블로 작성. 최소 2개 시나리오.
  5. **성공 지표(KPI)** — 핵심 성과 지표를 테이블(KPI-ID/지표명/정의/측정방법/현재값/목표값/측정주기)로 정리. 최소 5개.
  6. **출시 기준** — MVP 및 단계별 출시 기준을 테이블(출시단계/필수기능/품질기준/성능기준/승인권자)로 작성. Go/No-Go 판단 기준 명시.

  ### 품질 기준
  - 제품 비전이 구체적이고 측정 가능한 목표 포함
  - 핵심 기능이 사용자 페르소나의 불편사항과 연결
  - KPI에 모두 정량적 목표값 포함
  - 출시 기준에 Go/No-Go 조건 명확

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 핵심 기능 10개 이상
  □ KPI 5개 이상
  □ 사용자 페르소나 2개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "제품 비전"
      - "목표 사용자"
      - "핵심 기능"
      - "사용자 여정"
      - "성공 지표(KPI)"
      - "출시 기준"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "제품 비전이 구체적이고 측정 가능한 목표를 포함하는지 검증"
    - "핵심 기능이 사용자 페르소나의 불편사항과 명확히 연결되는지 검증"
    - "모든 KPI에 정량적 목표값과 측정 방법이 포함되어 있는지 검증"
    - "출시 기준에 Go/No-Go 판단 조건이 명확히 정의되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
