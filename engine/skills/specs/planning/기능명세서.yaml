name: "기능명세서"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 개요** — 프로젝트 목적, 범위, 대상 사용자, 핵심 가치 제안을 서술.
  2. **사용자 역할** — 시스템 사용자 유형(Role)과 각 역할의 권한·책임을 테이블로 정리.
  3. **기능 목록(P0/P1/P2)** — 우선순위별 기능 목록 테이블(기능ID/기능명/설명/우선순위/관련모듈). P0 최소 5개.
  4. **사용자 스토리** — "As a [역할], I want [기능], so that [목적]" 형식. 각 스토리에 인수 조건(AC) 포함.
  5. **비기능 요구사항** — 성능, 보안, 접근성 등 기능 외 요구사항 서술.
  6. **기술 스택** — 프론트엔드, 백엔드, DB, 인프라, AI/ML 기술 스택을 테이블로 정리.

  ### 품질 기준
  - 기능 목록의 모든 항목이 사용자 스토리와 매핑 가능
  - 사용자 역할별로 접근 가능한 기능이 구분
  - P0 기능에 대한 인수 조건이 구체적

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 기능↔사용자 스토리 매핑 일관성 확인
  □ P0 기능 최소 5개

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 개요"
      - "사용자 역할"
      - "기능 목록(P0/P1/P2)"
      - "사용자 스토리"
      - "비기능 요구사항"
      - "기술 스택"
    required_tables: 3
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "기능 목록의 모든 항목이 사용자 스토리와 1:1 또는 1:N 매핑되는지 검증"
    - "사용자 역할별 접근 가능 기능이 명확히 구분되는지 검증"
    - "기술 스택이 기능 요구사항을 충분히 지원하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
