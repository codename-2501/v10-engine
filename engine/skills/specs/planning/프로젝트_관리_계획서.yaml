name: "프로젝트 관리 계획서"
phase: PLANNING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 관리 방법론** — 적용 방법론(애자일/워터폴/하이브리드 등), 선정 사유, 프로세스 프레임워크, 단계별 활동 및 산출물을 상세 서술.
  2. **조직 구성** — 프로젝트 조직도, 역할별 책임 매트릭스(RACI) 테이블 작성. 의사결정 체계 명시.
  3. **의사소통 계획** — 회의체 운영 계획 테이블(회의명/목적/참석자/주기/산출물), 보고 체계, 이슈 에스컬레이션 절차 작성.
  4. **변경 관리** — 변경 요청 프로세스(접수→검토→승인→반영), 변경 영향 분석 기준, 변경 관리 위원회 구성, 변경 이력 관리 방안 서술.
  5. **품질 관리** — 품질 목표, 품질 보증 활동 테이블(활동/시기/대상/기준/담당), 품질 지표, 검토 및 감사 계획 작성.
  6. **일정 관리** — 일정 관리 도구, 일정 기준선, 진척 관리 방법, 일정 지연 시 대응 절차를 테이블과 함께 작성.

  ### 품질 기준
  - RACI 매트릭스의 모든 산출물에 Responsible 1인 이상 지정
  - 의사소통 계획에 에스컬레이션 단계가 명확
  - 변경 관리 프로세스에 승인 권한자 명시
  - 품질 지표에 정량적 기준 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ RACI 매트릭스 포함 확인
  □ 변경 관리 프로세스 단계 명시 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 관리 방법론"
      - "조직 구성"
      - "의사소통 계획"
      - "변경 관리"
      - "품질 관리"
      - "일정 관리"
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "RACI 매트릭스에 모든 산출물에 대해 Responsible이 1인 이상 지정되어 있는지 검증"
    - "의사소통 계획에 에스컬레이션 단계와 권한자가 명확한지 검증"
    - "변경 관리 프로세스의 각 단계별 승인 권한자가 명시되어 있는지 검증"
    - "품질 지표에 정량적 기준과 측정 방법이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
