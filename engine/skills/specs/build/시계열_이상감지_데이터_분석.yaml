name: "시계열·이상감지 데이터 분석"
phase: BUILD
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **시계열 특성** — 데이터 시간 범위, 샘플링 주기, 결측 패턴, 정상성 검정(ADF/KPSS), 자기상관 분석(ACF/PACF) 결과 서술.
  2. **계절성** — 계절성 분해(STL/seasonal_decompose) 결과, 주기 식별, 계절성 강도, 연/월/주/일 패턴 분석을 테이블(주기/강도/특성)로 정리.
  3. **트렌드** — 장기 트렌드 분석, 변화점(Changepoint) 탐지, 구간별 트렌드 특성, 비정상성 처리 방법 서술.
  4. **이상치 패턴** — 이상치 유형(점 이상치/맥락 이상치/집단 이상치), 탐지 방법(통계적/ML 기반), 탐지 결과를 테이블(시점/유형/값/탐지방법/심각도)로 정리.
  5. **피처** — 시계열 피처(래그, 롤링 통계, 푸리에 변환 등), 도메인 피처, 피처 중요도를 테이블(피처명/생성방법/중요도/설명)로 정리.

  ### 품질 기준
  - 정상성 검정 결과 통계량과 p-value 포함
  - 계절성 분석에 분해 결과 상세 서술
  - 이상치 패턴에 탐지 방법별 비교 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 정상성 검정 통계량 존재
  □ 이상치 탐지 결과 및 분류 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "시계열 특성"
      - "계절성"
      - "트렌드"
      - "이상치 패턴"
      - "피처"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "정상성 검정 결과에 통계량과 p-value가 포함되어 있는지 검증"
    - "계절성 분석에 분해 결과가 상세히 서술되어 있는지 검증"
    - "이상치 패턴에 탐지 방법별 비교가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
