name: "개발표준 정의서"
phase: BUILD
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **코드 컨벤션** — 언어별(Python/JavaScript/SQL 등) 코딩 스타일 규칙. 린터 설정, 포매터 설정 포함.
  2. **네이밍 규칙** — 변수, 함수, 클래스, 파일, DB 테이블/컬럼 네이밍 규칙을 테이블(대상/규칙/예시/안티패턴)로 정리.
  3. **폴더 구조** — 프로젝트 디렉토리 구조를 트리 형태로 표현. 각 디렉토리의 역할 설명.
  4. **Git 브랜치 전략** — 브랜치 모델(Git Flow/GitHub Flow 등), 브랜치 네이밍, 머지 정책, 커밋 메시지 규칙을 테이블 포함 기술.
  5. **코드 리뷰 기준** — 리뷰 체크리스트, 승인 조건, 리뷰어 할당 규칙 서술.
  6. **문서화 규칙** — 코드 주석, API 문서, README 작성 규칙 정의.

  ### 품질 기준
  - 코드 컨벤션에 구체적인 린터/포매터 설정 파일 포함
  - 네이밍 규칙에 예시와 안티패턴 모두 포함
  - Git 전략이 CI/CD와 연계

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 린터/포매터 설정 포함
  □ 커밋 메시지 규칙 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "코드 컨벤션"
      - "네이밍 규칙"
      - "폴더 구조"
      - "Git 브랜치 전략"
      - "코드 리뷰 기준"
      - "문서화 규칙"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "코드 컨벤션이 프로젝트 기술 스택의 모든 언어를 커버하는지 검증"
    - "네이밍 규칙이 일관성 있고 실제 적용 가능한 수준인지 검증"
    - "Git 브랜치 전략이 팀 규모와 배포 주기에 적합한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
