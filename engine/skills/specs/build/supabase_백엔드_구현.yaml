name: "Supabase 백엔드 구현"
phase: BUILD
type: code
model_preference: opus
backend_requirement: "supabase"

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  Supabase(Postgres + Auth + Realtime + Edge Functions + Storage)를
  백엔드로 사용해 앱 전체 데이터/인증/서버 로직을 구현하세요.

  ### Supabase 특성 반영 (MANDATORY)
  - Postgres 기반 — 일반 SQL 그대로 + RLS(Row Level Security)
  - supabase-js SDK 로 클라이언트 DB 접근
  - Realtime: postgres_changes subscription (INSERT/UPDATE/DELETE)
  - Auth: 이메일/비밀번호, Magic Link, OAuth, Phone OTP
  - Edge Functions: Deno 기반 서버리스 (HTTPS 트리거)
  - Storage: RLS 적용 가능한 버킷

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 초기화** — supabase init, 환경변수, client 생성
     (createClient 코드), types 생성 (supabase gen types)
  2. **Postgres 스키마 및 마이그레이션** — SQL 파일 기반
     (supabase/migrations/*.sql), 인덱스, 트리거
  3. **RLS 정책** — 테이블별 enable RLS + policy 정의 (SQL),
     role(anon/authenticated) 구분
  4. **Realtime 구독** — supabase.channel() + postgres_changes 리스너,
     클라이언트 훅 구현
  5. **Edge Functions** — Deno 함수 예시 (webhook, 스케줄, 외부 API),
     배포 명령
  6. **Auth 통합 및 Storage** — signInWithPassword, OAuth,
     Storage 버킷 + 서명 URL

  ### 품질 기준
  - 모든 테이블에 RLS 활성화 (Supabase 기본값 OFF → 명시적 ON 필요)
  - service_role 키는 서버 전용, 클라이언트 번들 노출 금지
  - migrations 는 순서 번호로 관리 (001, 002...)
  - supabase gen types로 TypeScript 타입 자동 생성
  - Edge Functions 환경변수 SUPABASE_SERVICE_ROLE_KEY 등 secrets로 관리
  - Realtime 구독 topic은 필터로 좁히기

  ### 출력 전 자가검증 (MANDATORY)
  □ 6개 필수 섹션 모두 작성 완료
  □ 코드 블록 8개 이상 (SQL + TypeScript)
  □ 모든 테이블에 RLS 활성화 + 정책 포함
  □ migrations SQL 파일 최소 1개 완성본
  □ Realtime 구독 예시 코드
  □ Edge Function 예시 1개

  <!-- SELF_CHECK: {"sections":6,"rls_tables":N,"functions":M,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 초기화"
      - "Postgres 스키마"
      - "RLS 정책"
      - "Realtime 구독"
      - "Edge Functions"
      - "Auth"
    has_code_blocks: true
    min_chars: 7000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 테이블에 RLS가 활성화(ALTER TABLE ... ENABLE ROW LEVEL SECURITY)되는지 검증"
    - "service_role key가 클라이언트 번들에 노출되지 않고 서버 전용으로 관리되는지 검증"
    - "migrations가 순차 번호로 관리되어 재현 가능한지 검증"
    - "supabase gen types로 TypeScript 타입이 자동 생성되는 흐름이 포함되는지 검증"
    - "Realtime 구독이 필터(row-level)로 좁혀져 불필요한 이벤트를 방지하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
