name: "데이터 검증 로직 구현"
phase: BUILD
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **검증 규칙** — 데이터 검증 규칙 목록, 규칙 유형(필수값/범위/형식/참조무결성/비즈니스로직), 우선순위를 테이블(규칙ID/유형/대상/조건/심각도)로 정리.
  2. **스키마 검증** — 스키마 정의(JSON Schema/Avro/Protobuf), 스키마 진화 전략, 호환성 검증, 버전 관리 서술.
  3. **이상치 탐지** — 통계 기반/ML 기반 이상치 탐지 규칙, 임계값 설정, 탐지 결과 처리(격리/경고/차단)를 테이블(탐지방법/대상/임계값/처리방식)로 정리.
  4. **알림** — 검증 실패 시 알림 규칙, 알림 채널(Slack/이메일/PagerDuty), 에스컬레이션 단계, 알림 피로 방지 전략 서술.
  5. **리포팅** — 데이터 품질 대시보드, 일별/주별 품질 리포트, 트렌드 분석, SLA 준수율을 테이블(메트릭/일일목표/주간목표/현재값)로 정리.

  ### 품질 기준
  - 검증 규칙이 유형별로 체계적 분류
  - 이상치 탐지에 임계값 설정 근거 포함
  - 리포팅에 SLA 준수율 추적 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 스키마 검증 및 진화 전략 존재
  □ 알림 에스컬레이션 규칙 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "검증 규칙"
      - "스키마 검증"
      - "이상치 탐지"
      - "알림"
      - "리포팅"
    required_tables: 3
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "검증 규칙이 유형별로 체계적으로 분류되어 있는지 검증"
    - "이상치 탐지에 임계값 설정 근거가 포함되어 있는지 검증"
    - "리포팅에 SLA 준수율 추적이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
