name: "모델 서빙 API 배포"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **서빙 아키텍처** — 모델 서빙 전체 아키텍처, 동기/비동기 처리 방식, 로드밸런싱 전략, 캐싱 계층을 서술.
  2. **엔드포인트 정의** — API 엔드포인트를 테이블(엔드포인트/HTTP메서드/요청형식/응답형식/인증방식/Rate Limit/타임아웃/설명)로 정리. 최소 5개 엔드포인트.
  3. **스케일링 전략** — 오토스케일링 정책을 테이블(메트릭/임계값/스케일아웃조건/스케일인조건/최소인스턴스/최대인스턴스/쿨다운)으로 작성. 수평/수직 스케일링 기준 포함.
  4. **A/B 테스트 설계** — 모델 버전별 트래픽 분배를 테이블(실험ID/모델버전A/모델버전B/트래픽비율/성공지표/최소샘플수/실험기간/판정기준)로 정리.
  5. **배포 전략** — Blue-Green/Canary/Rolling 배포 전략을 테이블(배포단계/대상환경/트래픽비율/모니터링항목/롤백조건/소요시간)로 작성.
  6. **성능 및 모니터링** — 서빙 성능 기준과 모니터링을 테이블(메트릭/목표값/경고임계값/위험임계값/측정방법/알림채널)로 정리. 지연시간/처리량/에러율 포함.

  ### 품질 기준
  - 엔드포인트 명세가 OpenAPI 수준으로 상세
  - 스케일링 전략에 구체적 수치 기준 포함
  - A/B 테스트에 통계적 판정 기준 명시
  - 배포 전략에 롤백 조건 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 엔드포인트 5개 이상
  □ 스케일링 수치 기준 포함
  □ 롤백 조건 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "서빙 아키텍처"
      - "엔드포인트 정의"
      - "스케일링 전략"
      - "A/B 테스트 설계"
      - "배포 전략"
      - "성능 및 모니터링"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "엔드포인트 명세가 OpenAPI 수준으로 상세한지 검증"
    - "스케일링 전략에 구체적 수치 기준이 포함되어 있는지 검증"
    - "A/B 테스트에 통계적 판정 기준이 명시되어 있는지 검증"
    - "배포 전략에 롤백 조건이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
