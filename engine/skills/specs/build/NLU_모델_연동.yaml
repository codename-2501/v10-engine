name: "NLU 모델 연동"
phase: BUILD
type: code
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **NLU 파이프라인 구성** — NLU 처리 파이프라인 코드. 토크나이저, 임베딩, 인텐트 분류기, 엔티티 추출기 구성. 파이프라인 설정 파일 포함.
  2. **학습 데이터 형식** — 학습 데이터 스키마 정의 코드. JSON/YAML 형식의 학습 데이터 구조, 데이터 로더, 전처리 코드 포함.
  3. **모델 서빙 연동** — 모델 서빙 엔드포인트 연동 코드. REST/gRPC 클라이언트, 요청/응답 직렬화, 헬스 체크 구현.
  4. **성능 최적화** — 추론 최적화 코드. 배치 처리, 캐싱, 모델 경량화, 비동기 처리 구현.

  ### 품질 기준
  - 파이프라인 구성이 모듈화되어 교체 가능
  - 모델 서빙 연동에 재시도/서킷브레이커 패턴 포함
  - 성능 최적화에 벤치마크 코드 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 코드 블록에 언어 명시
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 모듈화된 파이프라인 구조
  □ 에러 핸들링/재시도 로직 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":0,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "NLU 파이프라인 구성"
      - "학습 데이터 형식"
      - "모델 서빙 연동"
      - "성능 최적화"
    required_tables: 0
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "NLU 파이프라인이 인텐트 분류와 엔티티 추출을 모두 처리하는지 검증"
    - "모델 서빙 연동이 장애 상황(타임아웃/서버다운)에 대한 복원력을 갖추는지 검증"
    - "성능 최적화가 측정 가능한 개선 지표와 함께 제시되는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
