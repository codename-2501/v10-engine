name: "모델 성능 평가 리포트"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **평가 메트릭** — 사용 메트릭(Accuracy, Precision, Recall, F1, AUC-ROC 등) 정의, 선택 근거, 목표 수치를 테이블(메트릭/정의/목표값/달성값)로 정리.
  2. **혼동 행렬** — 혼동 행렬(Confusion Matrix) 결과, 클래스별 정밀도·재현율, 매크로/마이크로 평균 분석. 테이블 포함.
  3. **성능 차트** — 학습 곡선, ROC 커브, PR 커브, 예측 분포 등 핵심 시각화 설명. 차트별 인사이트 서술.
  4. **오류 분석** — 주요 오분류 패턴, 오류 원인 분석, 오류 샘플 예시를 테이블(샘플/실제값/예측값/오류원인)로 정리.
  5. **개선 방향** — 성능 개선을 위한 구체적 방안, 우선순위, 예상 효과, 추가 실험 계획 서술.

  ### 품질 기준
  - 평가 메트릭에 목표 대비 달성 수치 비교
  - 오류 분석에 구체적 샘플 예시 포함
  - 개선 방향이 오류 분석 결과와 직접 연계

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 혼동 행렬 결과 존재
  □ 오류 샘플 예시 3개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "평가 메트릭"
      - "혼동 행렬"
      - "성능 차트"
      - "오류 분석"
      - "개선 방향"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "평가 메트릭이 목표 대비 달성 수치를 비교하고 있는지 검증"
    - "오류 분석에 구체적 샘플 예시가 포함되어 있는지 검증"
    - "개선 방향이 오류 분석 결과와 직접 연계되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
