name: "모델 선정 보고서"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **후보 모델** — 검토 대상 모델 목록, 각 모델의 특성, 아키텍처 개요, 적용 사례를 테이블(모델명/유형/장점/단점/적용사례)로 정리.
  2. **비교 평가** — 후보 모델을 평가 기준(정확도, 학습 시간, 추론 속도, 메모리, 해석 가능성)별로 비교하는 테이블 작성. 정량적 수치 포함.
  3. **선정 근거** — 최종 선정 모델과 선정 사유를 비즈니스 요구사항, 기술적 적합성, 운영 편의성 관점에서 상세 서술.
  4. **벤치마크** — 선정 모델의 벤치마크 테스트 결과, 데이터셋별 성능, 기존 연구 대비 성능 비교를 테이블로 정리.
  5. **제약 사항** — 선정 모델의 한계점, 리스크, 대응 방안, 대안 모델 전환 조건 서술.

  ### 품질 기준
  - 후보 모델이 3개 이상 비교
  - 비교 평가에 정량적 수치 포함
  - 선정 근거가 비즈니스·기술·운영 3관점 모두 커버

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 후보 모델 3개 이상 비교
  □ 선정 근거에 3관점 분석 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "후보 모델"
      - "비교 평가"
      - "선정 근거"
      - "벤치마크"
      - "제약 사항"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "후보 모델이 3개 이상 비교되어 있는지 검증"
    - "비교 평가에 정량적 수치가 포함되어 있는지 검증"
    - "선정 근거가 비즈니스·기술·운영 관점을 모두 커버하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
