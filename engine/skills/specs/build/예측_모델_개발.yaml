name: "예측 모델 개발"
phase: BUILD
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **모델 선택** — 후보 예측 모델(ARIMA/Prophet/LSTM/Transformer 등), 선택 기준, 비교 결과를 테이블(모델/장점/단점/적합성)로 정리. 최종 선택 근거 서술.
  2. **학습** — 학습 데이터 구성, 시간 기반 분할, 학습 하이퍼파라미터, 학습 과정(손실 추이), 과적합 방지 전략 서술.
  3. **검증** — 교차 검증 방법(TimeSeriesSplit/Walk-forward), 검증 메트릭, 검증 결과를 테이블(Fold/RMSE/MAE/MAPE)로 정리.
  4. **예측 코드** — 예측 파이프라인 코드 구조, 입력 처리, 예측 수행, 결과 후처리, 에러 핸들링 서술.
  5. **성능** — 최종 모델 성능 요약, 베이스라인 대비 개선율, 예측 구간별 성능 차이, 한계점을 테이블(구간/RMSE/MAE/MAPE)로 정리.

  ### 품질 기준
  - 모델 선택에 3개 이상 후보 비교
  - 검증에 시계열 적합 교차 검증 방법 사용
  - 성능에 예측 구간별 분석 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 시계열 교차 검증 결과 존재
  □ 예측 구간별 성능 분석 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모델 선택"
      - "학습"
      - "검증"
      - "예측 코드"
      - "성능"
    required_tables: 3
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모델 선택에 3개 이상 후보가 비교되어 있는지 검증"
    - "검증에 시계열 적합 교차 검증 방법이 사용되었는지 검증"
    - "성능에 예측 구간별 분석이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
