name: "챗봇 시나리오 설계서"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **대화 시나리오 목록** — 전체 시나리오를 테이블(시나리오ID/시나리오명/트리거/대화흐름요약/우선순위)로 정리. 최소 10개.
  2. **인텐트 분류** — 인텐트 분류 체계를 테이블(인텐트ID/인텐트명/상위카테고리/예시발화/관련시나리오)로 작성. 계층적 분류 포함.
  3. **엔티티 정의** — 시스템에서 추출할 엔티티를 정의. 엔티티명, 유형(사전정의/커스텀), 값 목록, 동의어 포함.
  4. **폴백 전략** — 인식 실패 시 대응 전략. 재질문, 선택지 제공, 상담원 연결 등 단계별 폴백 로직 설계.
  5. **멀티턴 처리** — 다중 턴 대화 관리 전략. 컨텍스트 유지, 슬롯 필링, 대화 상태 관리 방안 서술.

  ### 품질 기준
  - 시나리오별 대화 흐름이 시작→진행→종료 완전한 구조
  - 인텐트별 최소 5개 예시 발화
  - 멀티턴 처리에 컨텍스트 유지 전략 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 시나리오 10개 이상
  □ 폴백 단계별 로직 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "대화 시나리오 목록"
      - "인텐트 분류"
      - "엔티티 정의"
      - "폴백 전략"
      - "멀티턴 처리"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 시나리오가 완전한 대화 흐름(시작→진행→종료)을 갖추는지 검증"
    - "인텐트 분류가 시나리오 목록과 일관되게 매핑되는지 검증"
    - "폴백 전략이 단계적 대응(재질문→선택지→상담원)을 포함하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
