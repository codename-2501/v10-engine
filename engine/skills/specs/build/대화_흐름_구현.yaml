name: "대화 흐름 구현"
phase: BUILD
type: code
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **대화 흐름 코드** — 대화 흐름 엔진의 핵심 구현 코드. 시나리오 기반 대화 라우팅, 상태 전이 로직, 응답 생성 로직 포함. 코드 블록에 언어 명시.
  2. **상태 관리** — 대화 상태(세션) 관리 코드. 컨텍스트 저장/조회, 슬롯 필링, 세션 타임아웃 처리 구현.
  3. **NLU 연동** — NLU 모델 호출 인터페이스 코드. 인텐트 분류, 엔티티 추출 결과를 대화 흐름에 연결하는 로직.
  4. **응답 생성 로직** — 템플릿 기반 응답 생성, 동적 응답 구성, LLM 기반 응답 생성 코드. 다국어 지원 구조 포함.

  ### 품질 기준
  - 코드에 타입 힌트와 docstring 포함
  - 에러 핸들링과 로깅 포함
  - 단위 테스트 코드 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 코드 블록에 언어 명시
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 전체 코드 3000자 이상
  □ 에러 핸들링 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":0,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "대화 흐름 코드"
      - "상태 관리"
      - "NLU 연동"
      - "응답 생성 로직"
    required_tables: 0
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "대화 흐름 코드가 시나리오 설계서의 시나리오를 구현하는지 검증"
    - "상태 관리가 멀티턴 대화의 컨텍스트를 올바르게 유지하는지 검증"
    - "에러 핸들링이 NLU 연동 실패, 타임아웃 등 주요 예외를 처리하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
