name: "예측 정확도 평가 리포트"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **RMSE/MAE** — 주요 평가 메트릭(RMSE, MAE, MAPE, R², SMAPE) 정의 및 결과를 테이블(메트릭/전체/구간1/구간2/구간3)로 정리. 메트릭 선택 근거 서술.
  2. **예측 차트** — 실제값 vs 예측값 시각화 설명, 구간별 예측 정확도, 잔차(Residual) 플롯 분석, 시계열 분해 관점 분석 서술.
  3. **오차 분석** — 오차 분포 분석, 시간대별/구간별 오차 패턴, 오차 원인(데이터/모델/외부요인)을 테이블(구간/평균오차/최대오차/원인)로 정리.
  4. **신뢰 구간** — 예측 신뢰 구간(80%/95%) 산출 방법, 구간별 커버리지 분석, 신뢰 구간 폭 변화 추이, 불확실성 정량화 서술. 테이블(구간/커버리지/평균폭) 포함.

  ### 품질 기준
  - RMSE/MAE가 구간별로 세분화 분석
  - 오차 분석에 원인별 분류 포함
  - 신뢰 구간 커버리지 분석 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 구간별 메트릭 수치 존재
  □ 신뢰 구간 커버리지 분석 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "RMSE/MAE"
      - "예측 차트"
      - "오차 분석"
      - "신뢰 구간"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "RMSE/MAE가 구간별로 세분화 분석되어 있는지 검증"
    - "오차 분석에 원인별 분류가 포함되어 있는지 검증"
    - "신뢰 구간 커버리지 분석이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
