name: "MLOps 환경 구성"
phase: BUILD
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **인프라 아키텍처** — MLOps 전체 인프라 구성도, 클라우드/온프레미스 선택 근거, 네트워크 토폴로지를 서술.
  2. **컨테이너 환경** — Docker/컨테이너 구성을 테이블(컨테이너명/베이스이미지/용도/리소스제한/포트/볼륨마운트/환경변수)로 정리. 최소 5개 컨테이너.
  3. **오케스트레이션** — Kubernetes/Docker Compose 등 오케스트레이션 구성을 테이블(서비스명/레플리카수/스케일링정책/헬스체크/재시작정책/네임스페이스)로 작성.
  4. **GPU 리소스 관리** — GPU 할당 전략을 테이블(워크로드/GPU유형/수량/메모리/스케줄링정책/우선순위/비용)로 정리. GPU 공유/분할 전략 포함.
  5. **모니터링 및 로깅** — 모니터링 스택 구성을 테이블(모니터링대상/메트릭/수집도구/대시보드/알림조건/알림채널/보존기간)로 작성. 모델 성능 드리프트 감지 포함.
  6. **CI/CD 파이프라인** — ML 모델 CI/CD 파이프라인을 테이블(단계/도구/트리거/입력/출력/성공기준/타임아웃)로 정리. 학습→평가→배포 자동화 포함.

  ### 품질 기준
  - 컨테이너 구성이 재현 가능하도록 상세 기술
  - GPU 리소스 관리 전략이 비용 효율적
  - 모니터링에 모델 드리프트 감지 포함
  - CI/CD가 학습부터 배포까지 자동화

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 컨테이너 5개 이상 정의
  □ 모델 드리프트 감지 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "인프라 아키텍처"
      - "컨테이너 환경"
      - "오케스트레이션"
      - "GPU 리소스 관리"
      - "모니터링 및 로깅"
      - "CI/CD 파이프라인"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "컨테이너 구성이 재현 가능하도록 상세히 기술되어 있는지 검증"
    - "GPU 리소스 관리 전략이 비용 효율적인지 검증"
    - "모니터링에 모델 드리프트 감지가 포함되어 있는지 검증"
    - "CI/CD가 학습부터 배포까지 자동화되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
