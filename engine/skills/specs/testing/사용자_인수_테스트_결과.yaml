name: "사용자 인수 테스트 결과"
phase: TESTING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **UAT 범위** — 인수 테스트 대상 기능, 테스트 참여자(고객측), 테스트 기간, 테스트 환경 정의.
  2. **테스트 케이스 결과** — 테이블(TC ID/기능/시나리오/기대결과/실제결과/판정(PASS/FAIL)/비고) 작성. 전체 통과율 요약.
  3. **사용자 피드백** — 테스트 참여자의 피드백을 테이블(#/피드백내용/심각도/카테고리/대응방안/반영여부)로 정리.
  4. **미해결 이슈** — 테스트 중 발견되었으나 미해결된 이슈 목록과 해결 계획.
  5. **최종 판정** — 인수 테스트 종합 판정(합격/조건부합격/불합격), 판정 근거, 후속 조치.

  ### 품질 기준
  - 테스트 케이스 통과율 명시
  - 미해결 이슈에 해결 기한 포함
  - 최종 판정에 객관적 근거 제시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 통과율 수치 명시
  □ 최종 판정 및 근거 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "UAT 범위"
      - "테스트 케이스 결과"
      - "사용자 피드백"
      - "미해결 이슈"
      - "최종 판정"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "테스트 케이스가 UAT 범위의 모든 기능을 커버하는지 검증"
    - "사용자 피드백에 대한 대응 방안이 구체적으로 제시되는지 검증"
    - "최종 판정이 테스트 결과와 피드백을 종합적으로 반영하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
