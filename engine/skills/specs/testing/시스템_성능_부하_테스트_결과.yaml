name: "시스템 성능 부하 테스트 결과"
phase: TESTING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 환경** — 서버 사양, 네트워크 구성, 테스트 도구(JMeter/k6/Locust 등), 테스트 데이터 규모를 테이블로 정리.
  2. **부하 시나리오** — 부하 테스트 시나리오(점진적 증가/스파이크/지속부하)별 설정값을 테이블(시나리오/동시사용자/요청빈도/지속시간/램프업) 작성.
  3. **성능 지표** — 테스트 결과를 테이블(시나리오/TPS/평균응답시간/P95응답시간/P99응답시간/에러율/CPU사용률/메모리사용률)로 정리. 목표치 대비 달성 여부 표시.
  4. **병목 분석** — 성능 병목 지점 식별, 원인 분석, 프로파일링 결과 서술. CPU/메모리/DB/네트워크별 분석.
  5. **개선 권고** — 병목별 구체적 개선 방안, 예상 효과, 구현 우선순위 서술.

  ### 품질 기준
  - 성능 지표에 P95/P99 퍼센타일 포함
  - 병목 분석에 근거 데이터(프로파일링) 포함
  - 개선 권고에 예상 성능 향상치 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ P95/P99 퍼센타일 지표 존재
  □ 목표치 대비 달성 여부 표시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 환경"
      - "부하 시나리오"
      - "성능 지표"
      - "병목 분석"
      - "개선 권고"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "성능 지표가 SLA 목표치와 비교되어 판정이 내려져 있는지 검증"
    - "병목 분석이 데이터 기반 근거와 함께 제시되는지 검증"
    - "개선 권고가 병목 지점과 1:1 매핑되며 실행 가능한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
