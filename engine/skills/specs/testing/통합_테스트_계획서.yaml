name: "통합 테스트 계획서"
phase: TESTING
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 범위** — 테스트 대상 모듈/기능, 테스트 제외 범위, 테스트 유형(통합/E2E/회귀) 정의.
  2. **테스트 환경** — 하드웨어/소프트웨어 환경, 테스트 데이터 준비 방안, 환경 구축 절차를 테이블(항목/사양/비고)로 정리.
  3. **테스트 전략** — 테스트 접근 방법, 테스트 레벨별 전략, 자동화 전략, 결함 관리 프로세스 서술.
  4. **일정** — 테스트 단계별 일정을 테이블(단계/활동/시작일/종료일/담당/산출물)로 작성.
  5. **리소스** — 테스트 인력, 도구, 라이선스 등 필요 리소스 정리.
  6. **리스크** — 테스트 리스크 식별 및 대응 방안 서술. 최소 5개.

  ### 품질 기준
  - 테스트 범위가 요구사항 정의서의 기능과 매핑
  - 테스트 전략에 자동화 범위와 도구 명시
  - 일정에 버퍼 기간 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 테스트 범위↔요구사항 매핑 존재
  □ 리스크 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 범위"
      - "테스트 환경"
      - "테스트 전략"
      - "일정"
      - "리소스"
      - "리스크"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "테스트 범위가 프로젝트 요구사항을 누락 없이 커버하는지 검증"
    - "테스트 전략이 테스트 유형별 접근 방법을 구체적으로 정의하는지 검증"
    - "일정과 리소스가 테스트 범위 대비 현실적인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
