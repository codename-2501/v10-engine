name: "화면 목록 정의서"
phase: DESIGN
type: document
model_preference: sonnet

# Stage 9: Dynamic Layer Selection
context_layers:
  - prd
  - design_system
  - current_task

# F4 섹션 분할 — 화면수가 20개+이면 단일 호출 한도 초과하던 문제 해소.
# min_items: 섹션별 최소 항목 수. F4가 생성 후 실제 행/ID 개수를 세어 미달
# 시 해당 섹션만 자동 재생성.
sections:
  - name: "화면 분류 체계"
    outline: "화면 그룹/모듈 분류 기준, 네이밍 규칙, ID 체계 서술 + 분류 테이블(그룹ID/그룹명/설명/포함화면수). 그룹은 프로젝트 규모에 맞춰 5~10개"
    target_tokens: 3000
    min_items: 5
  - name: "화면 목록"
    outline: "프로젝트 요구사항·기능 백로그에 등장하는 모든 화면을 빠짐없이 테이블(화면ID/화면명/화면그룹/URL경로/접근권한/화면유형/상위화면/설명)로 나열. 단순 CRUD도 개별 화면이어야 함. 경험적으로 중형 서비스는 30~50개, 엔터프라이즈는 50~100개. **누락 시 다음 섹션에서 참조 깨짐**. 최소 20개 이상 필수"
    target_tokens: 14000
    min_items: 20
  - name: "접근 권한 매트릭스"
    outline: "화면 목록 섹션의 모든 화면을 그대로 받아 역할별 권한 테이블(화면ID/화면명/관리자/일반사용자/게스트/비로그인) CRUD 수준. 화면 수가 화면 목록과 일치해야 함"
    target_tokens: 8000
    min_items: 20
  - name: "화면 계층 구조"
    outline: "화면 간 상하위 관계 테이블(화면ID/상위화면ID/깊이/네비게이션위치). 화면 목록의 모든 화면 포함"
    target_tokens: 5000
    min_items: 20
  - name: "URL 라우팅 설계"
    outline: "URL 패턴·파라미터·동적 라우팅 테이블(URL패턴/화면ID/HTTP메서드/파라미터/인증필요여부). 화면 목록의 모든 화면 포함"
    target_tokens: 5000
    min_items: 20
  - name: "화면 상태 요약"
    outline: "각 화면의 주요 상태 테이블(화면ID/로딩/빈/에러/정상). 화면 목록의 모든 화면 포함"
    target_tokens: 5000
    min_items: 20

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **화면 분류 체계** — 화면 그룹/모듈별 분류 기준, 네이밍 규칙, ID 체계를 서술. 분류 테이블(그룹ID/그룹명/설명/포함화면수)로 정리.
  2. **화면 목록** — 전체 화면을 테이블(화면ID/화면명/화면그룹/URL경로/접근권한/화면유형/상위화면/설명)로 정리. 최소 15개 화면.
  3. **접근 권한 매트릭스** — 사용자 역할별 화면 접근 권한을 테이블(화면ID/화면명/관리자/일반사용자/게스트/비로그인)로 작성. CRUD 수준으로 표기.
  4. **화면 계층 구조** — 화면 간 상하위 관계를 트리 구조 또는 테이블(화면ID/상위화면ID/깊이/네비게이션위치)로 표현.
  5. **URL 라우팅 설계** — URL 패턴, 파라미터, 동적 라우팅 규칙을 테이블(URL패턴/화면ID/HTTP메서드/파라미터/인증필요여부)로 정리.
  6. **화면 상태 요약** — 각 화면의 주요 상태(로딩/빈값/에러/정상)를 테이블(화면ID/로딩상태/빈상태/에러상태/정상상태)로 요약.

  ### 품질 기준
  - 모든 화면에 고유 ID와 URL 경로 부여
  - 접근 권한이 역할별로 명확히 정의
  - 화면 계층 구조에 누락 없음
  - URL 라우팅 규칙이 일관적

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 화면 15개 이상
  □ 접근 권한 매트릭스 완성

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "화면 분류 체계"
      - "화면 목록"
      - "접근 권한 매트릭스"
      - "화면 계층 구조"
      - "URL 라우팅 설계"
      - "화면 상태 요약"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 화면에 고유 ID와 URL 경로가 부여되어 있는지 검증"
    - "접근 권한이 역할별로 명확히 정의되어 있는지 검증"
    - "화면 계층 구조에 누락이 없는지 검증"
    - "URL 라우팅 규칙이 일관적인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
