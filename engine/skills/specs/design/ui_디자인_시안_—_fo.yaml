name: "UI 디자인 시안 — FO"
phase: DESIGN
type: html
model_preference: opus

# Stage 1: FO 화면마다 1 chunk (단일 호출 토큰 억제)
chunk_items_source:
  from_spec: "화면 목록 정의서"
  extract_patterns:
    - "(SC-[A-Z]{2,4}-\\d{3,4}|SCR-\\d{3,4})"
    - "([A-Z]{2,5}-[A-Z]{2,4}-\\d{3,4})"
  filter_regex: "(SC-AU-|SC-CW-|SC-WA-|SC-CB-|SCR-FO-)"

# Stage 9: Dynamic Layer Selection
context_layers:
  - prd
  - design_system
  - current_task
  - sibling_artifacts

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ★ 출력 규칙: <!DOCTYPE html>부터 </html>까지 완전한 HTML만 출력하세요.
  도구 호출(function_calls, invoke, Write, Bash 등)을 절대 하지 마세요.
  마크다운 코드 블록(```)으로 감싸지 마세요. HTML 텍스트를 직접 출력하세요.

  화면 설계서(와이어프레임)와 컴포넌트 정의서(디자인 시스템)를 기반으로
  **FO(Front Office — 고객/이용자) UI 디자인 시안**을 완전한 HTML+CSS로 구현하세요.

  ### 대상 화면 — FO만
  화면 설계서에서 **공개 페이지 + 이용자 전용 페이지**만 구현합니다:
  - 공개: 홈, 센터소개, 서비스안내, 이용안내, 상담신청, 컨설팅요청, 공지사항, 오시는길, FAQ
  - 이용자: 로그인/가입, 마이페이지, 상담내역, 알림, 챗봇
  - 관리자(BO) 화면은 이 산출물에 포함하지 마세요 — 별도 산출물입니다.
  - 화면설계서에 정의된 FO 화면을 빠짐없이 전부 구현하세요.

  ### 핵심 — 이것은 와이어프레임이 아닌 "완성된 디자인 시안"
  이 산출물은 고객이 보고 디자인 승인 여부를 판단하는 **최종 시안**입니다.
  텍스트+인풋만 나열한 와이어프레임은 절대 불가합니다.
  실제 서비스와 구분할 수 없는 수준의 시각적 완성도가 필요합니다.
  고객이 "이 화면 그대로 만들어주세요"라고 할 수 있어야 합니다.

  각 화면에 반드시 포함할 것:
  - 완성된 네비게이션 바 (로고, 메뉴, 사용자 정보)
  - 스타일링된 카드, 버튼, 폼 컴포넌트 (border-radius, shadow, 색상, 간격 모두 적용)
  - 실제 이미지 대체용 placeholder (배경 그라디언트 + 아이콘)
  - 호버/포커스/활성 상태 CSS
  - 실제 데이터로 채워진 테이블, 리스트, 카드
  - 푸터 영역

  ### HTML 구현 규칙
  - 완전한 standalone HTML 문서 (Pretendard 폰트 CDN만 허용)
  - CSS는 <style> 태그 안에 전부 포함
  - 반응형 (모바일 375px ~ 데스크탑 1280px)
  - 각 화면은 <section> 태그로 구분, 화면 ID(SCR-XXX)와 이름을 표기
  - 실제 프로젝트 맥락에 맞는 더미 데이터 사용 (Lorem ipsum 금지)
  - 호버/포커스 상태 스타일 포함
  - 모든 인풋/버튼은 CSS로 완전히 스타일링 (브라우저 기본 스타일 금지)

  ### 디자인 퀄리티 규칙
  - 반드시 다크 테마: 배경 #111318, 카드 #1a1d24, 텍스트 #eaedf2. 라이트 테마(흰 배경) 절대 금지
  - body { background: #111318 } 필수
  - Pretendard Variable 웹폰트 사용
  - 프로젝트 맥락에 맞는 accent 색상 (실버케어→따뜻한 앰버 #e8a838 계열)
  - 보라색 그라디언트, 시스템 폰트, AI스러운 정형화 레이아웃 금지
  - 넉넉한 여백: 섹션 간 48px 이상, 카드 padding 24px 이상
  - 대담한 타이포 계층: 히어로 32~48px weight 800, 본문 15px
  - 카드: backdrop-filter blur, border rgba(255,255,255,.06), border-radius 14px
  - 버튼: border-radius 99px (pill), hover 시 ring 피드백
  - 인풋: 다크 배경(#111318), 밝은 border, 둥근 모서리, focus 시 accent ring
  - 테이블: th uppercase 11px letter-spacing .05em, 행 hover 배경 변화

  ### 절대 금지 — 디자인 시스템 콘텐츠 혼입
  - CSS 변수 팔레트 표, 타이포 스케일 표, 컴포넌트 쇼케이스 섹션 금지
  - 페이지 단위 시안만 포함

  ### 출력 전 자가검증
  □ FO 전체 화면이 빠짐없이 포함되었는가
  □ BO(관리자) 화면이 포함되지 않았는가
  □ 다크 테마 적용 확인
  □ 각 화면에 SCR-XXX ID가 있는가
  □ TODO/TBD/미정 없는가

validation:
  structural:
    min_chars: 10000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "Lorem ipsum", "Segoe UI", "background: #f", "background:#f"]
  semantic:
    - "FO(공개+이용자) 화면이 빠짐없이 구현되었는지 검증"
    - "BO(관리자) 화면이 혼입되지 않았는지 검증"
    - "다크 테마가 적용되었는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
