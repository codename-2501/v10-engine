name: "대화형 UI/UX 설계서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})
  적용 범위: chatbot/llm scope

  ### 필수 섹션 (순서 준수)
  1. **대화 흐름 설계** — 사용자-시스템 간 대화 흐름을 텍스트 기반 다이어그램으로 표현. 진입점, 분기, 종료점 명시. 주요 대화 시나리오별 흐름 작성.
  2. **인텐트/엔티티 정의** — 인텐트 목록 테이블(인텐트명/설명/예시 발화/관련 엔티티)과 엔티티 목록 테이블(엔티티명/유형/예시값/설명) 작성.
  3. **폴백 시나리오** — 인식 실패, 모호한 입력, 범위 외 질문에 대한 대응 전략. 에스컬레이션(상담원 연결) 기준 포함.
  4. **UI 화면 구성** — 채팅 인터페이스 레이아웃, 메시지 버블 디자인, 버튼/캐러셀 등 리치 미디어 UI 요소 설계.
  5. **사용성 원칙** — 대화형 UI의 사용성 원칙(응답 속도, 대화 톤, 접근성, 다국어 지원) 정의.

  ### 품질 기준
  - 인텐트별 최소 3개 예시 발화 포함
  - 폴백 시나리오가 3가지 이상 실패 유형 커버
  - UI 설계에 접근성 고려 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 인텐트별 예시 발화 3개 이상
  □ 폴백 시나리오 3가지 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "대화 흐름 설계"
      - "인텐트/엔티티 정의"
      - "폴백 시나리오"
      - "UI 화면 구성"
      - "사용성 원칙"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "대화 흐름이 모든 주요 사용자 시나리오를 커버하는지 검증"
    - "인텐트/엔티티 정의가 대화 흐름과 일치하는지 검증"
    - "폴백 시나리오가 다양한 실패 유형에 대해 적절한 대응을 제공하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
