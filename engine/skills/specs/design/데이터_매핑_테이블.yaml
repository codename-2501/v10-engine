name: "데이터 매핑 테이블"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **소스/타겟 매핑** — 소스 시스템과 타겟 시스템 간 테이블/필드 단위 매핑을 표 형태로 정리. 소스 테이블명, 소스 필드명, 타겟 테이블명, 타겟 필드명, 매핑 유형(1:1/1:N/변환/결합) 명시
  2. **변환 규칙** — 데이터 변환이 필요한 필드별 변환 로직(수식/함수/조건분기), 변환 예시(Before/After), 예외 처리 규칙을 표 형태로 정리
  3. **데이터 타입 매핑** — 소스와 타겟 간 데이터 타입 변환 규칙(VARCHAR→TEXT, INT→BIGINT 등), 정밀도/스케일 처리, 문자셋 변환을 표 형태로 정리
  4. **기본값 및 Null 처리** — 소스 데이터가 Null이거나 누락된 경우의 기본값 규칙, 필수 필드 Null 발생 시 처리 방안(에러/기본값/스킵)을 표 형태로 정리
  5. **검증 규칙** — 매핑 후 데이터 정합성 검증 항목(건수 일치, 합계 일치, 유니크 제약 등), 검증 방법, 허용 오차, 불일치 시 처리 절차를 표 형태로 정리

  ### 품질 기준
  - 소스/타겟 매핑은 모든 필드를 빠짐없이 포함할 것
  - 변환 규칙은 구체적 수식/함수로 명시하여 즉시 구현 가능할 것
  - 데이터 타입 매핑은 정밀도 손실이 없도록 설계할 것
  - 검증 규칙은 자동화 가능한 수준으로 구체적일 것

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 소스/타겟 필드가 매핑되어 있는가
  □ 변환 규칙이 구체적이고 구현 가능한가
  □ 데이터 타입 변환 시 정밀도 손실이 없는가
  □ Null 처리 규칙이 모든 필수 필드에 정의되어 있는가
  □ 검증 규칙이 데이터 정합성을 보장하는가
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings: ["소스/타겟 매핑", "변환 규칙", "데이터 타입 매핑", "기본값 및 Null 처리", "검증 규칙"]
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "소스/타겟 매핑이 모든 필드를 빠짐없이 포괄하는가"
    - "변환 규칙이 즉시 구현 가능한 수준으로 구체적인가"
    - "데이터 타입 변환 시 정밀도 손실 위험이 없는가"
    - "검증 규칙이 자동화 가능하고 데이터 정합성을 보장하는가"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
