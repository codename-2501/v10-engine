name: "인터페이스 정의서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **인터페이스 목록** — 전체 인터페이스를 내부/외부로 분류. 인터페이스 ID, 이름, 소스 시스템, 타겟 시스템, 방향(단방향/양방향), 중요도를 표 형태로 정리
  2. **프로토콜 정의** — 각 인터페이스별 통신 프로토콜(HTTP/HTTPS/gRPC/WebSocket/MQ 등), 포트, 보안 설정(TLS/mTLS), 타임아웃 값을 표 형태로 정리
  3. **데이터 포맷** — 각 인터페이스별 요청/응답 데이터 구조, 필드 목록, 타입, 길이, 필수 여부, 예시 값을 표 형태로 정리
  4. **에러 처리** — 인터페이스별 에러 코드, 에러 유형(연결 실패/타임아웃/데이터 오류 등), 재시도 정책, 대체 처리(Fallback) 방안을 표 형태로 정리
  5. **SLA 정의** — 각 인터페이스별 응답 시간 목표, 가용성 목표, 처리량(TPS) 기준, 모니터링 방법을 표 형태로 정리

  ### 품질 기준
  - 인터페이스 ID는 체계적 네이밍(예: IF-INT-001, IF-EXT-001)을 사용할 것
  - 프로토콜 정의는 보안 요구사항을 포함할 것
  - 데이터 포맷은 실제 예시 값을 포함할 것
  - SLA는 측정 가능한 수치로 정의할 것

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 시스템 간 인터페이스가 식별되어 있는가
  □ 프로토콜 보안 설정이 적절한가
  □ 데이터 포맷이 양쪽 시스템에서 처리 가능한가
  □ 에러 처리가 모든 실패 유형을 포괄하는가
  □ SLA 수치가 현실적이고 측정 가능한가
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings: ["인터페이스 목록", "프로토콜 정의", "데이터 포맷", "에러 처리", "SLA 정의"]
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 시스템 간 인터페이스가 빠짐없이 정의되어 있는가"
    - "프로토콜 보안 설정이 보안 요구사항을 충족하는가"
    - "에러 처리 정책이 실무에서 운영 가능한가"
    - "SLA 수치가 현실적이고 달성 가능한가"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
