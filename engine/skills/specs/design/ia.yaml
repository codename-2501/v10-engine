name: "IA (정보 구조도)"
phase: DESIGN
type: html
model_preference: opus

# Stage 9: Dynamic Layer Selection — IA 는 PRD + design_system 만 필요 (DB/API 불필요)
context_layers:
  - prd
  - design_system
  - current_task

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  아래 HTML 템플릿 구조에 맞춰 완전한 HTML 문서를 출력하세요.
  {{PROJECT_NAME}}은 프로젝트명으로, {{DATE}}는 오늘 날짜로, {{PROJECT_ID}}는 프로젝트 ID로 대체하세요.
  <!-- CONTENT: --> 주석이 있는 위치에 실제 콘텐츠를 채우세요.
  예시 항목의 패턴을 따라 실제 프로젝트에 맞는 항목들로 채우세요.

  ### HTML 템플릿:
  ```html
  <!DOCTYPE html>
  <html lang="ko">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}} — IA (정보 구조도)</title>
  <style>/* __INJECT_BASE_CSS__ */
  .tree { margin: 16px 0; }
  .tree ul { list-style: none; padding-left: 24px; position: relative; }
  .tree > ul { padding-left: 0; }
  .tree li { position: relative; padding: 6px 0 6px 20px; }
  .tree li::before { content: ''; position: absolute; left: 0; top: 0; width: 1px; height: 100%; background: var(--border); }
  .tree li::after { content: ''; position: absolute; left: 0; top: 18px; width: 14px; height: 1px; background: var(--border); }
  .tree li:last-child::before { height: 18px; }
  .tree > ul > li::before, .tree > ul > li::after { display: none; }
  .tree > ul > li { padding-left: 0; }
  .tree .node { display: inline-block; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 12px; font-size: 13px; }
  .tree .node-root { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .tree .node-section { border-color: var(--blue); color: var(--blue); }
  .access-matrix td, .access-matrix th { text-align: center; font-size: 12px; }
  .access-matrix td:first-child { text-align: left; }
  </style>
  </head>
  <body>
  <div class="toolbar">
    <a class="back" href="javascript:history.back()">← 돌아가기</a>
    <span style="flex:1"></span>
    <button class="dl-btn" onclick="window.print()">PDF 저장</button>
  </div>

  <h1>{{PROJECT_NAME}} — IA (정보 구조도)</h1>
  <div class="meta">
    <span>작성일: {{DATE}}</span>
    <span>프로젝트 ID: {{PROJECT_ID}}</span>
  </div>

  <div class="summary">
    <div class="summary-item"><div class="summary-num blue">0</div><div class="summary-label">페이지</div></div>
    <div class="summary-item"><div class="summary-num green">0</div><div class="summary-label">Depth 1</div></div>
    <div class="summary-item"><div class="summary-num amber">0</div><div class="summary-label">역할</div></div>
  </div>

  <div class="section">
    <h2>1. 서비스 구조</h2>
    <!-- CONTENT: 트리 구조. 아래 패턴으로 중첩하여 작성 -->
    <div class="tree">
      <ul>
        <li><span class="node node-root">홈</span>
          <ul>
            <li><span class="node node-section">대시보드</span>
              <ul>
                <li><span class="node">요약</span></li>
                <li><span class="node">통계</span></li>
              </ul>
            </li>
            <li><span class="node node-section">설정</span></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>

  <div class="section">
    <h2>2. 네비게이션 맵</h2>
    <!-- CONTENT: GNB/LNB 구조 및 네비게이션 규칙 -->
  </div>

  <div class="section">
    <h2>3. URL 구조</h2>
    <!-- CONTENT: URL 패턴. 아래 테이블 패턴 사용 -->
    <table>
      <thead><tr><th>화면</th><th>URL</th><th>인증</th></tr></thead>
      <tbody>
        <tr><td>홈</td><td><code>/</code></td><td>불필요</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>4. 역할별 접근 권한</h2>
    <!-- CONTENT: 접근 권한 매트릭스. 아래 패턴 사용 -->
    <table class="access-matrix">
      <thead><tr><th>페이지</th><th>비회원</th><th>회원</th><th>관리자</th></tr></thead>
      <tbody>
        <tr><td>홈</td><td>O</td><td>O</td><td>O</td></tr>
      </tbody>
    </table>
  </div>

  </body>
  </html>
  ```

  ### 품질 기준
  - 서비스 구조도는 3단계 이상의 깊이로 구성할 것
  - 네비게이션 맵은 모든 GNB/LNB 항목을 포함할 것
  - URL 구조는 일관된 네이밍 규칙을 따를 것
  - 권한 매트릭스는 모든 역할과 모든 주요 기능을 교차하여 표시할 것

  ### 디자인 퀄리티 규칙
  - 반드시 다크 테마: 배경 #111318, 카드 #1a1d24, 텍스트 #eaedf2. 라이트 테마(흰 배경/밝은 배경) 절대 금지
  - body background는 반드시 #111318 계열 다크 톤. #f로 시작하는 밝은 배경색 사용 시 검증 실패
  - Pretendard Variable 웹폰트 사용: font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif
  - @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  - 보라색 그라디언트, 기본 시스템 폰트(Segoe UI), AI스러운 정형화 레이아웃 금지
  - pure black(#000) 금지 — dark grey (#111318~#1c1f27) 사용
  - 넉넉한 여백: 섹션 간 40px 이상, 카드 padding 24px 이상
  - 대담한 타이포 계층: 제목 weight 700~800, letter-spacing -.02em
  - 프로젝트 맥락에 맞는 독창적 톤 적용

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 페이지가 서비스 구조도에 포함되어 있는가
  □ 네비게이션에서 도달 불가능한 페이지가 없는가
  □ URL 구조가 일관된 패턴을 따르는가
  □ 권한별 접근 구조에 누락된 역할이 없는가
  □ 콘텐츠 구조가 서비스 구조도와 일치하는가

validation:
  structural:
    min_chars: 5000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성", "Segoe UI", "background: #f", "background:#f"]

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
