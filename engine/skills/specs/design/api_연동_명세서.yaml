name: "API 연동 명세서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **외부 API 목록** — 연동 대상 외부 API 서비스를 분류. API ID, 서비스명, 제공사, 버전, 용도, 과금 방식, Rate Limit을 표 형태로 정리
  2. **연동 방식** — 각 외부 API별 통신 방식(REST/GraphQL/SOAP/Webhook), 호출 패턴(동기/비동기/배치), 데이터 교환 포맷을 표 형태로 정리
  3. **인증 체계** — 각 외부 API별 인증 방식(API Key/OAuth2/Certificate 등), 인증 정보 관리 방법, 토큰 갱신 절차를 표 형태로 정리
  4. **요청/응답 매핑** — 내부 데이터 모델과 외부 API 스키마 간 필드 매핑, 변환 규칙, 기본값 처리를 표 형태로 정리
  5. **장애 대응** — 외부 API 장애 시 대응 전략(재시도/서킷브레이커/폴백/캐시), 타임아웃 설정, 알림 기준, 수동 복구 절차를 표 형태로 정리

  ### 품질 기준
  - 외부 API 목록은 Rate Limit과 과금 정보를 필수로 포함할 것
  - 인증 정보는 안전한 저장/관리 방법을 명시할 것
  - 요청/응답 매핑은 양방향 변환의 정합성을 보장할 것
  - 장애 대응 전략은 구체적 수치(재시도 횟수, 타임아웃 시간)를 포함할 것

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 외부 API가 목록에 포함되어 있는가
  □ 인증 정보 관리가 보안 요구사항을 충족하는가
  □ 요청/응답 매핑이 데이터 정합성을 보장하는가
  □ 장애 대응 전략이 구체적이고 실행 가능한가
  □ Rate Limit 초과 시 대응 방안이 있는가
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings: ["외부 API 목록", "연동 방식", "인증 체계", "요청/응답 매핑", "장애 대응"]
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "외부 API 목록이 모든 연동 대상을 포괄하는가"
    - "인증 체계가 보안 모범 사례를 따르는가"
    - "요청/응답 매핑이 데이터 무결성을 보장하는가"
    - "장애 대응 전략이 실제 운영 환경에서 유효한가"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
