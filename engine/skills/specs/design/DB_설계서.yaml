name: "DB 설계서"
phase: DESIGN
type: document
model_preference: opus

# Pillar 1 (B) — Dual Output: 인간 검토 MD + 개발자 사용 SQL DDL.
outputs:
  - format: markdown
    file_role: human_review
  - format: sql_ddl
    file_role: developer_consumable
    strict: false  # SQL syntax 는 별도 lint 로 검증 (jsonschema 부적합)
    on_fail: warn

# Stage 9: Dynamic Layer Selection — DB 는 PRD + data flow 필요 (UI design system 불필요)
context_layers:
  - prd
  - current_task
  - data_flow
  - sibling_artifacts

# F4 섹션 분할 — 테이블 10~30개 규모면 정의 섹션이 장문이 되어 절단 위험.
sections:
  - name: "ERD"
    outline: "엔티티 관계도 텍스트 표현. 엔티티·속성·관계(1:1,1:N,N:M), PK/FK 표기"
    target_tokens: 5000
  - name: "테이블 정의"
    outline: "각 테이블별 상세 정의 테이블(컬럼명/데이터타입/제약조건/기본값/설명). NOT NULL·UNIQUE·FK 제약 명시"
    target_tokens: 12000
  - name: "인덱스 설계"
    outline: "테이블(테이블명/인덱스명/컬럼/유형/용도) + 복합 인덱스 전략"
    target_tokens: 4000
  - name: "데이터 마이그레이션 계획"
    outline: "마이그레이션 대상·절차·검증·롤백 계획. 본 섹션 끝에 ---FORMAT:sql_ddl--- 마커 출력 후 모든 테이블에 대한 CREATE TABLE / CREATE INDEX / FOREIGN KEY DDL 작성 (Postgres 14+ 문법 기준, 코드블록(```) 사용 금지)."
    target_tokens: 9000

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **ERD** — 엔티티 관계도를 텍스트 기반으로 표현. 엔티티, 속성, 관계(1:1, 1:N, N:M), PK/FK 표기.
  2. **테이블 정의** — 각 테이블별 상세 정의 테이블(컬럼명/데이터타입/제약조건/기본값/설명). NOT NULL, UNIQUE, FK 제약 명시.
  3. **인덱스 설계** — 테이블(테이블명/인덱스명/컬럼/유형/용도)로 인덱스 전략 정리. 복합 인덱스 포함.
  4. **데이터 마이그레이션 계획** — 마이그레이션 대상, 절차, 검증 방법, 롤백 계획을 테이블 포함 기술.

  ### 품질 기준
  - ERD와 테이블 정의가 완전히 일치
  - 모든 FK가 참조 테이블과 정합
  - 인덱스 설계가 주요 쿼리 패턴을 반영

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ ERD↔테이블 정의 일치 확인
  □ FK 참조 무결성 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "ERD"
      - "테이블 정의"
      - "인덱스 설계"
      - "데이터 마이그레이션 계획"
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "ERD의 엔티티/관계가 테이블 정의와 완전히 일치하는지 검증"
    - "모든 외래키(FK)가 참조 테이블의 기본키(PK)와 정합하는지 검증"
    - "인덱스 설계가 예상 쿼리 패턴과 성능 요구사항을 반영하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
