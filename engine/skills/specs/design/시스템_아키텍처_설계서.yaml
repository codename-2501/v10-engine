name: "시스템 아키텍처 설계서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **시스템 구성도** — 전체 시스템 아키텍처를 텍스트 기반 다이어그램으로 표현. 클라이언트, 서버, DB, 외부 서비스 간 관계 도식화.
  2. **컴포넌트 설계** — 주요 컴포넌트별 역할, 책임, 인터페이스를 테이블(컴포넌트/역할/입력/출력/의존성)로 정리.
  3. **기술 스택 상세** — 레이어별(프론트엔드/백엔드/DB/인프라/AI) 기술 선택 근거와 버전을 테이블로 작성.
  4. **인프라 구성** — 클라우드/온프레미스 구성, 서버 스펙, 네트워크 토폴로지 서술.
  5. **보안 아키텍처** — 인증/인가, 데이터 암호화, 네트워크 보안, API 보안 설계를 테이블 포함 기술.
  6. **성능 설계** — 목표 TPS, 응답시간, 동시접속자 수. 캐싱 전략, 로드밸런싱, DB 최적화 방안 서술.

  ### 품질 기준
  - 시스템 구성도에 모든 핵심 컴포넌트 표현
  - 기술 스택 선택에 대한 근거 명시
  - 성능 설계에 정량적 목표치 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 텍스트 기반 시스템 구성도 존재
  □ 성능 목표치 정량적 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "시스템 구성도"
      - "컴포넌트 설계"
      - "기술 스택 상세"
      - "인프라 구성"
      - "보안 아키텍처"
      - "성능 설계"
    required_tables: 3
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "시스템 구성도가 모든 핵심 컴포넌트와 상호작용을 누락 없이 표현하는지 검증"
    - "기술 스택 선택 근거가 프로젝트 요구사항과 부합하는지 검증"
    - "보안 아키텍처가 인증/인가/암호화/네트워크 보안을 모두 다루는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
