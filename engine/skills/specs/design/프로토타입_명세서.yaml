name: "프로토타입 명세서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **인터랙션 정의** — 각 화면/컴포넌트별 사용자 인터랙션 유형(클릭, 더블클릭, 롱프레스, 드래그 등)과 트리거 조건, 결과 동작을 표 형태로 정리
  2. **애니메이션 및 트랜지션** — 화면 전환, 요소 등장/퇴장, 상태 변화 시 적용할 애니메이션 유형, 지속 시간(ms), 이징(easing) 함수, 딜레이를 표 형태로 정리
  3. **마이크로인터랙션** — 버튼 호버/포커스, 입력 필드 활성화, 토글, 체크박스 등 세부 인터랙션의 시각적 피드백을 상세히 기술
  4. **제스처 정의** — 터치/마우스 제스처(스와이프, 핀치, 회전 등)별 인식 조건, 임계값, 대응 동작을 표 형태로 정리
  5. **피드백 시스템** — 성공/실패/진행 중 등 시스템 상태별 사용자 피드백(토스트, 모달, 스낵바, 진동 등) 유형과 표시 조건을 표 형태로 정리

  ### 품질 기준
  - 애니메이션 지속 시간은 UX 가이드라인(200~500ms)을 준수할 것
  - 이징 함수는 구체적 CSS 함수명(예: ease-in-out, cubic-bezier)으로 명시할 것
  - 제스처 임계값은 구체적 수치(px, ms)로 정의할 것
  - 피드백 시스템은 접근성(스크린 리더 대응)을 고려할 것

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 인터랙션 유형이 정의되어 있는가
  □ 애니메이션 지속 시간이 UX 가이드라인 범위 내인가
  □ 마이크로인터랙션이 일관된 패턴을 따르는가
  □ 제스처 정의가 플랫폼별 표준을 준수하는가
  □ 피드백 시스템이 접근성을 고려하는가
  <!-- SELF_CHECK: {"sections":5,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings: ["인터랙션 정의", "애니메이션 및 트랜지션", "마이크로인터랙션", "제스처 정의", "피드백 시스템"]
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "인터랙션 정의가 모든 주요 사용자 액션을 포괄하는가"
    - "애니메이션 값이 구체적이고 구현 가능한가"
    - "제스처 임계값이 플랫폼 표준에 부합하는가"
    - "피드백 시스템이 접근성 기준을 충족하는가"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
