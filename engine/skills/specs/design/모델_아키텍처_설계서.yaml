name: "모델 아키텍처 설계서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})
  적용 범위: ai_model/vision/prediction scope

  ### 필수 섹션 (순서 준수)
  1. **모델 선택 근거** — 후보 모델 비교 테이블(모델명/아키텍처/파라미터수/성능벤치마크/라이선스/선택근거). 최종 선택 모델과 선정 이유 상세 서술.
  2. **아키텍처 상세** — 모델 아키텍처를 레이어별로 텍스트 기반 다이어그램과 함께 설명. 임베딩, 인코더/디코더, 어텐션, 출력 레이어 등 구성 요소 상세.
  3. **입출력 스키마** — 모델 입력/출력 데이터 스키마를 테이블(필드명/데이터타입/차원/설명/예시)로 정의. 전처리/후처리 파이프라인 포함.
  4. **학습 전략** — 학습 데이터 요구사항, 하이퍼파라미터 설정, 학습 스케줄, 정규화 전략, 분산 학습 전략을 테이블 포함 기술.
  5. **평가 지표** — 모델 성능 평가 지표(정확도/정밀도/재현율/F1/AUC 등)와 목표치, 평가 방법론(교차검증/홀드아웃) 서술.

  ### 품질 기준
  - 모델 선택에 최소 3개 후보 비교
  - 입출력 스키마에 데이터 타입과 차원 정보 필수
  - 평가 지표에 정량적 목표치 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 후보 모델 3개 이상 비교
  □ 평가 지표 정량적 목표치 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모델 선택 근거"
      - "아키텍처 상세"
      - "입출력 스키마"
      - "학습 전략"
      - "평가 지표"
    required_tables: 3
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모델 선택 근거가 프로젝트 요구사항과 성능/비용/라이선스 관점에서 타당한지 검증"
    - "입출력 스키마가 아키텍처 설계와 일치하며 전처리/후처리를 포함하는지 검증"
    - "학습 전략이 데이터 규모와 모델 복잡도에 적합한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
