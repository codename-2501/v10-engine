name: "컴포넌트 정의서"
phase: DESIGN
type: document
model_preference: sonnet

# Stage 9: Dynamic Layer Selection — 컴포넌트는 PRD + design_system + sibling(페이지에서 참조) 필요
context_layers:
  - prd
  - design_system
  - current_task
  - sibling_artifacts

# F4 섹션 분할 (S1-1) — 컴포넌트 15~40개 규모에서 섹션마다 전체 컴포넌트
# 누락 없이 다루도록 outline-first로 리스트 확정.
sections:
  - name: "컴포넌트 분류 체계"
    outline: "Atomic Design 등 분류 원칙·네이밍·디렉토리 + 분류 테이블(레벨/정의/예시/개수)"
    target_tokens: 3000
    min_items: 4
  - name: "컴포넌트 목록"
    outline: "전체 UI 컴포넌트 테이블(컴포넌트ID/컴포넌트명/분류/용도/사용화면/재사용횟수/상태). 최소 15개"
    target_tokens: 8000
    min_items: 15
  - name: "Props 정의"
    outline: "컴포넌트별 Props 테이블(컴포넌트ID/Prop명/타입/필수여부/기본값/설명/유효값). 주요 10개+ 상세"
    target_tokens: 8000
    min_items: 15
  - name: "상태 관리"
    outline: "컴포넌트 내부+전역 상태 테이블(컴포넌트ID/상태명/유형/초기값/트리거/영향범위)"
    target_tokens: 5000
    min_items: 15
  - name: "접근성(A11y)"
    outline: "WAI-ARIA 테이블(컴포넌트ID/ARIA역할/ARIA속성/키보드동작/포커스관리/대체텍스트)"
    target_tokens: 5000
    min_items: 15
  - name: "사용 가이드"
    outline: "주요 컴포넌트 Do/Don't·조합 패턴·사용 예시 코드. 최소 5개 컴포넌트"
    target_tokens: 4000
    min_items: 5

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **컴포넌트 분류 체계** — Atomic Design 등 분류 원칙, 네이밍 컨벤션, 디렉토리 구조를 서술. 분류 테이블(레벨/정의/예시/개수)로 정리.
  2. **컴포넌트 목록** — 전체 UI 컴포넌트를 테이블(컴포넌트ID/컴포넌트명/분류/용도/사용화면/재사용횟수/상태)로 정리. 최소 15개.
  3. **Props 정의** — 컴포넌트별 Props를 테이블(컴포넌트ID/Prop명/타입/필수여부/기본값/설명/유효값)로 작성. 주요 컴포넌트 최소 10개 상세 정의.
  4. **상태 관리** — 컴포넌트별 내부 상태와 전역 상태 의존성을 테이블(컴포넌트ID/상태명/상태유형(local/global)/초기값/변경트리거/영향범위)로 정리.
  5. **접근성(A11y)** — WAI-ARIA 적용 기준, 키보드 네비게이션, 스크린리더 대응을 테이블(컴포넌트ID/ARIA역할/ARIA속성/키보드동작/포커스관리/대체텍스트)로 작성.
  6. **사용 가이드** — 주요 컴포넌트의 사용 예시, Do/Don't 규칙, 조합 패턴을 서술. 최소 5개 컴포넌트에 대해 사용 예시 코드 또는 설명 포함.

  ### 품질 기준
  - 모든 컴포넌트에 고유 ID와 Props 정의 완료
  - 접근성 기준이 WAI-ARIA 표준 준수
  - 상태 관리 전략이 명확
  - 사용 가이드에 Do/Don't 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 컴포넌트 15개 이상
  □ Props 상세 정의 10개 이상
  □ 접근성 기준 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "컴포넌트 분류 체계"
      - "컴포넌트 목록"
      - "Props 정의"
      - "상태 관리"
      - "접근성(A11y)"
      - "사용 가이드"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 컴포넌트에 고유 ID와 Props 정의가 완료되어 있는지 검증"
    - "접근성 기준이 WAI-ARIA 표준을 준수하는지 검증"
    - "상태 관리 전략이 명확히 정의되어 있는지 검증"
    - "사용 가이드에 Do/Don't 규칙이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
