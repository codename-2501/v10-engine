name: "시스템 통합 아키텍처 설계"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **통합 아키텍처** — 전체 시스템 통합 구조를 다이어그램과 함께 기술. 내부 시스템, 외부 시스템, 미들웨어, 메시지 브로커 등 구성 요소 간 관계를 Mermaid flowchart로 표현
  2. **연동 인터페이스** — 각 시스템 간 연동 포인트별 프로토콜(REST/gRPC/SOAP/MQ), 데이터 포맷(JSON/XML/Protobuf), 통신 방식(동기/비동기), 호출 빈도를 표 형태로 정리
  3. **데이터 변환 규칙** — 시스템 간 데이터 매핑 시 변환 규칙, 인코딩, 날짜/시간 포맷, 코드 값 매핑, 단위 변환을 표 형태로 정리
  4. **모니터링 및 운영** — 통합 구간별 모니터링 지표(응답 시간, 처리량, 에러율), 알림 기준, 장애 감지/복구 절차, 로그 수집 전략을 표 형태로 정리

  ### 품질 기준
  - 통합 아키텍처는 단일 장애 지점(SPOF)이 없도록 설계할 것
  - 연동 인터페이스는 재시도/서킷브레이커 패턴을 고려할 것
  - 데이터 변환 규칙은 양방향 변환의 일관성을 보장할 것
  - 모니터링은 SLA 기준치를 포함할 것

  ### 출력 전 자가검증 (MANDATORY)
  □ 통합 아키텍처에 단일 장애 지점이 없는가
  □ 모든 연동 포인트가 식별되어 있는가
  □ 데이터 변환 규칙이 양방향으로 일관된가
  □ 모니터링 지표가 SLA 기준을 포함하는가
  □ 장애 복구 절차가 명확한가
  <!-- SELF_CHECK: {"sections":4,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings: ["통합 아키텍처", "연동 인터페이스", "데이터 변환 규칙", "모니터링 및 운영"]
    required_tables: 3
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "통합 아키텍처에 단일 장애 지점(SPOF)이 없는가"
    - "연동 인터페이스가 장애 대응 패턴(재시도/서킷브레이커)을 포함하는가"
    - "데이터 변환 규칙이 양방향 일관성을 보장하는가"
    - "모니터링 지표가 운영에 충분한가"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
