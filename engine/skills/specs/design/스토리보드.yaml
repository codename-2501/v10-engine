name: "스토리보드"
phase: DESIGN
type: html
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  아래 HTML 템플릿 구조에 맞춰 완전한 HTML 문서를 출력하세요.
  {{PROJECT_NAME}}은 프로젝트명으로, {{DATE}}는 오늘 날짜로, {{PROJECT_ID}}는 프로젝트 ID로 대체하세요.
  <!-- CONTENT: --> 주석이 있는 위치에 실제 콘텐츠를 채우세요.
  예시 항목의 패턴을 따라 실제 프로젝트에 맞는 항목들로 채우세요.

  ### HTML 템플릿:
  ```html
  <!DOCTYPE html>
  <html lang="ko">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}} — 스토리보드</title>
  <style>/* __INJECT_BASE_CSS__ */
  :root { --max-w: 1100px; }
  .flow-row { display: flex; align-items: center; gap: 0; overflow-x: auto; padding: 12px 0; margin: 12px 0; }
  .flow-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 180px; max-width: 220px; flex-shrink: 0; }
  .flow-card .fc-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
  .flow-card .fc-name { font-size: 14px; font-weight: 600; margin: 4px 0; }
  .flow-card .fc-desc { font-size: 12px; color: var(--text-muted); }
  .flow-arrow { font-size: 20px; color: var(--text-muted); padding: 0 8px; flex-shrink: 0; }
  .scenario-title { font-size: 14px; font-weight: 600; margin: 16px 0 4px; }
  .scenario-desc { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
  .state-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin: 2px; }
  .state-default { background: rgba(88,166,255,0.15); color: var(--blue); }
  .state-error { background: rgba(248,81,73,0.15); color: var(--red); }
  .state-success { background: rgba(63,185,80,0.15); color: var(--green); }
  </style>
  </head>
  <body>
  <div class="toolbar">
    <a class="back" href="javascript:history.back()">← 돌아가기</a>
    <span style="flex:1"></span>
    <button class="dl-btn" onclick="window.print()">PDF 저장</button>
  </div>

  <h1>{{PROJECT_NAME}} — 스토리보드 (화면 전환 흐름)</h1>
  <div class="meta">
    <span>작성일: {{DATE}}</span>
    <span>프로젝트 ID: {{PROJECT_ID}}</span>
  </div>

  <div class="summary">
    <div class="summary-item"><div class="summary-num blue">0</div><div class="summary-label">시나리오</div></div>
    <div class="summary-item"><div class="summary-num green">0</div><div class="summary-label">화면 전환</div></div>
    <div class="summary-item"><div class="summary-num red">0</div><div class="summary-label">예외 흐름</div></div>
  </div>

  <div class="section">
    <h2>1. 사용자 시나리오</h2>
    <!-- CONTENT: 시나리오 목록. 아래 패턴 반복 -->
    <div class="scenario-title">S-01. 회원가입 후 첫 이용</div>
    <div class="scenario-desc">신규 사용자가 회원가입 후 온보딩을 거쳐 메인 화면에 도달하는 흐름</div>
  </div>

  <div class="section">
    <h2>2. 화면 흐름</h2>
    <!-- CONTENT: 화면 전환 흐름. 아래 flow-row 패턴 반복 -->
    <p style="font-size:13px;color:var(--text-muted);margin:0 0 4px;">S-01. 회원가입 후 첫 이용</p>
    <div class="flow-row">
      <div class="flow-card">
        <div class="fc-id">SCR-001</div>
        <div class="fc-name">스플래시</div>
        <div class="fc-desc">앱 진입 시 로딩 화면</div>
      </div>
      <div class="flow-arrow">→</div>
      <div class="flow-card">
        <div class="fc-id">SCR-002</div>
        <div class="fc-name">회원가입</div>
        <div class="fc-desc">이메일/소셜 가입</div>
      </div>
      <div class="flow-arrow">→</div>
      <div class="flow-card">
        <div class="fc-id">SCR-003</div>
        <div class="fc-name">홈</div>
        <div class="fc-desc">메인 대시보드</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>3. 상태 전환</h2>
    <!-- CONTENT: 화면별 상태(기본/로딩/에러/빈 상태) 정의 -->
    <table>
      <thead><tr><th>화면</th><th>상태</th><th>조건</th><th>동작</th></tr></thead>
      <tbody>
        <tr><td>홈</td><td><span class="state-badge state-default">기본</span></td><td>데이터 로드 완료</td><td>콘텐츠 표시</td></tr>
        <tr><td>홈</td><td><span class="state-badge state-error">에러</span></td><td>네트워크 오류</td><td>재시도 버튼 표시</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>4. 예외 흐름</h2>
    <!-- CONTENT: 오류, 권한 없음, 세션 만료 등 예외 케이스 흐름 -->
  </div>

  </body>
  </html>
  ```

  ### 품질 기준
  - 시나리오는 Happy Path와 Edge Case를 모두 포함할 것
  - 각 화면 흐름 단계에 소요 시간 추정치를 포함할 것
  - 인터랙션 설명은 구체적인 애니메이션/전환 효과를 명시할 것
  - 예외 처리는 사용자 관점의 복구 방법을 제시할 것

  ### 디자인 퀄리티 규칙
  - 반드시 다크 테마: 배경 #111318, 카드 #1a1d24, 텍스트 #eaedf2. 라이트 테마(흰 배경/밝은 배경) 절대 금지
  - body background는 반드시 #111318 계열 다크 톤. #f로 시작하는 밝은 배경색 사용 시 검증 실패
  - Pretendard Variable 웹폰트 사용: font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif
  - @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  - 보라색 그라디언트, 기본 시스템 폰트(Segoe UI), AI스러운 정형화 레이아웃 금지
  - pure black(#000) 금지 — dark grey (#111318~#1c1f27) 사용
  - 넉넉한 여백: 섹션 간 40px 이상, 카드 padding 24px 이상
  - 대담한 타이포 계층: 제목 weight 700~800, letter-spacing -.02em
  - 프로젝트 맥락에 맞는 독창적 톤 적용

  ### 출력 전 자가검증 (MANDATORY)
  □ 모든 핵심 시나리오가 포함되어 있는가
  □ 각 시나리오의 시작과 끝이 명확한가
  □ 상태 전환에 데드록 상태가 없는가
  □ 예외 상황별 사용자 복구 경로가 제시되어 있는가
  □ 인터랙션 설명이 개발 구현에 충분한가

validation:
  structural:
    min_chars: 5000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성", "Segoe UI", "background: #f", "background:#f"]

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준: {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
