name: "보안 설계서"
phase: DESIGN
type: document
model_preference: opus

# Pillar 1 (B) — Dual Output: 인간 검토 MD + 개발자 사용 IAM/RBAC policy JSON.
outputs:
  - format: markdown
    file_role: human_review
  - format: iam_policy_json
    file_role: developer_consumable
    schema_ref: schemas/iam_policy.json
    strict: true
    on_fail: warn

# F4 섹션 분할 생성 (6개 섹션). 단일 호출로 max_tokens 절단 반복되던
# 문제를 섹션별 독립 호출 + 병합으로 해결. 각 섹션은 target_tokens 범위
# 내에서 완전 생성 → 최종 markdown concat.
sections:
  - name: "보안 아키텍처 개요"
    outline: "전체 시스템 보안 아키텍처 구성도, 보안 계층(네트워크/애플리케이션/데이터), 보안 원칙(최소 권한, 심층 방어)"
    target_tokens: 4000
  - name: "인증 설계"
    outline: "인증 방식(OAuth2.0/JWT/SSO), 인증 흐름, 세션 관리, MFA, 비밀번호 정책을 테이블(항목/설계내용/적용기준/구현방식)로 정리"
    target_tokens: 6000
  - name: "인가 설계"
    outline: "RBAC/ABAC 모델, 역할 정의, 권한 매트릭스를 테이블(역할/리소스/Create/Read/Update/Delete/조건)로 작성. 최소 5개 역할"
    target_tokens: 6000
  - name: "데이터 암호화"
    outline: "전송 중(TLS)/저장 시(AES) 암호화 전략을 테이블(데이터분류/저장위치/암호화방식/키관리/갱신주기)로 정리. 개인정보 항목별 처리 방안 포함"
    target_tokens: 5000
  - name: "ISMS 대응"
    outline: "ISMS-P 인증 기준 대응을 테이블(통제항목/요구사항/현재수준/목표수준/대응방안/담당자)로 작성. 최소 10개 통제항목"
    target_tokens: 8000
  - name: "보안 위협 및 대응"
    outline: "OWASP Top 10 기반 위협 분석을 테이블(위협ID/위협명/위험도/공격시나리오/방어대책/구현상태)로 작성. 10개 전체. 본 섹션 끝에 ---FORMAT:iam_policy_json--- 마커 출력 후 RBAC policy JSON 작성 ({roles: [{name}], permissions: [{resource, actions, roles}]} 형식, actions ∈ {create,read,update,delete,list,execute}, 코드블록(```) 사용 금지)."
    target_tokens: 9000

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **보안 아키텍처 개요** — 전체 시스템의 보안 아키텍처 구성도, 보안 계층(네트워크/애플리케이션/데이터), 보안 원칙(최소 권한, 심층 방어 등)을 서술.
  2. **인증 설계** — 인증 방식(OAuth2.0/JWT/SSO 등), 인증 흐름, 세션 관리, MFA, 비밀번호 정책을 테이블(항목/설계내용/적용기준/구현방식)로 정리.
  3. **인가 설계** — RBAC/ABAC 모델, 역할 정의, 권한 매트릭스를 테이블(역할/리소스/Create/Read/Update/Delete/조건)로 작성. 최소 5개 역할.
  4. **데이터 암호화** — 전송 중(TLS) 및 저장 시(AES) 암호화 전략을 테이블(데이터분류/저장위치/암호화방식/키관리/갱신주기)로 정리. 개인정보 항목별 처리 방안 포함.
  5. **ISMS 대응** — ISMS-P 인증 기준 대응 현황을 테이블(통제항목/요구사항/현재수준/목표수준/대응방안/담당자)로 작성. 최소 10개 항목.
  6. **보안 위협 및 대응** — OWASP Top 10 기반 위협 분석을 테이블(위협ID/위협명/위험도/공격시나리오/방어대책/구현상태)로 작성.

  ### 품질 기준
  - 인증/인가 설계가 구체적 구현 수준으로 기술
  - 데이터 암호화가 분류별로 명확히 정의
  - ISMS-P 통제항목 대응 10개 이상
  - OWASP Top 10 전체 대응 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ ISMS 통제항목 10개 이상
  □ OWASP Top 10 전체 대응

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "보안 아키텍처 개요"
      - "인증 설계"
      - "인가 설계"
      - "데이터 암호화"
      - "ISMS 대응"
      - "보안 위협 및 대응"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "인증/인가 설계가 구체적 구현 수준으로 기술되어 있는지 검증"
    - "데이터 암호화가 분류별로 명확히 정의되어 있는지 검증"
    - "ISMS-P 통제항목 대응이 10개 이상 포함되어 있는지 검증"
    - "OWASP Top 10 전체에 대한 대응이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
