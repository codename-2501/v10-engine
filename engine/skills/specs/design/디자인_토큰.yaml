      "focus_ring": "0 0 0 2px var(--color-primary)"
    },
    "meta": {
      "tone": "프로젝트에 맞는 톤 설명",
      "direction": "bold aesthetic direction (brutalist/minimalist/organic/editorial 등)",
      "industry": "업종",
      "theme": "dark",
      "neutral_tint": "브랜드 색조의 미세 틴트 (chroma 0.005~0.01)",
      "lang": "ko"
    }
  }
  ```

  ### 디자인 규칙 (엄격 준수)
  - 반드시 다크 테마. bg는 oklch 8~12%. 라이트 테마 금지
  - pure black(#000) 금지 — 모든 중성색에 브랜드 색조 미세 틴트
  - 보라색 그라디언트 금지, cyan-on-dark/neon-on-dark 팔레트 금지
  - accent/primary는 다크 배경 위에서 잘 보이는 밝은 톤. 60-30-10 비율 준수
  - 4pt 기반 간격 스케일 (4, 8, 12, 16, 24, 32, 48, 64, 96)
  - surface 계층: bg < surface_1 < surface_2 < surface_3 (밝을수록 높은 레이어)
  - 다크 모드에서 그림자 대신 밝은 서피스 레이어로 깊이 표현
  - WCAG 2.1 AA 대비(본문 4.5:1, 큰 텍스트 3:1) 필수
  - 모션은 transform + opacity만. ease 프리셋 금지, cubic-bezier 커스텀 사용
  - semantic 색상 4종 필수, 각각 기본 + dim 변형 포함

  ### 출력 전 자가검증
  □ 모든 필드가 빠짐없이 채워져 있는가
  □ colors에 최소 14개 키가 있는가
  □ 다크 테마인가 (bg가 #111318 범위)
  □ primary 색상이 프로젝트 맥락에 맞는가
  □ JSON 문법이 유효한가

validation:
  structural:
    min_chars: 1500
    forbidden: ["TODO", "TBD", "미정", "작성 예정"]
  semantic:
    - "JSON 파싱이 가능한 유효한 형식인지 검증"
    - "colors, typography, spacing, breakpoints, effects, meta 6개 섹션 모두 존재하는지 검증"
    - "다크 테마인지 (bg 색상이 #10~#20 범위) 검증"
    - "프로젝트 맥락에 맞는 primary 색상인지 검증"

qa_prompt: |
  위 디자인 토큰 JSON을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  추가 검증:
  - JSON이 유효한가?
  - 모든 필수 키가 존재하는가?
  - 색상 대비가 WCAG AA를 충족하는가?
  - 프로젝트 맥락에 적합한 톤인가?
  판정: PASS 또는 FAIL + 구체적 사유
