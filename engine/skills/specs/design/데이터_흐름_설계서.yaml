name: "데이터 흐름 설계서"
phase: DESIGN
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **데이터 흐름도** — Level 0(Context), Level 1(주요 프로세스), Level 2(상세 프로세스)를 텍스트 기반으로 단계별 표현. 외부 엔티티, 프로세스, 데이터 저장소, 데이터 흐름 명시.
  2. **데이터 저장소 정의** — 각 데이터 저장소의 목적, 저장 데이터 항목, 접근 권한을 테이블(저장소명/유형/주요데이터/접근권한/보존기간)로 정리.
  3. **인터페이스 흐름** — 시스템 간 데이터 교환 흐름을 테이블(소스/목적지/데이터/프로토콜/빈도/형식)로 정리. 동기/비동기 구분.
  4. **데이터 변환 규칙** — 데이터 변환/매핑 규칙을 테이블(원본필드/변환규칙/대상필드/검증조건)로 작성.

  ### 품질 기준
  - DFD Level 0→1→2가 계층적으로 분해
  - 모든 데이터 흐름에 방향과 데이터 항목 명시
  - 데이터 저장소가 DFD와 일치

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ DFD 3단계(Level 0/1/2) 모두 존재
  □ 데이터 저장소↔DFD 일치 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "데이터 흐름도"
      - "데이터 저장소 정의"
      - "인터페이스 흐름"
      - "데이터 변환 규칙"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "DFD의 Level 0/1/2가 계층적으로 일관되게 분해되어 있는지 검증"
    - "데이터 저장소 정의가 DFD에 등장하는 모든 저장소를 포함하는지 검증"
    - "인터페이스 흐름의 소스/목적지가 시스템 아키텍처와 일치하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
