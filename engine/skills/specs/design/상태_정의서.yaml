name: "상태 정의서"
phase: DESIGN
type: document
model_preference: sonnet

# F4 섹션 분할 (S1-1) — 화면별 상태·전환·에러 처리 리스트가 큰 문서.
sections:
  - name: "상태 관리 전략"
    outline: "전역/로컬 상태 관리 방식(Redux/Zustand/Context), 분류 기준, 데이터 흐름"
    target_tokens: 3000
  - name: "화면별 상태 목록"
    outline: "테이블(화면ID/상태명/상태유형/초기값/데이터타입/변경조건/영향컴포넌트). 최소 10개 화면"
    target_tokens: 6000
    min_items: 10
  - name: "상태 전환 정의"
    outline: "테이블(현재상태/이벤트/다음상태/조건/액션/사이드이펙트). 최소 15개"
    target_tokens: 6000
    min_items: 15
  - name: "상태 다이어그램"
    outline: "Mermaid stateDiagram 또는 텍스트 다이어그램 최소 3개"
    target_tokens: 4000
    min_items: 3
  - name: "에러 상태 처리"
    outline: "테이블(에러유형/HTTP코드/상태값/사용자메시지/복구액션/재시도정책/로깅). 최소 10개"
    target_tokens: 4000
    min_items: 10
  - name: "로딩 및 빈 상태"
    outline: "테이블(화면ID/로딩표시/스켈레톤유형/빈상태메시지/빈상태액션)"
    target_tokens: 4000
    min_items: 10

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **상태 관리 전략** — 전역/로컬 상태 관리 방식(Redux/Zustand/Context 등), 상태 분류 기준, 데이터 흐름 방향을 서술.
  2. **화면별 상태 목록** — 각 화면의 상태를 테이블(화면ID/상태명/상태유형/초기값/데이터타입/변경조건/영향컴포넌트)로 정리. 최소 10개 화면.
  3. **상태 전환 정의** — 상태 간 전환 규칙을 테이블(현재상태/이벤트/다음상태/조건/액션/사이드이펙트)로 작성. 최소 15개 전환.
  4. **상태 다이어그램** — 주요 화면/기능의 상태 전환을 Mermaid stateDiagram 또는 텍스트 기반 다이어그램으로 최소 3개 작성.
  5. **에러 상태 처리** — 에러 유형별 상태 처리를 테이블(에러유형/HTTP코드/상태값/사용자메시지/복구액션/재시도정책/로깅여부)로 정리. 최소 10개 에러 유형.
  6. **로딩 및 빈 상태** — 화면별 로딩/스켈레톤/빈 데이터 상태를 테이블(화면ID/로딩표시방식/스켈레톤유형/빈상태메시지/빈상태액션)로 정리.

  ### 품질 기준
  - 모든 화면에 상태 정의 완료
  - 상태 전환에 조건과 액션 명시
  - 에러 상태에 복구 방안 포함
  - 상태 다이어그램이 전환 규칙과 일치

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 화면 10개 이상 상태 정의
  □ 상태 전환 15개 이상
  □ 에러 유형 10개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "상태 관리 전략"
      - "화면별 상태 목록"
      - "상태 전환 정의"
      - "상태 다이어그램"
      - "에러 상태 처리"
      - "로딩 및 빈 상태"
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 화면에 상태 정의가 완료되어 있는지 검증"
    - "상태 전환에 조건과 액션이 명시되어 있는지 검증"
    - "에러 상태에 복구 방안이 포함되어 있는지 검증"
    - "상태 다이어그램이 전환 규칙과 일치하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
