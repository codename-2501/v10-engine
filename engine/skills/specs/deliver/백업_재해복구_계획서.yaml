name: "백업·재해복구"
phase: DELIVER
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **백업 정책** — 백업 대상(DB, 파일, 설정, 모델 아티팩트), 백업 유형(풀/증분/차등), 보존 기간, 암호화 방안을 테이블(대상/유형/주기/보존기간/저장위치/암호화)로 정리.
  2. **백업 주기** — 일별/주별/월별 백업 스케줄, 자동화 도구(cron, AWS Backup 등), 백업 창(window) 시간대를 테이블(백업유형/주기/실행시간/소요시간/자동화도구)로 정리.
  3. **복구 절차** — RTO(Recovery Time Objective)와 RPO(Recovery Point Objective)를 시스템별로 정의. 복구 단계별 절차를 테이블(단계/활동/담당자/예상소요시간/검증방법)로 작성.
  4. **재해 시나리오** — 최소 5개 재해 시나리오(서버 장애, 데이터 손실, 네트워크 단절, 랜섬웨어, 자연재해 등) 정의. 시나리오별 영향도, 대응 전략, 복구 우선순위 명시.
  5. **테스트 계획** — 백업 복구 테스트 일정, 테스트 시나리오, 성공 기준, 테스트 결과 보고 체계를 테이블(테스트항목/시나리오/성공기준/주기/담당)로 작성.

  ### 품질 기준
  - RTO/RPO가 SLA에 부합하는 수치로 정의
  - 재해 시나리오가 현실적이고 대응 전략이 구체적
  - 백업 복구 테스트 계획에 주기적 검증 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ RTO/RPO 수치 명시
  □ 재해 시나리오 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "백업 정책"
      - "백업 주기"
      - "복구 절차"
      - "재해 시나리오"
      - "테스트 계획"
    required_tables: 4
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "RTO/RPO가 SLA 및 비즈니스 요구사항에 부합하는지 검증"
    - "재해 시나리오가 현실적이며 대응 전략이 실행 가능한 수준으로 구체적인지 검증"
    - "백업 복구 테스트 계획이 주기적이며 성공 기준이 명확한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
