name: "데이터 이행 계획서"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **이행 개요** — 데이터 이행 목적, 범위, 전략(Big Bang/단계적), 일정, 관련 시스템을 서술.
  2. **이행 대상** — 이행 대상 데이터를 테이블(이행ID/소스시스템/소스테이블/대상시스템/대상테이블/데이터건수/데이터크기/우선순위)로 정리. 최소 10개 대상.
  3. **데이터 매핑** — 소스→대상 필드 매핑을 테이블(소스테이블/소스필드/소스타입/대상테이블/대상필드/대상타입/변환규칙/기본값/필수여부)로 작성. 주요 테이블 최소 5개.
  4. **검증 방법** — 이행 데이터 검증을 테이블(검증항목/검증방법/검증쿼리/기대결과/허용오차/담당자/자동화여부)로 정리. 건수/합계/샘플 검증 포함.
  5. **이행 절차** — 상세 이행 절차를 테이블(순번/단계/작업내용/수행명령/예상소요시간/담당자/확인사항)로 작성. 최소 10단계.
  6. **롤백 절차** — 이행 실패 시 롤백을 테이블(롤백조건/롤백단계/작업내용/수행명령/데이터복구방법/예상소요시간/담당자)로 정리.

  ### 품질 기준
  - 이행 대상이 빠짐없이 식별
  - 데이터 매핑에 변환 규칙 명시
  - 검증 방법에 자동화 쿼리 포함
  - 롤백 절차가 단계별로 상세

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 이행 대상 10개 이상
  □ 롤백 절차 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "이행 개요"
      - "이행 대상"
      - "데이터 매핑"
      - "검증 방법"
      - "이행 절차"
      - "롤백 절차"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "이행 대상이 빠짐없이 식별되어 있는지 검증"
    - "데이터 매핑에 변환 규칙이 명시되어 있는지 검증"
    - "검증 방법에 자동화 쿼리가 포함되어 있는지 검증"
    - "롤백 절차가 단계별로 상세한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
