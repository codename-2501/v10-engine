name: "배포 계획서"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **배포 개요** — 배포 목적, 대상 시스템, 배포 버전, 주요 변경사항, 영향 범위를 서술.
  2. **배포 일정** — 배포 단계별 일정을 테이블(단계/시작시간/종료시간/소요시간/담당자/주요작업/선행조건/비고)로 작성. 사전준비/배포/검증/안정화 포함.
  3. **배포 환경** — 배포 대상 환경을 테이블(환경명/서버구성/OS/미들웨어/DB/네트워크/접근방법/담당자)로 정리. 개발/스테이징/운영 구분.
  4. **배포 절차** — 상세 배포 절차를 테이블(순번/작업항목/수행명령/확인사항/예상소요시간/담당자/롤백명령)로 작성. 최소 15단계.
  5. **체크리스트** — 배포 전/중/후 체크 항목을 테이블(구분/체크항목/확인방법/담당자/확인결과/비고)로 정리. 최소 20개 항목.
  6. **비상 연락망** — 비상 상황 시 연락 체계를 테이블(역할/담당자/연락처/대체담당자/대체연락처/에스컬레이션순서)로 작성.

  ### 품질 기준
  - 배포 일정이 분 단위로 상세
  - 배포 절차에 롤백 명령 포함
  - 체크리스트가 배포 전/중/후 구분
  - 비상 연락망에 에스컬레이션 체계 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 배포 절차 15단계 이상
  □ 체크리스트 20개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "배포 개요"
      - "배포 일정"
      - "배포 환경"
      - "배포 절차"
      - "체크리스트"
      - "비상 연락망"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "배포 일정이 분 단위로 상세한지 검증"
    - "배포 절차에 롤백 명령이 포함되어 있는지 검증"
    - "체크리스트가 배포 전/중/후로 구분되어 있는지 검증"
    - "비상 연락망에 에스컬레이션 체계가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
