name: "운영 가이드"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **모니터링 대시보드** — 운영 모니터링 대시보드 구성을 테이블(대시보드명/모니터링대상/주요메트릭/갱신주기/접근URL/접근권한/도구)로 정리. 최소 5개 대시보드.
  2. **알림 규칙** — 알림 설정을 테이블(알림ID/알림명/모니터링메트릭/경고임계값/위험임계값/알림채널/알림대상/에스컬레이션/자동복구여부)로 작성. 최소 15개 규칙.
  3. **장애 대응** — 장애 유형별 대응 절차를 테이블(장애유형/증상/심각도/1차대응/2차대응/에스컬레이션/복구목표시간/담당자)로 정리. 최소 10개 장애 유형.
  4. **정기 점검** — 정기 점검 항목을 테이블(점검항목/점검주기(일/주/월)/점검방법/정상기준/담당자/자동화여부/비고)로 작성. 최소 15개 항목.
  5. **운영 절차** — 일상 운영 업무를 테이블(업무ID/업무명/수행주기/수행절차/수행명령/확인사항/담당자)로 정리. 백업/로그관리/용량관리/인증서갱신 포함.
  6. **비상 연락 및 에스컬레이션** — 비상 상황별 연락 체계를 테이블(상황구분/심각도/1차연락/2차연락/3차연락/대응시한/보고체계)로 작성.

  ### 품질 기준
  - 모니터링 메트릭에 임계값 명시
  - 알림 규칙에 에스컬레이션 체계 포함
  - 장애 대응에 복구 목표 시간(RTO) 명시
  - 정기 점검이 자동화 가능 여부 표시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 대시보드 5개 이상
  □ 알림 규칙 15개 이상
  □ 장애 유형 10개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모니터링 대시보드"
      - "알림 규칙"
      - "장애 대응"
      - "정기 점검"
      - "운영 절차"
      - "비상 연락 및 에스컬레이션"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모니터링 메트릭에 임계값이 명시되어 있는지 검증"
    - "알림 규칙에 에스컬레이션 체계가 포함되어 있는지 검증"
    - "장애 대응에 복구 목표 시간(RTO)이 명시되어 있는지 검증"
    - "정기 점검이 자동화 가능 여부가 표시되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
