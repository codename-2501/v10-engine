name: "롤백 계획서"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **롤백 개요** — 롤백 계획 목적, 대상 시스템, 롤백 범위, 관련 배포 버전을 서술.
  2. **롤백 조건** — 롤백을 결정하는 조건을 테이블(조건ID/카테고리/롤백조건/측정방법/임계값/판단권자/자동/수동구분)로 정리. 최소 8개 조건.
  3. **롤백 절차** — 상세 롤백 절차를 테이블(순번/단계/작업내용/수행명령/확인사항/예상소요시간/담당자/주의사항)로 작성. 최소 15단계.
  4. **데이터 복구** — 데이터 복구 방법을 테이블(복구대상/복구방법/백업위치/복구명령/검증방법/예상소요시간/데이터손실범위)로 정리. DB/파일/캐시 등 구분.
  5. **알림 체계** — 롤백 시 알림 프로세스를 테이블(알림대상/알림시점/알림채널/알림내용/담당자/에스컬레이션)로 작성. 내부/외부 이해관계자 구분.
  6. **롤백 후 조치** — 롤백 완료 후 수행할 작업을 테이블(조치항목/수행내용/확인방법/담당자/완료기한/비고)로 정리. 원인분석/재배포계획/보고 포함.

  ### 품질 기준
  - 롤백 조건이 정량적 기준으로 정의
  - 롤백 절차가 실행 가능한 명령 수준으로 상세
  - 데이터 복구에 손실 범위 명시
  - 알림 체계에 에스컬레이션 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 롤백 조건 8개 이상
  □ 롤백 절차 15단계 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "롤백 개요"
      - "롤백 조건"
      - "롤백 절차"
      - "데이터 복구"
      - "알림 체계"
      - "롤백 후 조치"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "롤백 조건이 정량적 기준으로 정의되어 있는지 검증"
    - "롤백 절차가 실행 가능한 명령 수준으로 상세한지 검증"
    - "데이터 복구에 손실 범위가 명시되어 있는지 검증"
    - "알림 체계에 에스컬레이션이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
