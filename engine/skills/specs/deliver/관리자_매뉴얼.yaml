name: "관리자 매뉴얼"
phase: DELIVER
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **관리자 기능 개요** — 관리자 시스템 전체 기능 목록, 접근 방법, 관리자 유형(슈퍼관리자/일반관리자 등)을 서술.
  2. **관리자 기능 상세** — 관리자 기능을 테이블(기능ID/기능명/메뉴경로/설명/필요권한/주의사항)로 정리. 최소 15개 기능.
  3. **시스템 설정** — 시스템 설정 항목을 테이블(설정항목/설정경로/기본값/허용범위/설명/변경영향/변경권한)로 작성. 최소 10개 항목.
  4. **권한 관리** — 역할별 권한 관리를 테이블(역할/권한범위/생성/수정/삭제/조회/승인/설정변경)로 정리. 권한 부여/회수 절차 포함.
  5. **모니터링** — 관리자 모니터링 기능을 테이블(모니터링항목/확인경로/정상범위/경고기준/알림방법/대응절차)로 작성. 대시보드 구성 포함.
  6. **자주 묻는 질문(FAQ)** — 관리자 FAQ를 테이블(번호/질문/답변/관련기능/참고화면)로 정리. 최소 10개 FAQ.

  ### 품질 기준
  - 기능별 메뉴 경로와 접근 방법 명확
  - 설정 변경 시 영향 범위 명시
  - 권한 관리에 CRUD 수준 정의
  - FAQ가 실무에서 자주 발생하는 항목 중심

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 관리자 기능 15개 이상
  □ FAQ 10개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "관리자 기능 개요"
      - "관리자 기능 상세"
      - "시스템 설정"
      - "권한 관리"
      - "모니터링"
      - "자주 묻는 질문(FAQ)"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "기능별 메뉴 경로와 접근 방법이 명확한지 검증"
    - "설정 변경 시 영향 범위가 명시되어 있는지 검증"
    - "권한 관리에 CRUD 수준이 정의되어 있는지 검증"
    - "FAQ가 실무에서 자주 발생하는 항목 중심인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
