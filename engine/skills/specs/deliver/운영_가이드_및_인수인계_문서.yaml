name: "운영 가이드 및 인수인계 문서"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **시스템 운영 절차** — 일상 운영 업무(헬스체크, 로그 확인, 배치 작업), 정기 점검 항목, 운영 체크리스트를 테이블로 정리.
  2. **환경변수/설정 가이드** — 환경별 설정 변경 방법, 설정 파일 위치, 주요 파라미터 설명을 테이블(파라미터/설명/기본값/변경시영향)로 작성.
  3. **백업/복구** — 백업 정책(대상/주기/보존기간/저장위치), 복구 절차(RTO/RPO 기준), 복구 테스트 방법 서술.
  4. **장애 대응** — 장애 유형별 대응 매뉴얼, 에스컬레이션 절차, 장애 보고 양식, 사후 분석 절차 서술.
  5. **담당자 연락처** — 역할별 담당자 연락처를 테이블(역할/이름/소속/연락처/비상연락처/교대일정)로 정리.

  #### 카피라이팅 원칙 (사용자향 문서)
  - 명확함 > 현란함 — 전문 용어 최소화, 사용자 언어 사용
  - 기능이 아닌 혜택 중심 서술
  - 구체적 수치와 예시 포함
  - 섹션당 하나의 핵심 메시지
  - 능동태 사용, 수동태 최소화

  ### 품질 기준
  - 운영 절차가 비전문가도 따를 수 있는 수준
  - 백업/복구에 RTO/RPO 명시
  - 장애 대응에 구체적 커맨드/절차 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ RTO/RPO 명시
  □ 에스컬레이션 절차 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "시스템 운영 절차"
      - "환경변수/설정 가이드"
      - "백업/복구"
      - "장애 대응"
      - "담당자 연락처"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "운영 절차가 단계별로 명확하여 비전문가도 실행 가능한 수준인지 검증"
    - "백업/복구 절차가 RTO/RPO 목표를 충족하는 설계인지 검증"
    - "장애 대응 매뉴얼이 주요 장애 유형을 빠짐없이 커버하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
