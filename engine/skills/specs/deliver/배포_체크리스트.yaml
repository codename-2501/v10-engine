name: "배포 체크리스트"
phase: DELIVER
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **체크리스트 개요** — 배포 체크리스트 목적, 사용 방법, 담당자 역할, 체크 기준(완료/미완료/해당없음)을 서술.
  2. **배포 전 체크** — 배포 전 확인 항목을 테이블(체크ID/카테고리/체크항목/확인방법/담당자/확인결과/확인일시/비고)로 정리. 최소 15개 항목. 코드동결/빌드검증/환경점검/데이터백업 포함.
  3. **배포 중 체크** — 배포 수행 중 확인 항목을 테이블(체크ID/카테고리/체크항목/확인방법/담당자/확인결과/확인일시/비고)로 작성. 최소 10개 항목. 배포순서/서비스상태/로그확인 포함.
  4. **배포 후 체크** — 배포 완료 후 확인 항목을 테이블(체크ID/카테고리/체크항목/확인방법/담당자/확인결과/확인일시/비고)로 정리. 최소 15개 항목. 기능검증/성능확인/모니터링/사용자공지 포함.
  5. **긴급 롤백 판단 기준** — 롤백 판단 기준을 테이블(판단항목/정상기준/롤백기준/확인방법/판단권자/롤백절차)로 작성. 최소 5개 기준.
  6. **서명 및 승인** — 배포 단계별 승인을 테이블(승인단계/승인자/역할/승인일시/서명/비고)로 정리. 배포 전/배포 완료/안정화 완료 승인 포함.

  ### 품질 기준
  - 체크 항목이 배포 전/중/후로 명확히 구분
  - 각 항목에 확인 방법과 담당자 명시
  - 롤백 판단 기준이 정량적
  - 승인 체계가 단계별로 정의

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 배포 전 체크 15개 이상
  □ 배포 후 체크 15개 이상
  □ 롤백 판단 기준 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "체크리스트 개요"
      - "배포 전 체크"
      - "배포 중 체크"
      - "배포 후 체크"
      - "긴급 롤백 판단 기준"
      - "서명 및 승인"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "체크 항목이 배포 전/중/후로 명확히 구분되어 있는지 검증"
    - "각 항목에 확인 방법과 담당자가 명시되어 있는지 검증"
    - "롤백 판단 기준이 정량적인지 검증"
    - "승인 체계가 단계별로 정의되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
