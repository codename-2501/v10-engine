name: "CI/CD 파이프라인 모델"
phase: DELIVER
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **재학습 트리거** — 모델 재학습을 유발하는 조건(데이터 드리프트, 성능 저하, 스케줄, 수동 트리거) 정의. 트리거별 임계값과 감지 방법을 테이블(트리거유형/조건/임계값/감지방법/자동화여부)로 정리.
  2. **파이프라인 단계** — 전체 CI/CD 파이프라인 흐름을 단계별로 기술. 데이터 검증→전처리→학습→평가→패키징→배포 각 단계를 테이블(단계/활동/입력/출력/도구/예상소요시간)로 작성.
  3. **검증 게이트** — 각 단계 사이의 품질 게이트 정의. 통과 기준, 자동/수동 승인 구분을 테이블(게이트위치/검증항목/합격기준/승인방식(자동/수동)/실패시조치)로 작성.
  4. **롤백** — 배포 실패 시 롤백 전략(블루-그린, 카나리, 즉시 롤백), 롤백 트리거 조건, 롤백 절차를 테이블(롤백시나리오/트리거조건/롤백방식/예상소요시간/검증방법)로 정리.

  ### 품질 기준
  - 재학습 트리거에 데이터 드리프트 감지 포함
  - 파이프라인 단계가 E2E로 자동화 가능한 수준으로 구체적
  - 검증 게이트에 모델 성능 메트릭 기준 명시
  - 롤백 전략이 다운타임 최소화 고려

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 재학습 트리거 임계값 수치 명시
  □ 롤백 절차 단계별 기술

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "재학습 트리거"
      - "파이프라인 단계"
      - "검증 게이트"
      - "롤백"
    required_tables: 4
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "재학습 트리거가 데이터 드리프트와 성능 저하를 실시간 감지할 수 있는지 검증"
    - "파이프라인 단계가 완전 자동화 가능한 수준으로 구체적인지 검증"
    - "롤백 전략이 서비스 다운타임을 최소화하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
