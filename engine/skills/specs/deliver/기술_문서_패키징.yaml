name: "기술 문서 패키징"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **문서 목록(인덱스)** — 전체 산출물 목록을 테이블(#/문서명/분류/버전/최종수정일/담당자/파일경로)로 정리. 단계별(기획/설계/개발/테스트/인프라/납품) 분류.
  2. **API 문서 요약** — 주요 API 엔드포인트 요약, 인증 방식, 공통 헤더, 에러 응답 형식 서술. 상세 API 문서 참조 경로 포함.
  3. **데이터 모델 요약** — ERD 요약, 핵심 테이블 목록, 주요 관계, 데이터 딕셔너리 참조 경로 서술.
  4. **아키텍처 요약** — 시스템 아키텍처 요약, 기술 스택 요약, 주요 설계 결정 사항과 근거 서술.

  ### 품질 기준
  - 문서 목록에 모든 프로젝트 산출물 포함
  - 각 요약 섹션에 상세 문서 참조 경로 명시
  - 문서 버전 관리 체계 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 1개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 문서 인덱스에 전체 산출물 포함
  □ 참조 경로 모두 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":1,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "문서 목록(인덱스)"
      - "API 문서 요약"
      - "데이터 모델 요약"
      - "아키텍처 요약"
    required_tables: 1
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "문서 목록이 프로젝트의 모든 산출물을 누락 없이 포함하는지 검증"
    - "요약 섹션이 상세 문서로의 참조 경로를 정확히 제공하는지 검증"
    - "문서 버전 정보가 최신 상태로 관리되고 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
