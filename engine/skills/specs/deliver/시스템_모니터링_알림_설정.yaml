name: "시스템 모니터링 알림 설정"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **모니터링 대상** — 모니터링 대상 시스템/서비스 목록, 수집 지표(CPU/메모리/디스크/네트워크/애플리케이션 메트릭), 수집 주기 정의.
  2. **알림 규칙** — 테이블(지표/조건/임계값(Warning/Critical)/알림채널/담당자/에스컬레이션)로 알림 규칙 정리. 최소 10개 규칙.
  3. **대시보드 구성** — 모니터링 대시보드 레이아웃과 구성 요소(차트/게이지/테이블) 설계. 역할별 대시보드 구분.
  4. **장애 대응 절차** — 장애 등급(P1/P2/P3/P4) 정의, 등급별 대응 절차, 에스컬레이션 체인, 사후 분석(Post-mortem) 절차를 테이블 포함 기술.

  ### 품질 기준
  - 알림 규칙에 Warning/Critical 2단계 임계값
  - 장애 대응 절차에 목표 복구 시간(RTO) 명시
  - 대시보드에 핵심 지표 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 알림 규칙 10개 이상
  □ 장애 등급별 RTO 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "모니터링 대상"
      - "알림 규칙"
      - "대시보드 구성"
      - "장애 대응 절차"
    required_tables: 2
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모니터링 대상이 시스템의 모든 핵심 컴포넌트를 포함하는지 검증"
    - "알림 규칙의 임계값이 SLA 기준과 정합하는지 검증"
    - "장애 대응 절차가 장애 등급별로 명확한 액션과 담당자를 정의하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
