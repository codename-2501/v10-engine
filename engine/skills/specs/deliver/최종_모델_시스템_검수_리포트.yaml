name: "최종 모델 시스템 검수 리포트"
phase: DELIVER
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **검수 기준** — 검수 항목별 합격 기준을 테이블(검수영역/검수항목/합격기준/가중치)로 정의. 기능, 성능, 보안, 품질 영역 포함.
  2. **기능 검수 결과** — 기능별 검수 결과를 테이블(기능ID/기능명/검수항목/합격기준/실제결과/판정(PASS/FAIL))로 작성.
  3. **성능 검수 결과** — 성능 지표별 검수 결과를 테이블(지표/목표치/실측치/판정/비고)로 작성. SLA 대비 달성률 포함.
  4. **보안 검수 결과** — 보안 점검 결과 요약, 미해결 취약점, 보안 등급 판정.
  5. **최종 판정** — 종합 검수 점수, 영역별 판정, 최종 합격/조건부합격/불합격 판정과 근거 서술.

  ### 품질 기준
  - 검수 기준에 정량적 합격 기준 필수
  - 모든 기능에 대한 검수 결과 포함
  - 최종 판정에 객관적 점수와 근거

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 종합 검수 점수 존재
  □ 최종 판정 및 근거 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "검수 기준"
      - "기능 검수 결과"
      - "성능 검수 결과"
      - "보안 검수 결과"
      - "최종 판정"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "검수 기준이 프로젝트 요구사항과 SLA를 모두 반영하는지 검증"
    - "기능/성능/보안 검수 결과가 합격 기준에 따라 객관적으로 판정되었는지 검증"
    - "최종 판정이 영역별 검수 결과를 종합적으로 반영하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
