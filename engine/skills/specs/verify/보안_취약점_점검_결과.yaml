name: "보안 취약점 점검 결과"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **점검 방법론** — 점검 도구(OWASP ZAP/Burp Suite/SonarQube 등), 점검 범위, 점검 기간, 점검 환경 서술.
  2. **OWASP Top 10 체크리스트** — OWASP Top 10 항목별 점검 결과를 테이블(#/취약점유형/점검결과/심각도/비고)로 작성.
  3. **발견 취약점** — 발견된 취약점을 테이블(#/심각도/취약점명/설명/재현절차/영향범위/권장조치/조치기한)로 정리.
  4. **보안 점수** — 전체 보안 점수(100점 기준), 카테고리별 점수, 등급(A/B/C/D/F) 부여 및 근거.
  5. **조치 계획** — 취약점별 조치 일정, 담당자, 검증 방법 서술.

  ### 품질 기준
  - OWASP Top 10 전 항목 점검 결과 포함
  - 취약점에 재현 절차 포함
  - 조치 계획에 기한과 담당자 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 2개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ OWASP Top 10 전 항목 포함
  □ 보안 점수/등급 존재

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":2,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "점검 방법론"
      - "OWASP Top 10 체크리스트"
      - "발견 취약점"
      - "보안 점수"
      - "조치 계획"
    required_tables: 2
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "OWASP Top 10 전 항목에 대한 점검 결과가 빠짐없이 기재되어 있는지 검증"
    - "발견 취약점의 재현 절차가 제3자가 재현 가능한 수준인지 검증"
    - "조치 계획이 심각도에 따른 우선순위와 기한을 반영하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
