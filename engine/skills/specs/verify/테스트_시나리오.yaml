name: "테스트 시나리오"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 시나리오 목록** — 테이블(TC ID/시나리오명/사전조건/테스트단계/기대결과/우선순위/상태) 작성. 최소 20개 테스트 케이스.
  2. **경계값 분석** — 주요 입력 파라미터의 경계값 테스트 케이스. 최소값, 최대값, 경계값±1 시나리오 포함.
  3. **예외 케이스** — 비정상 입력, 네트워크 장애, 타임아웃, 동시성 등 예외 상황 테스트 시나리오 서술.

  ### 품질 기준
  - TC ID 체계 일관성 (예: TC-001)
  - 긍정/부정 테스트 케이스 균형
  - 우선순위별 분류 (Critical/High/Medium/Low)

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 3개 필수 섹션 모두 작성 완료
  □ 테이블 1개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 테스트 케이스 20개 이상
  □ 경계값 분석 포함 확인

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":3,"tables":1,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 시나리오 목록"
      - "경계값 분석"
      - "예외 케이스"
    required_tables: 1
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "테스트 시나리오가 기능 요구사항을 충분히 커버하는지 검증"
    - "경계값 분석이 주요 입력 파라미터를 빠짐없이 다루는지 검증"
    - "예외 케이스가 시스템의 주요 장애 시나리오를 포함하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
