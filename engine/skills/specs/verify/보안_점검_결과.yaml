name: "보안 점검 결과"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **보안 점검 개요** — 점검 목적, 범위, 점검 도구(OWASP ZAP/Burp Suite/SonarQube 등), 점검 기간, 점검자를 서술.
  2. **OWASP Top 10 점검** — OWASP Top 10 항목별 점검 결과를 테이블(순위/취약점명/점검항목/점검방법/발견사항/위험도/조치상태)로 작성. 10개 항목 전체 포함.
  3. **취약점 스캔 결과** — 자동화 스캔 결과를 테이블(취약점ID/카테고리/위치/심각도(Critical/High/Medium/Low)/설명/CVSS점수/발견도구)로 정리.
  4. **침투 테스트 결과** — 침투 테스트 시나리오와 결과를 테이블(시나리오ID/공격유형/공격대상/공격방법/결과/위험도/증거/권고사항)로 작성. 최소 10개 시나리오.
  5. **조치사항** — 발견된 취약점별 조치를 테이블(취약점ID/심각도/조치내용/조치일/조치자/검증결과/잔여리스크)로 정리.
  6. **보안 점검 종합 판정** — 전체 보안 수준을 테이블(점검영역/발견건수/Critical/High/Medium/Low/조치완료/미조치/판정)로 요약. 최종 보안 등급 판정 포함.

  ### 품질 기준
  - OWASP Top 10 전체 항목 점검
  - 취약점에 CVSS 점수 포함
  - 침투 테스트 시나리오 10개 이상
  - 모든 취약점에 조치사항 또는 수용 근거 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ OWASP Top 10 전체 포함
  □ 침투 테스트 10개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "보안 점검 개요"
      - "OWASP Top 10 점검"
      - "취약점 스캔 결과"
      - "침투 테스트 결과"
      - "조치사항"
      - "보안 점검 종합 판정"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "OWASP Top 10 전체 항목이 점검되었는지 검증"
    - "취약점에 CVSS 점수가 포함되어 있는지 검증"
    - "침투 테스트 시나리오가 10개 이상인지 검증"
    - "모든 취약점에 조치사항 또는 수용 근거가 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
