name: "성능 테스트 결과"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **성능 테스트 개요** — 테스트 목적, 대상 시스템, 테스트 도구(JMeter/K6/Locust 등), 테스트 시나리오 개요를 서술.
  2. **응답시간 분석** — 주요 기능별 응답시간을 테이블(기능/API/평균응답시간/P50/P95/P99/최대응답시간/목표값/판정)로 정리. 최소 10개 기능.
  3. **TPS 및 처리량** — 초당 트랜잭션 처리량을 테이블(시나리오/목표TPS/실제TPS/에러율/평균응답시간/CPU사용률/메모리사용률/판정)로 작성.
  4. **동시접속 테스트** — 동시접속 테스트 결과를 테이블(동시사용자수/응답시간/에러율/TPS/서버CPU/서버메모리/DB커넥션/판정)로 단계별 정리. 최소 5단계.
  5. **병목 분석** — 성능 병목 지점을 테이블(병목ID/위치/증상/원인/영향도/개선방안/예상효과/우선순위)로 정리.
  6. **개선방안 및 권고** — 성능 개선 방안을 테이블(개선항목/현재성능/목표성능/개선방법/예상효과/구현난이도/우선순위)로 작성. 단기/중기/장기 구분.

  ### 품질 기준
  - 응답시간에 백분위(P95/P99) 포함
  - TPS 목표 대비 달성 현황 명시
  - 동시접속 단계별 성능 변화 분석
  - 병목 지점별 구체적 개선방안 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 응답시간 분석 10개 이상
  □ 동시접속 5단계 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "성능 테스트 개요"
      - "응답시간 분석"
      - "TPS 및 처리량"
      - "동시접속 테스트"
      - "병목 분석"
      - "개선방안 및 권고"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "응답시간에 백분위(P95/P99)가 포함되어 있는지 검증"
    - "TPS 목표 대비 달성 현황이 명시되어 있는지 검증"
    - "동시접속 단계별 성능 변화가 분석되어 있는지 검증"
    - "병목 지점별 구체적 개선방안이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
