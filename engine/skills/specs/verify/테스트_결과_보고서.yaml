name: "테스트 결과 보고서"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 요약** — 전체 테스트 수행 개요, 기간, 참여 인력, 테스트 유형별 수행 현황을 서술.
  2. **테스트 결과 종합** — 테스트 유형별 결과를 테이블(테스트유형/총케이스/통과/실패/블록/통과율/목표통과율/달성여부)로 정리.
  3. **통과율 분석** — 모듈/기능별 통과율을 테이블(모듈명/총케이스/통과/실패/통과율/주요실패원인/조치상태)로 분석. 통과율 트렌드 포함.
  4. **잔여 결함 현황** — 미해결 결함을 테이블(결함ID/모듈/심각도/상태/발견일/담당자/예상해결일/영향범위/우회방안)로 정리. 심각도별 분포 포함.
  5. **품질 판정** — 출시 판정 기준 대비 결과를 테이블(판정기준/목표값/실제값/달성여부/비고)로 작성. Go/No-Go 판정 포함.
  6. **개선 권고사항** — 테스트 과정에서 발견된 개선 사항을 테이블(구분/개선항목/현재상태/권고사항/우선순위/담당부서)로 정리.

  ### 품질 기준
  - 통과율이 테스트 유형별/모듈별로 분석
  - 잔여 결함에 심각도와 우회방안 포함
  - 품질 판정에 Go/No-Go 근거 명확
  - 개선 권고사항 구체적

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ Go/No-Go 판정 포함
  □ 잔여 결함 현황 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 요약"
      - "테스트 결과 종합"
      - "통과율 분석"
      - "잔여 결함 현황"
      - "품질 판정"
      - "개선 권고사항"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "통과율이 테스트 유형별/모듈별로 분석되어 있는지 검증"
    - "잔여 결함에 심각도와 우회방안이 포함되어 있는지 검증"
    - "품질 판정에 Go/No-Go 근거가 명확한지 검증"
    - "개선 권고사항이 구체적인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
