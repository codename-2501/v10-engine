name: "UAT 시나리오 및 결과"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **UAT 개요** — UAT 목적, 범위, 참여자(현업 담당자), 수행 기간, 승인 프로세스를 서술.
  2. **UAT 시나리오** — 업무 시나리오별 테스트 항목을 테이블(시나리오ID/업무영역/시나리오명/사전조건/수행절차/기대결과/우선순위/담당자)로 작성. 최소 15개 시나리오.
  3. **수행 절차** — 각 시나리오의 상세 수행 단계를 테이블(시나리오ID/단계번호/수행내용/입력데이터/확인항목/스크린샷필요여부)로 정리.
  4. **테스트 결과** — 시나리오별 수행 결과를 테이블(시나리오ID/수행일/수행자/결과(Pass/Fail/Block)/실제결과/비고/결함ID)로 작성.
  5. **결함 및 조치** — 발견된 결함을 테이블(결함ID/시나리오ID/결함내용/심각도/재현절차/조치내용/조치일/확인결과)로 정리.
  6. **승인 기준 및 판정** — UAT 합격 기준을 테이블(기준항목/목표값/실제값/달성여부)로 작성. 최종 승인 여부와 잔여 이슈 목록 포함.

  ### 품질 기준
  - 시나리오가 실제 업무 흐름 기반
  - 수행 절차가 비기술자도 따라할 수 있을 정도로 상세
  - 결과에 Pass/Fail 명확히 기록
  - 승인 기준에 정량적 목표값 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 시나리오 15개 이상
  □ 승인 기준 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "UAT 개요"
      - "UAT 시나리오"
      - "수행 절차"
      - "테스트 결과"
      - "결함 및 조치"
      - "승인 기준 및 판정"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "시나리오가 실제 업무 흐름 기반으로 작성되어 있는지 검증"
    - "수행 절차가 비기술자도 따라할 수 있을 정도로 상세한지 검증"
    - "결과에 Pass/Fail이 명확히 기록되어 있는지 검증"
    - "승인 기준에 정량적 목표값이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
