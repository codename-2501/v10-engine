name: "통합 테스트 결과"
phase: VERIFY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **통합 테스트 개요** — 테스트 목적, 대상 시스템 간 연동 범위, 테스트 접근 방식(Top-Down/Bottom-Up/Big Bang)을 서술.
  2. **시스템 간 연동 테스트** — 연동 테스트 결과를 테이블(연동ID/소스시스템/타겟시스템/연동방식/테스트시나리오/기대결과/실제결과/판정)로 정리. 최소 10개 연동.
  3. **API 응답 검증** — API 호출 결과를 테이블(API엔드포인트/HTTP메서드/요청데이터/응답코드/응답시간/응답데이터검증/판정)로 작성. 최소 15개 API.
  4. **데이터 정합성 검증** — 시스템 간 데이터 일관성을 테이블(검증항목/소스데이터/타겟데이터/매핑규칙/검증방법/검증결과/불일치건수)로 정리.
  5. **에러 처리 검증** — 에러/예외 상황 처리를 테이블(에러시나리오/발생조건/기대동작/실제동작/에러코드/에러메시지/판정)로 작성. 최소 10개 시나리오.
  6. **통합 테스트 종합 판정** — 전체 결과를 테이블(테스트영역/총케이스/통과/실패/통과율/목표통과율/판정)로 요약. 잔여 이슈 및 권고사항 포함.

  ### 품질 기준
  - 시스템 간 모든 연동 포인트 테스트 완료
  - API 응답 시간과 데이터 형식 검증
  - 데이터 정합성 불일치 건수 0건 목표
  - 에러 처리가 설계 기준과 일치

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 연동 테스트 10개 이상
  □ API 검증 15개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "통합 테스트 개요"
      - "시스템 간 연동 테스트"
      - "API 응답 검증"
      - "데이터 정합성 검증"
      - "에러 처리 검증"
      - "통합 테스트 종합 판정"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "시스템 간 모든 연동 포인트가 테스트 완료되었는지 검증"
    - "API 응답 시간과 데이터 형식이 검증되었는지 검증"
    - "데이터 정합성 불일치 건수가 명시되어 있는지 검증"
    - "에러 처리가 설계 기준과 일치하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
