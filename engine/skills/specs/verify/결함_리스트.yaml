name: "결함 리스트"
phase: VERIFY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **결함 관리 개요** — 결함 관리 프로세스, 심각도/우선순위 분류 기준, 결함 생명주기(신규→확인→수정→검증→종료)를 서술.
  2. **결함 목록** — 전체 결함을 테이블(결함ID/모듈/결함제목/심각도(Critical/Major/Minor/Trivial)/우선순위/발견일/발견자/상태/담당자)로 정리. 최소 10개 결함.
  3. **재현 절차** — 결함별 재현 방법을 테이블(결함ID/사전조건/재현단계/기대결과/실제결과/재현율/환경정보)로 작성.
  4. **조치 현황** — 결함별 조치 내용을 테이블(결함ID/원인분석/수정내용/수정일/수정자/검증결과/검증일/최종상태)로 정리.
  5. **결함 통계** — 심각도별/모듈별/상태별 결함 분포를 테이블로 작성. 결함 추이(발견/해결 곡선) 포함.
  6. **미해결 결함 및 대응** — 미해결 결함을 테이블(결함ID/심각도/미해결사유/영향범위/우회방안/예상해결일/리스크)로 정리.

  ### 품질 기준
  - 모든 결함에 고유 ID와 심각도 분류
  - 재현 절차가 구체적이고 재현 가능
  - 조치 현황에 원인분석 포함
  - 미해결 결함에 우회방안 제시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 결함 10개 이상
  □ 심각도 분류 완료

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "결함 관리 개요"
      - "결함 목록"
      - "재현 절차"
      - "조치 현황"
      - "결함 통계"
      - "미해결 결함 및 대응"
    required_tables: 5
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 결함에 고유 ID와 심각도 분류가 있는지 검증"
    - "재현 절차가 구체적이고 재현 가능한지 검증"
    - "조치 현황에 원인분석이 포함되어 있는지 검증"
    - "미해결 결함에 우회방안이 제시되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
