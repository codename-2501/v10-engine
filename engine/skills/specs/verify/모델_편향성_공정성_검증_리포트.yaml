name: "모델 편향성 공정성 검증 리포트"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})
  적용 범위: AI scope only

  ### 필수 섹션 (순서 준수)
  1. **검증 방법론** — 편향성/공정성 평가 프레임워크, 평가 데이터셋 구성(인구통계학적 그룹별), 평가 도구, 평가 기준 서술.
  2. **편향성 지표** — 그룹별 성능 차이를 테이블(그룹/정확도/FPR/FNR/기회균등차이/예측동등차이)로 정리. 통계적 유의성 검정 포함.
  3. **공정성 분석** — 개별 공정성(Individual Fairness), 그룹 공정성(Group Fairness), 반사실적 공정성(Counterfactual Fairness) 분석 결과를 테이블로 제시.
  4. **개선 조치** — 발견된 편향에 대한 완화 전략(재샘플링/재가중치/적대적 학습 등), 적용 결과를 테이블(조치/적용전/적용후/개선율)로 정리.
  5. **모니터링 계획** — 운영 환경에서의 편향성 모니터링 지표, 알림 기준, 재평가 주기 정의.

  ### 품질 기준
  - 편향성 지표에 통계적 유의성 검정 포함
  - 최소 3개 인구통계학적 그룹 비교
  - 개선 조치에 적용 전/후 비교 데이터 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 3개 이상 그룹 비교 데이터
  □ 모니터링 계획 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "검증 방법론"
      - "편향성 지표"
      - "공정성 분석"
      - "개선 조치"
      - "모니터링 계획"
    required_tables: 3
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "편향성 지표가 다양한 인구통계학적 그룹에 대해 공정하게 평가되었는지 검증"
    - "공정성 분석이 개별/그룹/반사실적 공정성을 모두 다루는지 검증"
    - "개선 조치가 측정 가능한 효과와 함께 제시되며 실행 가능한지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
