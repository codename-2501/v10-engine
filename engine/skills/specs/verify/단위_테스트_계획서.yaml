name: "단위 테스트 계획서"
phase: VERIFY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 범위** — 단위 테스트 대상 범위 정의, 테스트 포함/제외 모듈, 우선순위별 테스트 대상 분류.
  2. **대상 모듈** — 테스트 대상 모듈/컴포넌트 목록을 테이블(모듈명/기능설명/우선순위/담당자/의존성)로 정리. 모듈 간 의존 관계 명시.
  3. **테스트 케이스** — 모듈별 테스트 케이스를 테이블(TC-ID/대상모듈/테스트항목/입력값/기대결과/테스트유형(정상/경계/예외))로 작성. 최소 20개 이상.
  4. **자동화 도구** — 테스트 프레임워크, 모킹 도구, CI 연동 방안을 테이블(도구명/용도/버전/라이선스/비고)로 정리.
  5. **커버리지 목표** — 라인/브랜치/함수 커버리지 목표치를 테이블(커버리지유형/목표치/현재치/달성전략)로 정의. 모듈별 최소 커버리지 기준 명시.
  6. **실행 계획** — 단위 테스트 실행 일정, 리그레션 테스트 주기, 결함 대응 프로세스 서술.

  ### 품질 기준
  - 테스트 범위가 기능명세서 대비 누락 없이 대응
  - 테스트 케이스에 정상/경계/예외 시나리오 균형 포함
  - 커버리지 목표가 업계 기준(라인 80% 이상) 충족
  - 자동화 도구 선정에 근거 명시

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 테스트 케이스 20개 이상
  □ 커버리지 목표치 수치 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 범위"
      - "대상 모듈"
      - "테스트 케이스"
      - "자동화 도구"
      - "커버리지 목표"
      - "실행 계획"
    required_tables: 4
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "테스트 범위가 기능명세서의 모든 모듈을 누락 없이 커버하는지 검증"
    - "테스트 케이스가 정상/경계/예외 시나리오를 균형 있게 포함하는지 검증"
    - "커버리지 목표가 현실적이며 달성 전략이 구체적인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
