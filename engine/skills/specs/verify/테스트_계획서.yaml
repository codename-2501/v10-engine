name: "테스트 계획서"
phase: VERIFY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **테스트 개요** — 테스트 목적, 대상 시스템 범위, 테스트 접근 방법론(V-모델/애자일 등), 품질 목표를 서술.
  2. **테스트 범위** — 테스트 대상/비대상을 테이블(구분/모듈명/기능/포함여부/사유/우선순위)로 정리. In-Scope/Out-of-Scope 명확히 구분.
  3. **테스트 전략** — 테스트 유형별 전략을 테이블(테스트유형/목적/기법/도구/커버리지목표/담당자/일정)로 작성. 단위/통합/시스템/성능/보안/UAT 포함.
  4. **테스트 환경** — 테스트 환경 구성을 테이블(환경명/용도/서버사양/OS/DB/네트워크/테스트데이터/접근방법)로 정리. 최소 3개 환경.
  5. **테스트 일정** — 테스트 단계별 일정을 테이블(단계/시작일/종료일/기간/주요활동/산출물/마일스톤/담당자)로 작성. 최소 5개 단계.
  6. **리소스 및 리스크** — 투입 인력과 리스크를 테이블(리스크ID/리스크항목/발생확률/영향도/대응방안/담당자/상태)로 정리. 최소 5개 리스크.

  ### 품질 기준
  - 테스트 범위가 In/Out-of-Scope 명확히 구분
  - 테스트 유형별 전략과 커버리지 목표 명시
  - 테스트 환경이 운영 환경과 차이점 명시
  - 리스크별 대응방안 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 테스트 환경 3개 이상
  □ 테스트 일정 5단계 이상
  □ 리스크 5개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "테스트 개요"
      - "테스트 범위"
      - "테스트 전략"
      - "테스트 환경"
      - "테스트 일정"
      - "리소스 및 리스크"
    required_tables: 5
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "테스트 범위가 In/Out-of-Scope로 명확히 구분되어 있는지 검증"
    - "테스트 유형별 전략과 커버리지 목표가 명시되어 있는지 검증"
    - "테스트 환경이 운영 환경과의 차이점을 명시하고 있는지 검증"
    - "리스크별 대응방안이 포함되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
