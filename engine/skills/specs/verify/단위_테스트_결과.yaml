name: "단위 테스트 결과"
phase: VERIFY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **단위 테스트 개요** — 테스트 범위, 대상 모듈, 테스트 프레임워크(Jest/PyTest/JUnit 등), 실행 환경을 서술.
  2. **모듈별 테스트 결과** — 모듈별 테스트 수행 결과를 테이블(모듈명/테스트파일/총케이스/통과/실패/스킵/통과율/실행시간)로 정리. 최소 10개 모듈.
  3. **코드 커버리지** — 커버리지 측정 결과를 테이블(모듈명/라인커버리지/브랜치커버리지/함수커버리지/목표커버리지/달성여부)로 작성. 전체 평균 포함.
  4. **실패 케이스 분석** — 실패한 테스트를 테이블(테스트ID/모듈/테스트명/실패원인/에러메시지/영향범위/조치방안/상태)로 정리.
  5. **테스트 품질 메트릭** — 테스트 품질을 테이블(메트릭/측정값/목표값/달성여부/비고)로 평가. 커버리지/변이테스트/실행속도 포함.
  6. **개선 필요 영역** — 커버리지 부족/테스트 미작성 영역을 테이블(모듈명/미커버리지영역/사유/개선계획/우선순위/담당자)로 정리.

  ### 품질 기준
  - 모든 모듈에 테스트 결과 기록
  - 코드 커버리지 목표 대비 달성 현황 명시
  - 실패 케이스에 원인과 조치방안 포함
  - 개선 필요 영역 식별 완료

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 6개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 모듈 10개 이상
  □ 커버리지 수치 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":6,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "단위 테스트 개요"
      - "모듈별 테스트 결과"
      - "코드 커버리지"
      - "실패 케이스 분석"
      - "테스트 품질 메트릭"
      - "개선 필요 영역"
    required_tables: 5
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "모든 모듈에 테스트 결과가 기록되어 있는지 검증"
    - "코드 커버리지 목표 대비 달성 현황이 명시되어 있는지 검증"
    - "실패 케이스에 원인과 조치방안이 포함되어 있는지 검증"
    - "개선 필요 영역이 식별 완료되었는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
