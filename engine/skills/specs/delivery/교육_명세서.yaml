name: "교육 명세서"
phase: DELIVERY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **교육 대상** — 교육 대상자 그룹(관리자/운영자/일반사용자), 그룹별 사전 지식 수준, 교육 목표 정의.
  2. **교육 과정** — 커리큘럼 테이블(차수/주제/내용/시간/교육방법/교재/담당강사) 작성. 이론과 실습 구분.
  3. **실습 시나리오** — 교육 중 실습할 시나리오 목록과 상세 절차. 실습 환경 요구사항 포함.
  4. **평가 기준** — 교육 이수 기준, 평가 방법(퀴즈/실습평가/설문), 합격 기준 정의.

  ### 품질 기준
  - 커리큘럼에 시간 배분 포함
  - 실습 시나리오가 실제 업무와 연관
  - 평가 기준이 정량적

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 1개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 커리큘럼 테이블에 시간 배분 존재
  □ 평가 기준 정량적 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":1,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "교육 대상"
      - "교육 과정"
      - "실습 시나리오"
      - "평가 기준"
    required_tables: 1
    min_chars: 1500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "교육 과정이 대상자의 사전 지식 수준에 적합하게 설계되어 있는지 검증"
    - "실습 시나리오가 실제 업무 환경을 반영하는지 검증"
    - "평가 기준이 교육 목표 달성을 측정 가능한 방식으로 정의되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
