name: "프로젝트 완료 보고서"
phase: DELIVERY
type: document
model_preference: opus

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **프로젝트 개요** — 프로젝트 배경, 목적, 범위, 수행 기간, 투입 인력 요약.
  2. **수행 범위** — 계획 대비 실제 수행 범위를 테이블(영역/계획범위/실제수행/달성률/비고)로 정리. 범위 변경 사항 포함.
  3. **일정 대비 실적** — 계획 일정 vs 실제 일정을 테이블(단계/계획시작/계획종료/실제시작/실제종료/차이/사유)로 비교.
  4. **산출물 목록** — 전체 산출물 목록을 테이블(#/산출물명/단계/상태/비고)로 작성.
  5. **이슈/리스크 대응** — 프로젝트 수행 중 발생한 주요 이슈와 리스크, 대응 결과 서술.
  6. **교훈 및 제언** — 프로젝트에서 얻은 교훈(Lessons Learned), 향후 유사 프로젝트를 위한 제언.
  7. **향후 계획** — 운영 이관 후 유지보수 계획, 기능 고도화 로드맵, 후속 프로젝트 제안.

  ### 품질 기준
  - 계획 대비 실적에 정량적 비교 포함
  - 교훈이 구체적 사례 기반
  - 향후 계획에 타임라인 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 7개 필수 섹션 모두 작성 완료
  □ 테이블 3개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 계획 대비 실적 정량 비교 존재
  □ 교훈 구체적 사례 포함

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":7,"tables":3,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "프로젝트 개요"
      - "수행 범위"
      - "일정 대비 실적"
      - "산출물 목록"
      - "이슈/리스크 대응"
      - "교훈 및 제언"
      - "향후 계획"
    required_tables: 3
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "수행 범위와 일정이 계획 대비 정량적으로 비교되어 있는지 검증"
    - "이슈/리스크 대응이 실제 발생 사례와 대응 결과를 포함하는지 검증"
    - "교훈과 제언이 구체적 경험에 기반하며 향후 적용 가능한 수준인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
