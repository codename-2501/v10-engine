name: "사용자 매뉴얼"
phase: DELIVERY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **서비스 개요** — 서비스 소개, 주요 기능 요약, 시스템 요구사항(브라우저/OS/네트워크), 접속 방법 안내.
  2. **주요 기능 사용법** — 화면별/기능별 사용 방법을 단계별로 기술. 각 기능마다 목적, 진입 경로, 조작 절차, 예상 결과 포함. 스크린샷 위치 표시(placeholder).
  3. **FAQ** — 자주 묻는 질문과 답변을 테이블(#/질문/답변/카테고리)로 정리. 최소 10개.
  4. **문의 채널** — 기술 지원 채널(이메일/전화/채팅), 운영 시간, 에스컬레이션 절차 안내.

  #### 카피라이팅 원칙 (사용자향 문서)
  - 명확함 > 현란함 — 전문 용어 최소화, 사용자 언어 사용
  - 기능이 아닌 혜택 중심 서술
  - 구체적 수치와 예시 포함
  - 섹션당 하나의 핵심 메시지
  - 능동태 사용, 수동태 최소화

  ### 품질 기준
  - 비기술자도 이해할 수 있는 쉬운 용어 사용
  - 각 기능에 단계별 조작 절차 포함
  - FAQ 최소 10개 이상

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 4개 필수 섹션 모두 작성 완료
  □ 테이블 1개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ FAQ 10개 이상
  □ 비기술자 대상 용어 사용

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":4,"tables":1,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "서비스 개요"
      - "주요 기능 사용법"
      - "FAQ"
      - "문의 채널"
    required_tables: 1
    min_chars: 2000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "사용법이 비기술자도 따라할 수 있는 수준으로 명확하게 기술되어 있는지 검증"
    - "FAQ가 실제 사용자가 겪을 수 있는 주요 문제를 다루는지 검증"
    - "문의 채널과 지원 절차가 구체적으로 안내되어 있는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
