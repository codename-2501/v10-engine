name: "교육 자료"
phase: DELIVERY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **교육 목표** — 교육 대상자별(운영자, 개발자, 최종사용자) 학습 목표, 선수 지식, 교육 완료 후 기대 역량을 테이블(대상/학습목표/선수지식/기대역량/교육시간)로 정리.
  2. **커리큘럼** — 교육 회차별 상세 커리큘럼을 테이블(회차/주제/내용/교육방법(이론/실습/워크숍)/소요시간/교육자료)로 작성. 최소 5회차 이상.
  3. **실습 자료** — 실습 시나리오별 상세 내용, 실습 환경 구성, 단계별 실습 가이드를 테이블(실습ID/주제/목표/환경/소요시간/난이도)로 작성. 실습 데이터 준비 방안 포함.
  4. **평가** — 교육 효과 평가 방법, 평가 기준, 합격 기준을 테이블(평가항목/평가방법/배점/합격기준/평가시점)로 정리. 교육 만족도 조사 항목 포함.
  5. **FAQ** — 교육 중 예상 질문과 답변을 테이블(번호/질문/답변/카테고리)로 작성. 최소 15개 이상.

  #### 카피라이팅 원칙 (사용자향 문서)
  - 명확함 > 현란함 — 전문 용어 최소화, 사용자 언어 사용
  - 기능이 아닌 혜택 중심 서술
  - 구체적 수치와 예시 포함
  - 섹션당 하나의 핵심 메시지
  - 능동태 사용, 수동태 최소화

  ### 품질 기준
  - 교육 목표가 대상자별로 차별화
  - 커리큘럼에 이론과 실습 균형 배분
  - 실습 자료가 독립적으로 수행 가능한 수준
  - FAQ가 실제 현장에서 발생 가능한 질문 포함

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 5개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 커리큘럼 5회차 이상
  □ FAQ 15개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":5,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "교육 목표"
      - "커리큘럼"
      - "실습 자료"
      - "평가"
      - "FAQ"
    required_tables: 5
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "교육 목표가 대상자별로 적절히 차별화되고 측정 가능한지 검증"
    - "커리큘럼이 이론과 실습을 균형 있게 배분하고 학습 순서가 논리적인지 검증"
    - "FAQ가 실제 현장에서 발생 가능한 실용적 질문을 충분히 포함하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
