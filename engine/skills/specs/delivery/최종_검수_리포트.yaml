name: "최종 검수 리포트"
phase: DELIVERY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **검수 범위** — 검수 대상 시스템/모듈, 검수 제외 항목, 검수 일정, 검수 참여자를 테이블(검수영역/대상시스템/검수항목수/담당자/일정)로 정리.
  2. **기능 검증 결과** — 기능별 검증 결과를 테이블(기능ID/기능명/검수항목/합격기준/실제결과/판정(PASS/FAIL)/비고)로 작성. 결함 발견 시 결함ID 연동.
  3. **성능 검증** — 성능 지표별 검증 결과를 테이블(지표명/SLA목표/실측값/달성률/판정/측정도구)로 작성. 부하 테스트 결과, 응답시간 분포, 처리량 포함.
  4. **보안 검증** — 보안 점검 항목별 결과를 테이블(점검항목/점검방법/결과/위험등급/조치상태)로 작성. OWASP Top 10 등 보안 기준 대비 검증.
  5. **최종 판정** — 영역별 점수 합산, 종합 검수 점수, 최종 합격/조건부합격/불합격 판정. 조건부합격 시 잔여 조건과 이행 기한 명시.

  ### 품질 기준
  - 검수 범위가 요구사항 정의서 대비 완전
  - 기능 검증에 모든 핵심 기능 포함
  - 성능 검증에 SLA 대비 달성률 수치 명시
  - 최종 판정에 객관적 점수 산정 근거

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ 종합 검수 점수 수치 명시
  □ 최종 판정 및 근거 명시

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "검수 범위"
      - "기능 검증 결과"
      - "성능 검증"
      - "보안 검증"
      - "최종 판정"
    required_tables: 4
    min_chars: 2500
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "검수 범위가 프로젝트 요구사항을 누락 없이 포괄하는지 검증"
    - "기능/성능/보안 검증 결과가 합격 기준에 따라 객관적으로 판정되었는지 검증"
    - "최종 판정이 영역별 검증 결과를 정량적으로 종합 반영하는지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
