name: "기술 문서 패키지"
phase: DELIVERY
type: document
model_preference: sonnet

prompt: |
  ## 산출물: {{name}}
  프로젝트 "{{project_name}}" ({{client_name}})

  ### 필수 섹션 (순서 준수)
  1. **README** — 프로젝트 개요, 주요 기능, 기술 스택, 빠른 시작 가이드, 디렉토리 구조, 라이선스 정보. 코드 블록으로 설치/실행 명령어 예시 포함.
  2. **아키텍처 문서** — 시스템 전체 아키텍처, 컴포넌트 관계, 데이터 흐름을 텍스트 기반 다이어그램으로 표현. 기술 의사결정 기록(ADR)을 테이블(결정ID/제목/상태/일자/결정사항/근거)로 작성.
  3. **API 문서** — 전체 API 엔드포인트 목록을 테이블(메서드/경로/설명/인증/요청파라미터/응답코드)로 작성. 주요 API 요청/응답 JSON 예시 포함.
  4. **배포 가이드** — 환경별(개발/스테이징/운영) 배포 절차, 환경 변수 설정, 의존성 설치, 배포 스크립트를 테이블(환경/배포방법/URL/설정파일/담당자)로 정리.
  5. **트러블슈팅** — 빈출 오류 및 해결 방법을 테이블(증상/원인/해결방법/참고자료)로 작성. 최소 10개 이상. 로그 확인 방법, 디버깅 도구 안내 포함.

  ### 품질 기준
  - README가 신규 개발자의 온보딩에 충분
  - API 문서에 요청/응답 예시 포함
  - 배포 가이드가 단계별로 재현 가능
  - 트러블슈팅 항목 10개 이상

  ### 출력 전 자가검증 (MANDATORY)
  아래 전부 충족될 때까지 수정 후 출력:
  □ 5개 필수 섹션 모두 작성 완료
  □ 테이블 4개 이상 포함
  □ TODO/TBD/미정/작성 예정/추후 작성 키워드 없음
  □ API 요청/응답 JSON 예시 존재
  □ 트러블슈팅 항목 10개 이상

  자가검증 결과를 산출물 말미에 첨부:
  <!-- SELF_CHECK: {"sections":5,"tables":4,"pass":true/false} -->

validation:
  structural:
    required_headings:
      - "README"
      - "아키텍처 문서"
      - "API 문서"
      - "배포 가이드"
      - "트러블슈팅"
    required_tables: 4
    min_chars: 3000
    forbidden: ["TODO", "TBD", "미정", "작성 예정", "추후 작성"]
  semantic:
    - "README가 프로젝트 이해와 신규 개발자 온보딩에 충분한 정보를 제공하는지 검증"
    - "API 문서가 모든 엔드포인트를 커버하고 요청/응답 예시가 정확한지 검증"
    - "배포 가이드가 환경별로 재현 가능한 수준으로 구체적인지 검증"

qa_prompt: |
  위 산출물을 검토하세요.
  검증 기준:
  {{semantic_criteria}}
  판정: PASS 또는 FAIL + 구체적 사유
