<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — AX FACTORY</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #111318; --surface: #1c1f27;
      --border: rgba(255,255,255,.06);
      --text: #f0f0f3; --text-2: #b0b4c0; --text-3: #6e7385;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,.12);
      --err: #f87171;
      --r-md: 12px; --r-lg: 16px;
      --ease: cubic-bezier(.23,1,.32,1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { width: 100%; max-width: 400px; padding: 24px; }

    /* Brand */
    .brand { text-align: center; margin-bottom: 48px; }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--accent-dim);
      color: var(--accent); font-weight: 800; font-size: 16px;
      letter-spacing: -.03em;
      margin-bottom: 16px;
    }
    .brand-name {
      font-size: 22px; font-weight: 750; letter-spacing: -.03em;
      color: var(--text);
    }
    .brand-sub {
      font-size: 13px; color: var(--text-3); margin-top: 4px;
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 36px;
    }

    /* Form */
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-2); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 11px 18px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 99px; color: var(--text);
      font-size: 14px; font-family: inherit;
      transition: border-color .15s ease-out, box-shadow .15s;
      outline: none;
    }
    .field input::placeholder { color: var(--text-3); }
    .field input:focus { border-color: rgba(0,212,255,.3); box-shadow: 0 0 0 3px rgba(0,212,255,.08); }

    .submit-btn {
      width: 100%; padding: 12px;
      background: var(--accent); border: none; border-radius: 99px;
      color: #000; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: filter .15s ease-out, transform .1s, box-shadow .15s;
      box-shadow: 0 0 0 0 transparent;
    }
    .submit-btn:hover { filter: brightness(1.12); box-shadow: 0 0 0 4px rgba(0,212,255,.15); }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .err-msg {
      background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.15);
      color: var(--err); border-radius: var(--r-md);
      padding: 10px 14px; font-size: 13px; font-weight: 500;
      margin-bottom: 20px; display: none;
    }

    .hint {
      margin-top: 24px; padding: 14px 16px;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      font-size: 12px; color: var(--text-3); line-height: 1.7;
    }
    .hint strong { color: var(--text-2); font-weight: 600; }
    .hint code {
      background: rgba(0,212,255,.08); padding: 1px 5px;
      border-radius: 4px; font-family: 'SF Mono','Fira Code',monospace;
      font-size: 11px; color: var(--text-2);
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">AX</div>
    <div class="brand-name">AX FACTORY</div>
    <div class="brand-sub">AI Manufacturing Platform</div>
  </div>

  <div class="login-card">
    <div id="error-msg" class="err-msg"></div>
    <div class="field">
      <label>이메일</label>
      <input id="email" type="email" placeholder="admin@platform.local" autocomplete="username">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    </div>
    <button id="login-btn" class="submit-btn" onclick="doLogin()">로그인</button>
    <div class="hint">
      <strong>초기 계정</strong><br>
      이메일 <code>admin@platform.local</code><br>
      비밀번호 <code>admin1234</code>
    </div>
  </div>
</div>

<script>
var t=localStorage.getItem('ai_si_token');
if(t){
  fetch('/api/v1/engagements',{headers:{'Authorization':'Bearer '+t}}).then(function(r){
    if(r.ok){location.href=new URLSearchParams(location.search).get('next')||'/';}
    else{localStorage.removeItem('ai_si_token');localStorage.removeItem('ai_si_user');}
  }).catch(function(){localStorage.removeItem('ai_si_token');localStorage.removeItem('ai_si_user');});
}

document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

async function doLogin(){
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('password').value;
  var btn=document.getElementById('login-btn');
  var err=document.getElementById('error-msg');
  err.style.display='none';
  if(!email||!pw){showErr('이메일과 비밀번호를 입력하세요.');return;}
  btn.disabled=true;btn.textContent='로그인 중...';
  try{
    var r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})});
    var d=await r.json();
    if(!r.ok){showErr(d.detail||'로그인 실패');return;}
    localStorage.setItem('ai_si_token',d.token);
    localStorage.setItem('ai_si_user',JSON.stringify(d.user));
    location.href=new URLSearchParams(location.search).get('next')||'/';
  }catch(e){showErr('서버 연결 오류');}
  finally{btn.disabled=false;btn.textContent='로그인';}
}
function showErr(m){var e=document.getElementById('error-msg');e.textContent=m;e.style.display='block';}
</script>
</body>
</html>
