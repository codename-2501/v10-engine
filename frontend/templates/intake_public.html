<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 접수 — AX FACTORY</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f2;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-dim: #999;
    --accent: #1a1a1a;
    --accent-bg: #1a1a1a;
    --accent-text: #fff;
    --green: #22c55e;
    --red: #e55;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    padding-bottom: 100px;
  }

  .container {
    width: 100%;
    max-width: 720px;
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    padding-top: 40px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .step-indicator { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
  .question { font-size: 32px; font-weight: 800; line-height: 1.35; margin-bottom: 8px; }
  .question-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 40px; }

  /* Option pills */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .options.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .opt-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 60px;
    padding: 18px 32px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    color: var(--text);
    font-family: inherit;
  }
  .opt-btn:hover { border-color: var(--accent); }
  .opt-btn.selected { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-bg); }
  .opt-btn.sm { padding: 10px 18px; font-size: 13px; border-radius: 20px; }

  /* Mode cards */
  .mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .mode-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 40px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 260px;
  }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.08); }
  .mode-card.selected { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-bg); }
  .mode-card-icon { font-size: 40px; margin-bottom: 16px; }
  .mode-card-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .mode-card-desc { font-size: 14px; opacity: 0.6; line-height: 1.5; }

  /* Text input */
  .text-input {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    margin-bottom: 10px;
    font-family: inherit;
    transition: border-color 0.15s;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input::placeholder { color: var(--text-dim); }
  .text-input.error { border-color: var(--red); }
  textarea.text-input { min-height: 100px; resize: vertical; border-radius: var(--radius); }
  select.text-input { cursor: pointer; appearance: none; -webkit-appearance: none; }
  .field-error { font-size: 12px; color: var(--red); margin-top: -6px; margin-bottom: 8px; display: none; }
  .field-error.show { display: block; }

  /* Date picker */
  .date-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .date-row label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; display: block; }
  .date-row select {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    cursor: pointer;
    font-family: inherit;
    appearance: none; -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  .date-row select:focus { border-color: var(--accent); }

  /* Section label */
  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Sub-options */
  .sub-opts {
    background: rgba(26,26,26,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin: 4px 0 8px;
  }
  .sub-opts-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .sub-opts-row { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Yes/No toggle row */
  .yn-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    gap: 12px;
  }
  .yn-row:last-child { border-bottom: none; }
  .yn-q { flex: 1; }
  .yn-q-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .yn-btns { display: flex; gap: 6px; flex-shrink: 0; }

  /* Collapsible section */
  .collapsible-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 8px;
    user-select: none;
    padding: 6px 0;
  }
  .collapsible-toggle .arrow {
    display: inline-block;
    transition: transform 0.25s ease;
    font-size: 11px;
  }
  .collapsible-toggle.open .arrow { transform: rotate(180deg); }
  .collapsible-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease;
    opacity: 0;
  }
  .collapsible-body.open {
    max-height: 2000px;
    opacity: 1;
  }

  /* File upload */
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--card);
    margin-bottom: 10px;
  }
  .file-drop:hover, .file-drop.dragover { border-color: var(--accent); background: rgba(26,26,26,0.03); }
  .file-drop-text { font-size: 14px; color: var(--text-dim); }
  .file-drop-text strong { color: var(--text); }
  .file-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .file-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 13px;
  }
  .file-item-remove { cursor: pointer; color: var(--red); font-weight: 700; font-size: 16px; }

  /* Reference slot */
  .ref-slot {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  .ref-slot input { flex: 1; }

  /* Summary card */
  .summary-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 12px;
  }
  .summary-card h3 {
    font-size: 14px; font-weight: 700; margin-bottom: 12px;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { color: var(--text-dim); }
  .summary-value { font-weight: 600; text-align: right; max-width: 65%; word-break: break-word; }

  .check-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 14px; }
  .check-row input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent); }

  /* Navigation */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 20px 40px;
    background: linear-gradient(transparent, var(--bg) 30%);
    pointer-events: none;
  }
  .nav-btn {
    pointer-events: auto;
    padding: 16px 40px;
    border-radius: 60px;
    font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    border: 2px solid var(--border);
    background: var(--card); color: var(--text);
    font-family: inherit;
  }
  .nav-btn:hover { border-color: var(--accent); }
  .nav-btn.primary { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-bg); }
  .nav-btn.primary:hover { opacity: 0.85; }
  .nav-btn:disabled { opacity: 0.3; pointer-events: none; }
  .nav-btn.hidden { visibility: hidden; }

  /* Progress */
  .progress-wrap {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100; background: var(--bg);
  }
  .progress-bar-bg { height: 3px; background: var(--border); }
  .progress-bar-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; border-radius: 0 2px 2px 0; }
  .progress-steps { display: flex; justify-content: center; gap: 6px; padding: 10px 16px 6px; flex-wrap: wrap; }
  .progress-dot {
    font-size: 11px; color: var(--text-dim);
    padding: 2px 8px; border-radius: 12px;
    white-space: nowrap; transition: all 0.2s; cursor: default;
  }
  .progress-dot.active { color: var(--accent); font-weight: 700; background: rgba(26,26,26,0.08); }
  .progress-dot.done { color: var(--text); cursor: pointer; }

  /* Done */
  .done-screen { text-align: center; padding: 64px 0; }
  .done-icon { font-size: 64px; margin-bottom: 24px; }
  .done-title { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  .done-desc { font-size: 16px; color: var(--text-dim); line-height: 1.6; }
  .done-ref {
    display: inline-block; margin-top: 24px;
    background: rgba(26,26,26,0.06); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 20px;
    font-size: 14px; font-weight: 700;
  }

  /* Feature category */
  .feat-cat-title {
    font-size: 13px; font-weight: 700; color: var(--text-dim);
    margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .feat-cat-title:first-child { margin-top: 0; }

  /* Collapsible step wrapper (design step) */
  .step-collapsible-wrap {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .step-collapsible-wrap:hover { border-color: var(--accent); }
  .step-collapsible-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .step-collapsible-header h3 { font-size: 16px; font-weight: 700; }
  .step-collapsible-header .badge {
    font-size: 12px; color: var(--text-dim);
    background: rgba(26,26,26,0.06); border-radius: 8px; padding: 4px 10px;
  }

  @media (max-width: 640px) {
    body { padding: 16px; padding-bottom: 100px; }
    .question { font-size: 24px; }
    .mode-cards { grid-template-columns: 1fr; }
    .mode-card { min-height: 160px; padding: 32px 24px; border-radius: 24px; }
    .options.grid-2 { grid-template-columns: 1fr; }
    .options.grid-3 { grid-template-columns: 1fr 1fr; }
    .opt-btn { padding: 14px 20px; font-size: 15px; }
    .nav { padding: 16px 20px; }
    .nav-btn { padding: 14px 28px; font-size: 15px; }
    .date-row { grid-template-columns: 1fr; }
    .yn-row { flex-wrap: wrap; }
    .ref-slot { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="progress-wrap" id="progressWrap" style="display:none;">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-steps" id="progressSteps"></div>
</div>

<div class="container" id="app" style="padding-top:8px;"></div>

<div class="nav" id="nav" style="display:none;">
  <button class="nav-btn" id="btnPrev" onclick="prevStep()">이전</button>
  <button class="nav-btn primary" id="btnNext" onclick="nextStep()">다음</button>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" multiple style="display:none;" onchange="handleFiles(this.files)">

<script>
// ============================================================
// STATE
// ============================================================
let mode = null;
let step = 0;
let uploadedFiles = [];

let fd = {
  mode: null,
  // 서비스
  projectName: '', projectSummary: '', projectDesc: '', projectPurpose: '',
  // 서비스 유형 (뭘 만드는가)
  serviceType: [],
  // Yes/No questions (guided)
  needAI: null, needPrediction: null, needIntegration: null,
  needRealtime: null, needCustomModel: null,
  // 범위
  scope: [],
  // 유형 + 세부
  projectTypes: [], projectSubTypes: {},
  // 타겟/활용
  targetUsers: [], useCases: [], expectedKpi: '', deployType: [],
  // 기능 상세 (expert)
  features: [], userScenarios: ['','',''], featuresExtra: '',
  // 데이터
  dataTypes: [], dataReadiness: null, dataVolume: null,
  aiExperience: null, hasExistingDocs: null,
  // 기술 (expert)
  techPreference: null, mlFrameworks: [], dataTools: [], mlopsTools: [],
  infraEnv: [], cicd: [], securityReqs: [], integrations: '', techNotes: '',
  // 백엔드 선택 (Phase F-4)
  backendChoice: 'sql',
  // 디자인
  designTone: [], references: [{url:'',purpose:'both',reason:''}],
  colorPreference: null, keyScreens: '', brandGuide: '', hasBrandGuide: null,
  // 예산
  budget: null, maintenanceBudget: null,
  startDate: { year: '2026', month: '04', period: '월초' },
  endDate: { year: '2026', month: '10', period: '월초' },
  flexSchedule: null, priority: null,
  // 담당자
  contactName: '', contactCompany: '', contactIndustry: '', contactEmail: '',
  contactPhone: '', contactTitle: '', contactDept: '',
  additionalDesc: '', agreePrivacy: false,
};

// Track collapsible states
let collapsibles = {};

// ============================================================
// STEPS
// ============================================================
function getSteps() {
  if (!mode) return ['mode'];
  if (mode === 'expert') {
    return ['mode','service','platform','scope','type','target','features','tech','design','budget','contact','confirm'];
  } else {
    return ['mode','service','platform','problem','data','design','budget','contact','confirm'];
  }
}
function getCurId() { return getSteps()[step]; }
function getStepNum() {
  const id = getCurId();
  if (id === 'mode') return null;
  const steps = getSteps();
  const idx = steps.indexOf(id);
  return idx + ' / ' + (steps.length - 1);
}
const LABELS = {
  service:'서비스', platform:'유형', scope:'범위', type:'분야', target:'활용', features:'기능',
  problem:'문제', data:'데이터', tech:'기술', design:'디자인',
  budget:'예산', contact:'연락처', confirm:'확인'
};

// ============================================================
// RENDER
// ============================================================
function render(keep) {
  const app = document.getElementById('app');
  const nav = document.getElementById('nav');
  const id = getCurId();
  const sy = keep ? window.scrollY : null;

  nav.style.display = id === 'mode' ? 'none' : 'flex';
  document.getElementById('btnPrev').className = id === 'mode' ? 'nav-btn hidden' : 'nav-btn';

  const pw = document.getElementById('progressWrap');
  if (id === 'mode') {
    pw.style.display = 'none';
    app.style.paddingTop = '8px';
  } else {
    pw.style.display = 'block';
    app.style.paddingTop = '52px';
    const steps = getSteps();
    const ci = steps.indexOf(id);
    document.getElementById('progressFill').style.width = Math.round(ci/(steps.length-1)*100)+'%';
    document.getElementById('progressSteps').innerHTML = steps.filter(s=>s!=='mode').map(s=>{
      const ai = steps.indexOf(s);
      const cls = ai===ci?'active':ai<ci?'done':'';
      return `<span class="progress-dot ${cls}" onclick="${cls==='done'?'jump('+ai+')':''}">${LABELS[s]||s}</span>`;
    }).join('');
  }

  const isConfirm = id === 'confirm';
  const btn = document.getElementById('btnNext');
  btn.textContent = isConfirm ? '제출하기' : '다음';
  btn.disabled = !canGo();

  if (!keep) {
    app.style.animation = 'none'; void app.offsetHeight; app.style.animation = 'fadeIn 0.3s ease';
  }
  app.innerHTML = '';

  const renders = {
    mode: rMode, service: rService, platform: rPlatform, scope: rScope, type: rType,
    target: rTarget, features: rFeatures, tech: rTech,
    problem: rProblem, data: rData, design: rDesign,
    budget: rBudget, contact: rContact, confirm: rConfirm,
  };
  if (renders[id]) renders[id](app);
  if (sy !== null) window.scrollTo(0, sy);
}

function jump(i) { if (i < step) { step = i; render(); window.scrollTo(0,0); } }

// ============================================================
// VALIDATION
// ============================================================
function canGo() {
  switch(getCurId()) {
    case 'mode': return !!mode;
    case 'service': return fd.projectName.trim()!=='' && fd.projectSummary.trim()!=='';
    case 'platform': return fd.serviceType.length > 0;
    case 'scope': return fd.scope.length > 0;
    case 'type': return fd.projectTypes.length > 0;
    case 'target': return fd.targetUsers.length > 0 && fd.deployType.length > 0;
    case 'features': return true;
    case 'tech': return true;
    case 'problem': return true;
    case 'data': return true;
    case 'design': return true;
    case 'budget': return !!fd.budget && !!fd.flexSchedule;
    case 'contact': return fd.contactName.trim()&&fd.contactCompany.trim()&&fd.contactEmail.trim()&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fd.contactEmail);
    case 'confirm': return fd.agreePrivacy;
    default: return true;
  }
}
function chk() { document.getElementById('btnNext').disabled = !canGo(); }

// ============================================================
// NAV
// ============================================================
function nextStep() {
  if (!canGo()) return;
  const steps = getSteps();
  if (step < steps.length - 1) { step++; render(); window.scrollTo(0,0); }
  else submit();
}
function prevStep() { if (step > 0) { step--; render(); window.scrollTo(0,0); } }

// ============================================================
// COLLAPSIBLE HELPER
// ============================================================
function toggleCollapsible(key) {
  collapsibles[key] = !collapsibles[key];
  const body = document.getElementById('coll-body-'+key);
  const toggle = document.getElementById('coll-toggle-'+key);
  if (body) body.classList.toggle('open', !!collapsibles[key]);
  if (toggle) toggle.classList.toggle('open', !!collapsibles[key]);
}
function collapsibleHTML(key, label) {
  const open = !!collapsibles[key];
  return `<div class="collapsible-toggle ${open?'open':''}" id="coll-toggle-${key}" onclick="toggleCollapsible('${key}')">
    ${label} <span class="arrow">&#9660;</span>
  </div>
  <div class="collapsible-body ${open?'open':''}" id="coll-body-${key}">`;
}

// ============================================================
// STEP RENDERERS
// ============================================================

// MODE
function rMode(el) {
  el.innerHTML = `
    <div class="question">안녕하세요,<br>어떤 방식으로<br>진행할까요?</div>
    <div class="question-sub"></div>
    <div class="mode-cards">
      <div class="mode-card ${mode==='guided'?'selected':''}" onclick="selMode('guided')">
        <div class="mode-card-icon">💬</div>
        <div class="mode-card-title">맞춤 추천</div>
        <div class="mode-card-desc">몇 가지 질문에 답하시면<br>저희가 구성해드립니다</div>
      </div>
      <div class="mode-card ${mode==='expert'?'selected':''}" onclick="selMode('expert')">
        <div class="mode-card-icon">🎯</div>
        <div class="mode-card-title">직접 구성</div>
        <div class="mode-card-desc">AI 프로젝트 요구사항을<br>직접 상세하게 입력합니다</div>
      </div>
    </div>`;
}
function selMode(m) { mode=m; fd.mode=m; step=1; render(); window.scrollTo(0,0); }

// SERVICE (shared step 1)
function rService(el) {
  let h = `<div class="step-indicator">${getStepNum()}</div>`;
  h += `<div class="question">어떤 프로젝트를<br>의뢰하시나요?</div><div class="question-sub">프로젝트명과 한 줄 요약이 필요합니다</div>`;
  h += `<input class="text-input" placeholder="프로젝트명 * (예: 생산라인 불량 예측 AI 시스템)" value="${x(fd.projectName)}" oninput="fd.projectName=this.value;chk()" id="f-projectName">`;
  h += `<input class="text-input" placeholder="한 줄 요약 * (예: 비전 AI로 불량률 90% 감소를 목표로 하는 제조 품질 관리 시스템)" value="${x(fd.projectSummary)}" oninput="fd.projectSummary=this.value;chk()">`;
  h += `<div class="section-label" style="margin-top:24px;">상세 설명 (선택)</div>`;

  let h = `<div class="step-indicator">${getStepNum()}</div>`;

        <h3>디자인 설정</h3>

      </select>
      <input class="text-input" style="margin-bottom:0;max-width:160px;" placeholder="메모 (선택)" value="${x(ref.reason)}" oninput="fd.references[${i}].reason=this.value">
    </div>`;
  }
  const canAddRef = mode === 'expert' ? fd.references.length < 3 : fd.references.length < 3;
  if (canAddRef) {
    h += `<div style="margin-top:4px;"><span style="font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;" onclick="addRef()">+ 레퍼런스 추가</span></div>`;
  }

  // Color preference
  h += '<div class="section-label" style="margin-top:20px;">색상 선호</div><div class="options grid-2">';
  COLOR_PREFS.forEach(c => {
    h += `<div class="opt-btn ${fd.colorPreference===c?'selected':''}" onclick="fd.colorPreference='${c}';render(true)" style="border-radius:16px;padding:12px 14px;font-size:13px;">${c}</div>`;
  });

  // Collapsible: detailed design settings

  h += `<textarea class="text-input" rows="2" placeholder="예: 대시보드, 로그인, 데이터 입력 화면, 리포트 등" oninput="fd.keyScreens=this.value">${x(fd.keyScreens)}</textarea>`;
  h += '<div class="section-label" style="margin-top:8px;">브랜드 가이드</div>';
  h += `<textarea class="text-input" rows="2" placeholder="브랜드 컬러, 폰트, 로고 가이드라인 등" oninput="fd.brandGuide=this.value">${x(fd.brandGuide)}</textarea>`;
  if (mode === 'expert') {
    h += '<div class="section-label" style="margin-top:8px;">브랜드 가이드 보유 여부</div><div class="options grid-2">';
    ['있음','없음'].forEach(v => {
      h += `<div class="opt-btn ${fd.hasBrandGuide===v?'selected':''}" onclick="fd.hasBrandGuide='${v}';render(true)" style="border-radius:16px;padding:10px 14px;font-size:13px;">${v}</div>`;
    });
    h += '</div>';
  }
  h += '</div>'; // close collapsible body

  return h;

    { title:'프로젝트', rows:[
      ['프로젝트명', fd.projectName],
      ['한 줄 요약', fd.projectSummary],
      ...(fd.projectDesc?[['상세 설명', fd.projectDesc.slice(0,80)+(fd.projectDesc.length>80?'...':'')]]: []),
      ...(fd.projectPurpose?[['프로젝트 목적', fd.projectPurpose]]: []),
    ]},
  ];

  // 서비스 유형 (공통)
  if (fd.serviceType.length) {
    sections.push({title:'서비스 유형', rows:[
      ['플랫폼', fd.serviceType.map(v=>{const t=SERVICE_TYPES.find(s=>s.v===v);return t?t.l:v;}).join(', ')],
    ]});
  }

  if (mode==='expert') {
    sections.push({title:'범위 · 분야', rows:[
      ['업무 범위', fd.scope.map(v=>{const s=SCOPES.find(sc=>sc.v===v);return s?s.l:v;}).join(', ')||'--'],
      ['AI 분야', fd.projectTypes.join(', ')||'--'],
      ...(fd.targetUsers.length?[['사용자', fd.targetUsers.join(', ')]]: []),
      ...(fd.deployType.length?[['배포 형태', fd.deployType.join(', ')]]: []),
      ...(fd.expectedKpi?[['기대 KPI', fd.expectedKpi.slice(0,60)]]: []),
    ]});
    if (fd.features.length) {
      sections.push({title:'기능 상세', rows:[
        ['선택 기능', fd.features.join(', ')],
        ...(fd.userScenarios.filter(s=>s.trim()).length?[['사용 시나리오', fd.userScenarios.filter(s=>s.trim()).join(' / ')]]: []),
      ]});
    }
    sections.push({title:'기술 환경', rows:[
      ['인프라', fd.infraEnv.join(', ')||'미정'],
      ...(fd.mlFrameworks.length?[['ML 프레임워크', fd.mlFrameworks.join(', ')]]: []),
      ...(fd.mlopsTools.length?[['MLOps', fd.mlopsTools.join(', ')]]: []),
      ...(fd.securityReqs.length?[['보안 요건', fd.securityReqs.join(', ')]]: []),
      ...(fd.integrations?[['연동 시스템', fd.integrations]]: []),
    ]});
  } else {
    // Guided mode summary
    const ynMap = {yes:'Yes', no:'No'};
    sections.push({title:'문제 정의', rows:[
      ...(fd.needAI?[['AI/자동화 필요', ynMap[fd.needAI]||'--']]: []),
      ...(fd.needPrediction?[['데이터 분석/예측', ynMap[fd.needPrediction]||'--']]: []),
      ...(fd.needIntegration?[['시스템 연동', ynMap[fd.needIntegration]||'--']]: []),
      ...(fd.needRealtime?[['실시간 처리', ynMap[fd.needRealtime]||'--']]: []),
      ...(fd.needCustomModel?[['커스텀 모델', ynMap[fd.needCustomModel]||'--']]: []),
      ...(fd.scope.length?[['업무 범위', fd.scope.map(v=>{const s=SCOPES.find(sc=>sc.v===v);return s?s.l:v;}).join(', ')]]: []),
    ]});
    sections.push({title:'데이터·환경', rows:[
      ...(fd.aiExperience?[['AI 경험', fd.aiExperience]]: []),
      ...(fd.hasExistingDocs?[['자료 보유', fd.hasExistingDocs]]: []),
      ...(fd.dataTypes.length?[['데이터 유형', fd.dataTypes.join(', ')]]: []),
      ...(fd.dataReadiness?[['준비도', fd.dataReadiness]]: []),
      ...(fd.dataVolume?[['규모', fd.dataVolume]]: []),
      ...(uploadedFiles.length?[['첨부 파일', uploadedFiles.map(f=>f.name).join(', ')]]: []),
    ]});
  }

  // Design
  const designRows = [];
  if (fd.designTone.length) designRows.push(['디자인 톤', fd.designTone.join(', ')]);
  if (fd.colorPreference) designRows.push(['색상', fd.colorPreference]);
  const validRefs = fd.references.filter(r=>r.url.trim());
  if (validRefs.length) designRows.push(['레퍼런스', validRefs.map(r=>r.url).join(', ')]);
  if (fd.keyScreens) designRows.push(['주요 화면', fd.keyScreens.slice(0,60)]);
  if (designRows.length) {
    sections.push({title:'디자인', rows: designRows});
  }

  sections.push({title:'예산 · 일정', rows:[
    ['예산', fd.budget||'--'],
    ...(fd.maintenanceBudget?[['운영 예산', fd.maintenanceBudget]]: []),
    ['시작', fd.startDate.year+'.'+fd.startDate.month+' '+fd.startDate.period],
    ['완료', fd.endDate.year+'.'+fd.endDate.month+' '+fd.endDate.period],
    ['일정 조율', fd.flexSchedule||'--'],
    ...(fd.priority?[['우선순위', fd.priority]]: []),
  ]});
  sections.push({title:'담당자', rows:[
    ['이름', fd.contactName],
    ['회사', fd.contactCompany],
    ...(fd.contactIndustry?[['업종', fd.contactIndustry]]: []),
    ['이메일', fd.contactEmail],
    ...(fd.contactPhone?[['연락처', fd.contactPhone]]: []),
    ...(fd.contactTitle?[['직함', fd.contactTitle]]: []),
    ...(fd.contactDept?[['부서', fd.contactDept]]: []),
  ]});

  sections.forEach(s => {
    h += `<div class="summary-card"><h3>${s.title}</h3>`;
    s.rows.forEach(([k,v]) => {
      h += `<div class="summary-row"><span class="summary-label">${k}</span><span class="summary-value">${x(v)}</span></div>`;
    });
    h += '</div>';
  });

  // Additional desc
  h += '<div class="section-label" style="margin-top:16px;">추가 요청사항 (선택)</div>';
  h += `<textarea class="text-input" rows="2" placeholder="기타 요청, 미팅 희망 일정, 보안 요건 등" oninput="fd.additionalDesc=this.value">${x(fd.additionalDesc)}</textarea>`;

  h += `<div class="summary-card" style="margin-top:12px;">
    <div class="check-row">
      <input type="checkbox" id="agree" ${fd.agreePrivacy?'checked':''} onchange="fd.agreePrivacy=this.checked;chk()">
      <label for="agree" style="cursor:pointer;font-size:14px;">수집된 정보는 프로젝트 상담 목적으로만 사용되며 제3자에게 제공되지 않습니다.</label>
    </div>
  </div>`;

  el.innerHTML = h;
}

// ============================================================
// SUBMIT
// ============================================================
async function submit() {
  const btn = document.getElementById('btnNext');
  btn.disabled = true;
  btn.textContent = '제출 중...';

  const subTypes = Object.entries(fd.projectSubTypes).map(([k,v])=>k+': '+v.join(', ')).join(' | ');
  const validRefs = fd.references.filter(r=>r.url.trim());

  try {
    const res = await fetch('/api/v1/intake/public', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contact_name: fd.contactName,
        contact_role: fd.contactTitle,
        contact_email: fd.contactEmail,
        contact_phone: fd.contactPhone,
        contact_dept: fd.contactDept,
        company_name: fd.contactCompany,
        industry: fd.contactIndustry,
        project_name: fd.projectName,
        project_summary: fd.projectSummary,
        project_purpose: fd.projectPurpose,
        problem_desc: fd.projectDesc,
        mode: fd.mode,
        service_type: fd.serviceType,
        scope: fd.scope,
        project_types: fd.projectTypes,
        project_subtypes: subTypes,
        // guided yes/no
        need_ai: fd.needAI,
        need_prediction: fd.needPrediction,
        need_integration: fd.needIntegration,
        need_realtime: fd.needRealtime,
        need_custom_model: fd.needCustomModel,
        ai_experience: fd.aiExperience,
        has_existing_docs: fd.hasExistingDocs,
        // expert
        target_users: fd.targetUsers,
        deploy_type: fd.deployType,
        use_cases: fd.useCases,
        expected_kpi: fd.expectedKpi,
        features: fd.features,
        user_scenarios: fd.userScenarios.filter(s=>s.trim()),
        features_extra: fd.featuresExtra,
        ml_frameworks: fd.mlFrameworks,
        data_tools: fd.dataTools,
        mlops_tools: fd.mlopsTools,
        infra_env: fd.infraEnv,
        security_reqs: fd.securityReqs,
        integrations: fd.integrations,
        tech_notes: fd.techNotes,
        // design
        design_tone: fd.designTone,
        references: validRefs,
        color_preference: fd.colorPreference,
        key_screens: fd.keyScreens,
        brand_guide: fd.brandGuide,
        has_brand_guide: fd.hasBrandGuide,
        // data
        data_types: fd.dataTypes,
        data_readiness: fd.dataReadiness,
        data_volume: fd.dataVolume,
        // budget
        budget_range: fd.budget,
        maintenance_budget: fd.maintenanceBudget,
        start_date: fd.startDate.year+'.'+fd.startDate.month+' '+fd.startDate.period,
        end_date: fd.endDate.year+'.'+fd.endDate.month+' '+fd.endDate.period,
        flex_schedule: fd.flexSchedule,
        priority: fd.priority,
        additional_notes: fd.additionalDesc,
        uploaded_files: uploadedFiles.map(f=>f.name),
      }),
    });
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.detail||'서버 오류'); }
    const data = await res.json();
    showDone(data.id);
  } catch(err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = '제출하기';
  }
}

function showDone(id) {
  document.getElementById('progressWrap').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  const app = document.getElementById('app');
  app.style.animation = 'none'; void app.offsetHeight; app.style.animation = 'fadeIn 0.4s ease';
  const ref = id ? id.slice(0,8).toUpperCase() : '--';
  app.innerHTML = `<div class="done-screen">
    <div class="done-icon">✅</div>
    <div class="done-title">접수가 완료됐습니다</div>
    <div class="done-desc">담당 컨설턴트가 1-2 영업일 내 연락 드리겠습니다.<br>제출하신 이메일로 확인 메일이 발송됩니다.</div>
    <div class="done-ref">접수 번호: ${ref}</div>
    <div style="margin-top:32px;">
      <button class="opt-btn" style="padding:14px 36px;font-size:15px;border-radius:60px;" onclick="location.reload()">새 접수 신청</button>
    </div>
  </div>`;
}

// ============================================================
// FILE UPLOAD
// ============================================================
function renderFileUpload() {
  let h = `<div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
    <div class="file-drop-text"><strong>파일을 드래그하거나 클릭</strong>하여 업로드<br><span style="font-size:12px;">PDF, Excel, 이미지 등</span></div>
  </div>`;
  if (uploadedFiles.length) {
    h += '<div class="file-list">';
    uploadedFiles.forEach((f, i) => {
      h += `<div class="file-item"><span>${x(f.name)} <span style="color:var(--text-dim);font-size:11px;">(${fmtSize(f.size)})</span></span><span class="file-item-remove" onclick="removeFile(${i})">✕</span></div>`;
    });
    h += '</div>';
  }
  return h;
}

function initDropZone() {
  const drop = document.getElementById('fileDrop');
  if (!drop) return;
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => { drop.classList.remove('dragover'); });
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
}

function handleFiles(fileList) {
  for (let i = 0; i < fileList.length; i++) {
    uploadedFiles.push(fileList[i]);
  }
  render(true);
}

function removeFile(idx) {
  uploadedFiles.splice(idx, 1);
  render(true);
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1048576).toFixed(1) + 'MB';
}

// ============================================================
// PHONE FORMATTING
// ============================================================
function fmtPhone(val) {
  const nums = val.replace(/\D/g, '').slice(0, 11);
  if (nums.length <= 3) return nums;
  if (nums.length <= 7) return nums.slice(0,3) + '-' + nums.slice(3);
  return nums.slice(0,3) + '-' + nums.slice(3,7) + '-' + nums.slice(7);
}

// ============================================================
// UTILS
// ============================================================
function tog(arr, val) {
  const i=arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  render(true);
}
function x(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

render();
</script>
