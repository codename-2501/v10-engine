[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-si-manufacturing-platform-v9"
version = "9.0.0"
description = "AI SI 매뉴팩처링 플랫폼 v9 — Claude 기반 SI 프로젝트 산출물 자동 생성 엔진 (보안강화·성능최적화·테스트강화)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiohttp>=3.9.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "prometheus_client>=0.20.0",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ai-si-platform = "run:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*", "frontend*"]
